<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Role Play Face Test</title>
<!-- A TEST PAGE, not part of the board (Frank, 2026-09-29: "3d face").
     One 3D face (TalkingHead, MIT) speaking through the same Deepgram
     voices Role Play uses (/api/roleplay/speak), so Frank can judge how it
     looks and how much it delays each reply before anything goes into
     Role Play itself. The face is MPFB's example avatar (CC0, public
     domain -- the other TalkingHead samples are non-commercial only),
     shrunk from 37 MB to 3 MB (faces/README.md). Nothing links here. -->
<style>
:root { --bg: #fafaf8; --surface: #fff; --border: #d8d8d2; --text: #1b1b1a; --muted: #6b6b66; --accent: #2a78d6; --good: #1f9d55; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #141413; --surface: #1e1e1c; --border: #3a3a36; --text: #eeeee8; --muted: #a0a09a; --accent: #5a9ae8; --good: #3ecf7f; } }
:root[data-theme="dark"] { --bg: #141413; --surface: #1e1e1c; --border: #3a3a36; --text: #eeeee8; --muted: #a0a09a; --accent: #5a9ae8; --good: #3ecf7f; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 980px; margin: 0 auto; padding: 20px 16px 40px; }
h1 { font-size: 18px; margin: 0 0 4px; }
.sd { color: var(--muted); margin: 0 0 14px; font-size: 13px; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
#avatar { width: 100%; aspect-ratio: 1 / 1; border-radius: 8px; background: linear-gradient(#dfe6ee, #c9d3de); position: relative; overflow: hidden; }
#loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #333; font-size: 13px; }
label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
select, textarea { width: 100%; font: inherit; padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); }
textarea { resize: vertical; min-height: 70px; }
.lines { display: flex; flex-direction: column; gap: 6px; }
.lines button { text-align: left; }
button { font: inherit; font-size: 13px; padding: 7px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
button:disabled { opacity: .5; cursor: default; }
.timing { margin-top: 12px; font-size: 13px; }
.timing table { width: 100%; border-collapse: collapse; }
.timing td { padding: 4px 0; border-bottom: 1px solid var(--border); }
.timing td:last-child { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.err { color: #c0392b; font-size: 13px; margin-top: 8px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js/+esm",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
  "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@b3e277b3b46f88e557bf28a2c5612a5b04e075c3/modules/talkinghead.mjs"
} }
</script>
</head>
<body>
<main>
  <h1>Role Play face test</h1>
  <p class="sd">A 3D face speaking with Role Play's Deepgram voices. This is a test only: the board doesn't use it
    and producers can't see it. Pick a voice, press a line, and watch the lips and the timing underneath.</p>
  <div class="grid">
    <div class="card"><div id="avatar"><div id="loading">Loading the face…</div></div></div>
    <div class="card">
      <label for="voice">Voice (women only, because this face is a woman)</label>
      <select id="voice"></select>
      <label for="mood">Mood</label>
      <select id="mood">
        <option value="neutral">Neutral</option>
        <option value="happy">Happy (Beginner)</option>
        <option value="angry">Annoyed (Professional)</option>
      </select>
      <label>Sample lines</label>
      <div class="lines" id="lines"></div>
      <label for="text">Or type your own</label>
      <textarea id="text" maxlength="600">I already have insurance, but sure, go ahead. What were you going to tell me?</textarea>
      <div style="margin-top:10px"><button class="primary" id="speak" type="button" disabled>Speak</button></div>
      <div class="timing" id="timing"></div>
      <div class="err" id="err"></div>
    </div>
  </div>
</main>
<script type="module">
import { TalkingHead } from "talkinghead";

// The women's voices from Role Play's RP_VOICES (site/public/index.html).
const VOICES = [
  ["aura-2-thalia-en", "Thalia · English", "en"], ["aura-2-andromeda-en", "Andromeda · English", "en"],
  ["aura-2-helena-en", "Helena · English", "en"], ["aura-2-janus-en", "Janus · English (Southern)", "en"],
  ["aura-2-delia-en", "Delia · English, young", "en"], ["aura-2-cordelia-en", "Cordelia · English, young", "en"],
  ["aura-2-athena-en", "Athena · English, mature", "en"],
  ["aura-2-olivia-es", "Olivia · Spanish (Mexican)", "es"], ["aura-2-celeste-es", "Celeste · Spanish, young", "es"],
  ["aura-2-gloria-es", "Gloria · Spanish, young", "es"], ["aura-2-estrella-es", "Estrella · Spanish, mature", "es"],
  ["aura-2-selena-es", "Selena · English + Spanish", "mix"], ["aura-2-carina-es", "Carina · English + Spanish", "mix"],
  ["aura-2-diana-es", "Diana · English + Spanish", "mix"],
];
const LINES = [
  ["English", "I already have insurance, but sure, go ahead. What were you going to tell me?"],
  ["English", "Honestly, your price is higher than what I'm paying now. Why would I switch?"],
  ["Spanish", "Mire, ahorita estoy ocupada. ¿Me puede mandar la cotización por correo?"],
  ["Spanish", "Tengo que hablarlo con mi esposo primero, él es el que maneja todo eso."],
  ["Mixed", "Sí, I already have Progressive, pero está muy caro. How much would it be with you guys?"],
];
const $ = id => document.getElementById(id);
$("voice").innerHTML = VOICES.map(([id, label]) => `<option value="${id}">${label}</option>`).join("");
$("lines").innerHTML = LINES.map(([k, t], i) => `<button type="button" data-i="${i}"><b>${k}:</b> ${t}</button>`).join("");

const head = new TalkingHead($("avatar"), {
  ttsEndpoint: null,
  lipsyncModules: ["en", "pt_br"],
  cameraView: "head",
  modelFPS: 30,
});
try {
  await head.showAvatar({ url: "./faces/mpfb.glb", body: "F", avatarMood: "neutral", lipsyncLang: "en" },
    ev => { if (ev.lengthComputable) $("loading").textContent = `Loading the face… ${Math.round(ev.loaded / ev.total * 100)}%`; });
  $("loading").remove();
  $("speak").disabled = false;
} catch (e) {
  $("loading").textContent = "The face couldn't load: " + e;
}

$("mood").onchange = () => head.setMood($("mood").value);
document.querySelectorAll("#lines button").forEach(b => b.onclick = () => {
  $("text").value = LINES[+b.dataset.i][1];
  const want = LINES[+b.dataset.i][0] === "English" ? "en" : LINES[+b.dataset.i][0] === "Spanish" ? "es" : "mix";
  if ((VOICES.find(v => v[0] === $("voice").value) || [])[2] !== want) $("voice").value = VOICES.find(v => v[2] === want)[0];
  speak();
});
$("speak").onclick = speak;

/* Deepgram's audio carries no word timings, so the words are spread over
   the clip by their length -- TalkingHead then shapes the mouth inside
   each word. Spanish uses the Brazilian Portuguese lip-sync (TalkingHead
   has no Spanish one; the spelling rules are close). */
async function speak() {
  const text = $("text").value.trim();
  if (!text) return;
  const [voice, , lang] = VOICES.find(v => v[0] === $("voice").value);
  $("err").textContent = "";
  $("speak").disabled = true;
  const t0 = performance.now();
  try {
    const r = await fetch(`/api/roleplay/speak?voice=${encodeURIComponent(voice)}&text=${encodeURIComponent(text)}`, { cache: "no-store" });
    const tFirst = performance.now() - t0;
    if (!r.ok) throw new Error(`the voice didn't come back (${r.status}${r.status === 503 ? ": no Deepgram key on the Worker" : ""})`);
    const buf = await r.arrayBuffer();
    const tAll = performance.now() - t0;
    const audio = await head.audioCtx.decodeAudioData(buf);
    const tReady = performance.now() - t0;

    const words = text.split(/\s+/).filter(Boolean);
    const lead = 120, tail = 150;                        // Deepgram's short silence at each end, roughly
    const span = Math.max(audio.duration * 1000 - lead - tail, words.length * 80);
    const weight = words.map(w => w.replace(/[^\p{L}\p{N}]/gu, "").length + 1);
    const total = weight.reduce((a, b) => a + b, 0);
    const wtimes = [], wdurations = [];
    let at = lead;
    for (const w of weight) { const d = span * w / total; wtimes.push(at); wdurations.push(d); at += d; }
    head.speakAudio({ audio, words, wtimes, wdurations },
      { lipsyncLang: lang === "en" ? "en" : "pt_br" });

    $("timing").innerHTML = `<table>
      <tr><td>Deepgram starts answering (today's Role Play starts talking about here)</td><td>${Math.round(tFirst)} ms</td></tr>
      <tr><td>Whole clip downloaded</td><td>${Math.round(tAll)} ms</td></tr>
      <tr><td>The face starts talking</td><td>${Math.round(tReady)} ms</td></tr>
      <tr><td><b>Extra wait the face adds</b></td><td>${Math.round(tReady - tFirst)} ms</td></tr>
      <tr><td>Length of the line</td><td>${audio.duration.toFixed(1)} s</td></tr></table>`;
  } catch (e) {
    $("err").textContent = String(e.message || e);
  }
  $("speak").disabled = false;
}
</script>
</body>
</html>
