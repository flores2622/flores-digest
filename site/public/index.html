<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Floor — Flores Insurance Agency</title>
<style>
/* ---------------------------------------------------------------------------
   Palette. Categorical slots 1-5 in fixed order, validated in both modes:
   light  worst adjacent CVD dE 9.1, normal-vision 19.6
   dark   worst adjacent CVD dE 8.4, normal-vision 19.3
   Light mode puts aqua/yellow/magenta under 3:1 on the surface, so every
   stacked segment carries a visible count label and a legend -- that is the
   required relief, not decoration. Do not drop the labels.
   Colour follows the OUTCOME, never its rank or size, so a quiet day does not
   repaint the chart.
--------------------------------------------------------------------------- */
:root {
  color-scheme: light;
  --surface:        #fcfcfb;
  --surface-raised: #ffffff;
  --border:         #e5e4e0;
  --border-strong:  #d2d1cc;
  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --text-muted:     #78776f;
  --grid:           #ecebe7;
  --s1: #2a78d6;  /* Live Contact       */
  --s2: #eb6834;  /* Voicemail          */
  --s3: #1baf7a;  /* Screener           */
  --s4: #eda100;  /* No Answer          */
  --s5: #e87ba4;  /* No Outcome Logged  */
  --bar:           #2a78d6;
  --bar-track:     #ecebe7;
  /* Chip/medal tokens, carried over from the pre-migration artifact's own
     light/dark palette (it had these; the first port here flattened them
     to single hardcoded values, which is why dark mode looked off --
     dark-on-dark chip text, unreadable bronze/gold medal names). */
  --good:   #0a6b0a; --goodbg: #e2f4e2; --goodbd: #b7e2b7;
  --warn:   #8a6100; --warnbg: #fdf0d9; --warnbd: #e0c184;
  --bad:    #a80000; --badbg:  #fce3e3; --badbd:  #f0b4b4;
  --gold:   #9a6f00; --silver: #6f6f6f; --bronze: #9a5f2b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface:        #1a1a19;
    --surface-raised: #222221;
    --border:         #35352f;
    --border-strong:  #45453e;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #8e8d84;
    --grid:           #2b2b27;
    --s1: #3987e5;
    --s2: #d95926;
    --s3: #199e70;
    --s4: #c98500;
    --s5: #d55181;
    --bar:            #3987e5;
    --bar-track:      #2b2b27;
    --good:   #7fd07f; --goodbg: #1c3320; --goodbd: #2f5a34;
    --warn:   #e0b165; --warnbg: #33290f; --warnbd: #5c4a1c;
    --bad:    #f0908e; --badbg:  #3a1a1a; --badbd:  #632c2c;
    --gold:   #e3bf55; --silver: #c4c4c4; --bronze: #d79a63;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface:        #1a1a19;
  --surface-raised: #222221;
  --border:         #35352f;
  --border-strong:  #45453e;
  --text-primary:   #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted:     #8e8d84;
  --grid:           #2b2b27;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --s4: #c98500;
  --s5: #d55181;
  --bar:            #3987e5;
  --bar-track:      #2b2b27;
  --good:   #7fd07f; --goodbg: #1c3320; --goodbd: #2f5a34;
  --warn:   #e0b165; --warnbg: #33290f; --warnbd: #5c4a1c;
  --bad:    #f0908e; --badbg:  #3a1a1a; --badbd:  #632c2c;
  --gold:   #e3bf55; --silver: #c4c4c4; --bronze: #d79a63;
}
/* Digest-email tier colours, verbatim (render_report.DOT / .tier-text-*),
   in LIGHT mode -- these are the actual colours the sent email uses, so a
   tier reads the same colour on the board as in their inbox there.
   Frank, 2026-09-09: in dark mode the email's saturated red/orange/green
   sitting directly on near-black text (no chip background to soften it,
   unlike .c-g/.c-w/.c-r) read as "blurry" -- full-saturation colour on a
   very dark ground causes exactly the halation the rest of this file's
   dark palette was built to avoid (see --good/--warn/--bad above, and
   .colh.g/.colh.b which already use them for the same bare-text-no-chip
   case). Dark mode gets those same tuned tokens instead of the email's
   literal hex; light mode is untouched and still matches the email exactly. */
.tg { color: #0ca30c; font-weight: 600; }
.ty { color: #eda100; font-weight: 600; }
.tr { color: #e60000; font-weight: 600; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .tg { color: var(--good); }
  :root:not([data-theme="light"]) .ty { color: var(--warn); }
  :root:not([data-theme="light"]) .tr { color: var(--bad); }
}
:root[data-theme="dark"] .tg { color: var(--good); }
:root[data-theme="dark"] .ty { color: var(--warn); }
:root[data-theme="dark"] .tr { color: var(--bad); }
.mdl { font-size: 14px; line-height: 1; margin-left: 5px; }
.ptrack { flex: 1; height: 10px; border-radius: 5px; background: var(--surface); border: 1px solid var(--border-strong); overflow: hidden; }
.pfill { height: 100%; border-radius: 5px; }

/* Podium (Frank, 2026-09-12). Two/1/3 on risers of fixed, decreasing height
   (rank order, not score-proportional -- a real podium doesn't resize per
   day), 4th/5th flanking lower with no riser at all. */
.podium2 { display: flex; align-items: flex-end; justify-content: center; gap: 12px; margin: 6px 0 24px; flex-wrap: wrap; }
.pod-block { display: flex; flex-direction: column; align-items: center; width: 108px; }
.pod-side { display: flex; flex-direction: column; align-items: center; width: 80px; opacity: .85; margin-bottom: 4px; }
.pod-avatar {
  width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 17px; margin-bottom: 6px; background-size: cover; background-position: center;
  box-shadow: 0 0 0 2px var(--border-strong); flex: none;
}
.pod-av-1 { width: 62px; height: 62px; font-size: 21px; }
.pod-av-side { width: 38px; height: 38px; font-size: 13px; }
.pod-name { font-size: 12px; font-weight: 600; text-align: center; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 3px; }
.pod-pts { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
.pod-step {
  width: 100%; border-radius: 6px 6px 0 0; display: flex; align-items: flex-start; justify-content: center;
  padding-top: 6px; font-weight: 700; font-size: 19px; color: #fff;
}
.pod-1 .pod-step { height: 88px; background: linear-gradient(180deg, #f4c542, #d9a326); }
.pod-2 .pod-step { height: 64px; background: linear-gradient(180deg, #c9ccd1, #a7abb2); }
.pod-3 .pod-step { height: 44px; background: linear-gradient(180deg, #d69a63, #b87a44); }
.pod-confetti { position: relative; width: 62px; height: 0; }
.confetti-piece {
  position: absolute; top: 0; left: 50%; width: 6px; height: 10px; opacity: 0;
  animation-name: confetti-fall; animation-timing-function: ease-in; animation-iteration-count: infinite;
}
@keyframes confetti-fall {
  0%   { transform: translate(0, -8px) rotate(0deg); opacity: 0; }
  12%  { opacity: 1; }
  100% { transform: translate(var(--dx, 20px), 58px) rotate(360deg); opacity: 0; }
}
@media (max-width: 520px) {
  .podium2 { gap: 6px; }
  .pod-block { width: 84px; }
  .pod-side { width: 62px; }
}
.sbar { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
.sbl { width: 100px; font-size: 11.5px; color: var(--text-secondary); flex-shrink: 0; }
.sbv { width: 34px; text-align: right; font-size: 12.5px; font-weight: 600; flex-shrink: 0; }
.orow { margin-bottom: 12px; }
.orow-head { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; margin-bottom: 4px; }
.on { color: var(--text-muted); }
.otrack { display: flex; height: 14px; border-radius: 4px; overflow: hidden; background: var(--bar-track); }
.ogseg { height: 100%; }
.oleg { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: 11.5px; color: var(--text-secondary); }
.oleg-item { display: flex; align-items: center; gap: 5px; }

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--surface);
  color: var(--text-primary);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ---- top bar + shell ------------------------------------------------------ */
.top {
  background: var(--text-primary); color: var(--surface);
  padding: 14px 22px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
}
.top h1 { font-size: 17px; margin: 0; color: inherit; font-weight: 600; }
.top .sub { font-size: 12px; color: var(--text-muted); }
.thbtn {
  margin-left: auto; align-self: center; display: inline-flex; align-items: center; gap: 6px;
  background: transparent; color: inherit; border: 1px solid var(--border-strong); border-radius: 7px;
  padding: 5px 10px; font: 500 12px/1 inherit; cursor: pointer;
}
.shell { min-height: calc(100vh - 49px); }
.pd { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.pbadge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 5px; font-size: 12px; font-weight: 700; line-height: 1.5; white-space: nowrap; }
.main { padding: 20px 24px 60px; min-width: 0; max-width: 1120px; margin: 0 auto; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.tab {
  background: none; border: none; border-bottom: 2px solid transparent; padding: 8px 13px;
  font: inherit; font-weight: 600; font-size: 13px; color: var(--text-muted); cursor: pointer;
}
.tab[aria-selected="true"] { color: var(--text-primary); border-bottom-color: var(--text-primary); }
.tab:hover { color: var(--text-primary); }
.subtabs { display: flex; gap: 6px; margin-bottom: 18px; }
.subtab {
  background: var(--surface); border: 1px solid var(--border-strong); border-radius: 20px;
  padding: 6px 14px; font: inherit; font-weight: 600; font-size: 12px; color: var(--text-secondary); cursor: pointer;
}
.subtab.sel { background: var(--text-primary); color: var(--surface); border-color: var(--text-primary); }
.subtab:hover:not(.sel) { border-color: var(--text-muted); color: var(--text-primary); }

.controls { display: flex; gap: 8px; align-items: center; margin-bottom: 18px; }
select, button.ghost {
  font: inherit; font-size: 13px;
  color: var(--text-primary); background: var(--surface-raised);
  border: 1px solid var(--border-strong); border-radius: 6px;
  padding: 6px 10px; cursor: pointer;
}

h2 {
  font-size: 12px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.07em; color: var(--text-muted);
  margin: 36px 0 14px;
}
h2:first-of-type { margin-top: 8px; }
.sd { font-size: 12.5px; color: var(--text-secondary); margin: -10px 0 14px; line-height: 1.55; }

/* Two-column card layout below the Digest tab's leaderboard, matching the
   email's own side-by-side arrangement (Frank, 2026-09-12). Collapses to one
   column under the same width other narrow layouts in this file use. */
.digestgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
@media (max-width: 720px) { .digestgrid { grid-template-columns: 1fr; } }

/* Stat tiles. */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 10px; }
.tile {
  background: var(--surface-raised); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 16px;
}
.tile .k { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
.tile .v { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; margin-top: 4px; font-variant-numeric: tabular-nums; }
.tile .n { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

/* Live indicator (intraday.py, Frank, 2026-09-12) -- a slim line, not a
   duplicate stat box: the report below it already IS the live data (same
   board_payload.build() shape whether the source is a finalized day or
   intraday.py's latest checkpoint), so this only has to say so. */
.livebanner { font-size: 12.5px; color: var(--text-secondary); border: 1px solid var(--good); border-radius: 8px; padding: 8px 12px; margin-bottom: 16px; }
.liveflags { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
.liveflag { font-size: 12.5px; color: var(--warn); background: var(--surface-raised); border: 1px solid var(--warn); border-radius: 8px; padding: 7px 10px; }

/* Training tab flashcards (Frank, 2026-09-11) -- flip card driven purely by
   a CSS 3D transform on .flipped, no JS animation. Front/back are both laid
   out and stacked via backface-visibility so there's no flash of the wrong
   face mid-flip. */
.btn {
  font: inherit; font-size: 13px; font-weight: 600;
  color: var(--text-primary); background: var(--surface-raised);
  border: 1px solid var(--border-strong); border-radius: 6px;
  padding: 7px 14px; cursor: pointer;
}
.btn:hover { border-color: var(--text-muted); }
.flashcard {
  perspective: 1400px; cursor: pointer; margin: 10px 0 18px;
  min-height: 220px;
}
.flashcard:focus-visible .fcface { outline: 2px solid var(--text-primary); outline-offset: 2px; }
.fcinner {
  position: relative; width: 100%; height: 100%; min-height: inherit;
  transform-style: preserve-3d; transition: transform 0.5s ease;
}
.flashcard.flipped .fcinner { transform: rotateY(180deg); }
.fcface {
  position: absolute; inset: 0; backface-visibility: hidden;
  border: 1px solid var(--border-strong); border-radius: 12px;
  background: var(--surface-raised); padding: 22px 26px;
  display: flex; align-items: center; justify-content: center;
  overflow-y: auto;
}
/* align-items:center (inherited from .fcface) clips a tall back face at the
   top when it overflows the fixed-height box -- centering a scrollable flex
   item hides the portion above the fold instead of leaving it reachable by
   scrolling. Top-align the back face instead so overflow only ever runs
   downward, where overflow-y:auto can actually reach it. */
.fcback { transform: rotateY(180deg); align-items: flex-start; justify-content: flex-start; }
.fctext { font-size: 17px; font-weight: 600; text-align: center; line-height: 1.4; }
.fctext-back { font-size: 13.5px; font-weight: 400; text-align: left; line-height: 1.55; width: 100%; }
.fctext-back .gl li:before { background: var(--text-muted); }
.fccontrols { display: flex; gap: 8px; flex-wrap: wrap; }

/* Training tab: Quiz and Match study modes (Frank, 2026-09-11). */
.quizq { font-size: 16px; font-weight: 600; margin: 6px 0 16px; line-height: 1.4; }
.quizopts { display: flex; flex-direction: column; gap: 8px; }
.quizopt {
  text-align: left; font: inherit; font-size: 13px; line-height: 1.4;
  color: var(--text-primary); background: var(--surface-raised);
  border: 1px solid var(--border-strong); border-radius: 8px;
  padding: 10px 14px; cursor: pointer;
}
.quizopt:hover:not(:disabled) { border-color: var(--text-muted); }
.quizopt:disabled { cursor: default; }
.quizopt.correct { background: var(--goodbg); color: var(--good); border-color: var(--goodbd); }
.quizopt.wrong { background: var(--badbg); color: var(--bad); border-color: var(--badbd); }
.quizscore { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin: 8px 0; }
.quizmissrow { padding: 8px 0; border-bottom: 1px solid var(--grid); font-size: 13px; }
.matchgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 10px; }
.matchcol { display: flex; flex-direction: column; gap: 8px; }
.matchtile {
  text-align: left; font: inherit; font-size: 12.5px; line-height: 1.4;
  color: var(--text-primary); background: var(--surface-raised);
  border: 1px solid var(--border-strong); border-radius: 8px;
  padding: 9px 12px; cursor: pointer; min-height: 44px;
}
.matchtile:hover:not(:disabled) { border-color: var(--text-muted); }
.matchtile:disabled { cursor: default; }
.matchtile.sel { border-color: var(--text-primary); box-shadow: 0 0 0 1px var(--text-primary) inset; }
.matchtile.solved { background: var(--goodbg); color: var(--good); border-color: var(--goodbd); opacity: 0.85; }
.matchtile.wrong { background: var(--badbg); color: var(--bad); border-color: var(--badbd); }
@media (max-width: 520px) { .matchgrid { grid-template-columns: 1fr; } }

/* Training tab: Terms & Techniques reference (Frank, 2026-09-11 --
   replaces an earlier print-cheatsheet attempt with an always-current,
   in-app read: "explains everything without having to download the
   cheatsheet"). Same deck/card data as flashcards, rendered as one
   scrollable page instead of one card at a time. */
.refdeck { margin-bottom: 28px; }
.refcard { margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--grid); }
.refcard:last-child { border-bottom: none; }
.refcard h3 { font-size: 13.5px; margin: 0 0 4px; color: var(--text-primary); }
.refcard .fctext-back { font-size: 12.5px; }

table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 9px 10px; border-bottom: 1px solid var(--grid); font-size: 12.5px; }
th:first-child, td:first-child { text-align: left; }
th {
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.05em; color: var(--text-muted);
  border-bottom: 1px solid var(--border-strong);
}
td.name { font-weight: 500; }
tr.tot td { font-weight: 700; background: var(--surface); }
tbody tr:hover { background: color-mix(in oklab, var(--bar) 7%, transparent); }
.scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
.scroll table { min-width: 640px; }
.who { display: flex; align-items: center; gap: 7px; font-weight: 600; }

.bars { display: grid; gap: 7px; }
.row { display: grid; grid-template-columns: 132px 1fr 76px; gap: 12px; align-items: center; }
.row .lbl { font-size: 13px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track { background: var(--bar-track); border-radius: 4px; height: 20px; position: relative; }
.fill { background: var(--bar); border-radius: 0 4px 4px 0; height: 100%; min-width: 2px; transition: width .18s ease; }
.row .val { font-size: 13px; font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; }

.stack { display: flex; height: 26px; border-radius: 4px; overflow: hidden; gap: 2px; background: var(--bar-track); }
.seg2 { position: relative; display: flex; align-items: center; justify-content: center; min-width: 3px; }
.seg2 span { font-size: 11px; font-weight: 600; color: #fff; text-shadow: 0 0 3px rgba(0,0,0,.45); font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-bottom: 12px; }
.legend .item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
.swatch { width: 11px; height: 11px; border-radius: 3px; flex: none; }
.swatch.sw-g { background: var(--good); }
.swatch.sw-y { background: var(--warn); }
.swatch.sw-r { background: var(--bad); }

.note { color: var(--text-muted); font-size: 12px; margin-top: 10px; }
.empty { color: var(--text-muted); padding: 28px 0; text-align: center; }
.hero { background: var(--surface-raised); border: 1px solid var(--border-strong); border-radius: 9px; padding: 16px 18px; margin-bottom: 16px; }
.hero .hl { font-weight: 700; font-size: 15px; margin-bottom: 6px; }
.hero p { margin: 0 0 9px; font-size: 12.5px; line-height: 1.6; color: var(--text-secondary); }
.hero p:last-child { margin-bottom: 0; }
.q { font-style: italic; }

/* Trend line. */
.trend { width: 100%; height: 200px; display: block; }
.trend .grid { stroke: var(--grid); stroke-width: 1; }
.trend .axis { fill: var(--text-muted); font-size: 11px; }
.trend .ln { fill: none; stroke: var(--bar); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.trend .dot { fill: var(--bar); stroke: var(--surface); stroke-width: 2; }
.trend .hit { fill: transparent; cursor: crosshair; }
.spark { display: flex; align-items: flex-end; gap: 3px; height: 34px; }
.spark i { display: block; width: 9px; background: var(--bar); border-radius: 1px 1px 0 0; min-height: 2px; }

#tip {
  position: fixed; pointer-events: none; opacity: 0; transition: opacity .1s;
  background: var(--surface-raised); color: var(--text-primary);
  border: 1px solid var(--border-strong); border-radius: 7px;
  padding: 7px 10px; font-size: 12px; line-height: 1.45;
  box-shadow: 0 6px 20px rgba(0,0,0,.16); z-index: 50; max-width: 260px;
}
#tip b { font-weight: 600; }

/* ---- coaching cards -------------------------------------------------------
   Ported from the pre-migration board (a claude.ai Artifact). This is
   authored content -- never generated -- so the markup mirrors the artifact's
   structure closely rather than being redesigned. */
.cpick { display: flex; align-items: center; gap: 9px; margin: 0 0 18px; }
.cpick label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted); }
.ccard { display: block; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 9px; padding: 12px; margin-bottom: 13px; }
.ccard > summary.cchead { cursor: pointer; list-style: none; }
.ccard > summary.cchead::-webkit-details-marker { display: none; }
.ctog { color: var(--text-muted); font-size: 11px; margin-left: 8px; display: inline-block; transition: transform .15s; }
.ccard[open] .ctog { transform: rotate(90deg); }
.blk { background: var(--surface-raised); border: 1px solid var(--border); border-radius: 7px; padding: 13px 15px; margin-bottom: 9px; }
.blk:last-child { margin-bottom: 0; }
.bl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--text-muted); margin-bottom: 9px; }
.chead { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.cname { font-weight: 700; font-size: 15px; }
.cmeta { font-size: 11px; color: var(--text-muted); margin-top: 1px; }

.tl { display: grid; grid-template-columns: 52px 14px 1fr; row-gap: 0; }

.cat-q { background: #9fc2ed; } .cat-sold { background: #008300; color: #fff; } .cat-live { background: #eda100; }
.cat-dead { background: #f0e800; }
.cat-fsd { background: var(--surface-raised); color: var(--good); border: 1px solid var(--good); }
/* Sales vs. service (Apollo's own judgment, distinct from .cat above --

.ctype { display: inline-block; font-size: 9.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; padding: 1px 7px; border-radius: 10px; white-space: nowrap; background: transparent; border: 1px solid var(--border-strong); color: var(--text-muted); }
.ctype-service { border-color: var(--info, #6a9fd8); color: var(--info, #6a9fd8); }
.ctype-mixed { border-color: var(--warn); color: var(--warn); }

.c-w { background: var(--warnbg); color: var(--warn); border: 1px solid var(--warnbd); }

/* ---- Role Play tab --------------------------------------------------- */
.pcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin: 14px 0; }

.rpmsgs { display: flex; flex-direction: column; gap: 10px; max-height: 480px; overflow-y: auto; margin-bottom: 12px; }

.rpmsg.producer { align-self: flex-end; background: var(--s1); color: #fff; }
.rpmsg.prospect { align-self: flex-start; background: var(--surface); border: 1px solid var(--border-strong); color: var(--text-primary); }
.rpmsg .rl { display: block; font-size: 9.5px; text-transform: uppercase; letter-spacing: .04em; opacity: .7; margin-bottom: 3px; }
.rprow { display: flex; gap: 8px; }

.rpmic { border: 1px solid var(--border-strong); border-radius: 6px; background: var(--surface); color: var(--text-primary); font-size: 13px; padding: 8px 14px; cursor: pointer; white-space: nowrap; }
.rpmic.listening { background: var(--bad); color: #fff; border-color: var(--bad); animation: rppulse 1.1s ease-in-out infinite; }
@keyframes rppulse { 0%,100% { opacity: 1; } 50% { opacity: .6; } }
.gradecard { border: 1px solid var(--border-strong); border-radius: 10px; padding: 14px 16px; margin-top: 14px; max-width: 640px; background: var(--surface-raised); }

<body>
<div class="top">
  <h1>Sales Floor</h1>
  <span class="sub" id="topsub">loading…</span>
  <button class="thbtn" id="thbtn" type="button"><span id="thico">◑</span><span id="thlbl">System</span></button>
</div>
<div class="shell">
  <main class="main">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true"  data-v="digest">Digest</button>
      <button class="tab" role="tab" aria-selected="false" data-v="coaching">Coaching</button>
      <button class="tab" role="tab" aria-selected="false" data-v="trends">Trends</button>
      <button class="tab" role="tab" aria-selected="false" data-v="roleplay">Role Play</button>
      <button class="tab" role="tab" aria-selected="false" data-v="training">Training</button>
      <button class="tab" role="tab" aria-selected="false" data-v="sales">Sales</button>
    </div>
    <div id="view"><div class="empty">Loading…</div></div>
  </main>
</div>
<div id="tip" role="tooltip"></div>

<script>
/* The digest email's own producer colours (render_report.DOT), so a producer
   is the same colour on the board as in their inbox. Not chosen here. */
const DOT = {"Crystal Mango":"#ff4b4b", "Lorena Gonzalez":"#cd81ff",
             "Mike Olvera":"#5656fe",   "Debbie Aguilera":"#0b0b0b",
             "Coral Barwick":"#00ffcf",  "Sarahi Chin":"#ffb48c",
             "Amanda Torricellas":"#baffff"};
const TEAM_DOT = "#0b0b0b";

/* Producer identity badge -- a colour-filled pill with the name inside,
   replacing the old dot-plus-plain-text everywhere a row or card needs to
   say whose number this is (Frank, 2026-09-12). Text colour picks whichever
   of black/white has the higher WCAG contrast against that producer's own
   colour: DOT spans from near-black (Debbie) to pale mint (Coral), so no
   single text colour reads on all of it. */
function badgeTextColor(hex) {
  const c = hex.replace("#", "");
  const r = parseInt(c.slice(0, 2), 16) / 255, g = parseInt(c.slice(2, 4), 16) / 255, b = parseInt(c.slice(4, 6), 16) / 255;
  const lin = v => v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  const lum = 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
  const contrast = (l1, l2) => (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
  return contrast(lum, 1) >= contrast(lum, 0) ? "#fff" : "#111";
}
function pbadge(color, label) {
  return `<span class="pbadge" style="background:${color};color:${badgeTextColor(color)}">${label}</span>`;
}

// Producer name -> photo URL. Empty until real headshots exist somewhere
// this can point to -- every avatar falls back to a colour-badge initial
// (podiumAvatar below) until then. Deliberately NOT a repo-committed image
// path: this repo is public on GitHub, so a real headshot belongs in the
// private flores-board R2 bucket (served through a Worker route the same
// access-gated way days/<day>.json already is), never under site/public/.
const PRODUCER_PHOTOS = {};

function podiumAvatar(name, sizeClass) {
  const photo = PRODUCER_PHOTOS[name];
  if (photo) return `<div class="pod-avatar ${sizeClass}" style="background-image:url('${photo}')"></div>`;
  const color = DOT[name] || "#8a877f";
  const initial = (name.split(" ")[0][0] || "?").toUpperCase();
  return `<div class="pod-avatar ${sizeClass}" style="background:${color};color:${badgeTextColor(color)}">${initial}</div>`;
}

// A handful of small falling pieces, randomised each render so it never
// looks mechanical -- CSS keyframes do the actual falling (see .confetti-piece).
function confettiHtml() {
  const colors = ["#ff4b4b", "#5656fe", "#00c37a", "#ffb84d", "#cd81ff"];
  let pieces = "";
  for (let i = 0; i < 14; i++) {
    const dx = Math.round((Math.random() - 0.5) * 70);
    const delay = (Math.random() * 1.6).toFixed(2);
    const dur = (1.1 + Math.random() * 0.7).toFixed(2);
    const left = Math.round(10 + Math.random() * 80);
    pieces += `<span class="confetti-piece" style="left:${left}%;background:${colors[i % colors.length]};` +
      `animation-delay:${delay}s;animation-duration:${dur}s;--dx:${dx}px"></span>`;
  }
  return `<div class="pod-confetti">${pieces}</div>`;
}

/* Podium -- 1st/2nd/3rd on risers (tallest to shortest, not point-proportional:
   a real podium has fixed step heights), 4th and 5th flanking it lower and
   smaller, no riser. Replaces the old horizontal bar-per-producer list
   (Frank, 2026-09-12: "turn into a 1/2/3 podium with #4 off to the left and
   #5 off to right, both a bit lower"). Confetti (CSS-only, no library) falls
   over 1st only. Avatars fall back to a colour-initial circle until
   PRODUCER_PHOTOS has a real photo for that name. */
function podiumHtml(order, points) {
  const block = (name, rank) => name == null ? "" : `<div class="pod-block pod-${rank}">
    ${rank === 1 ? confettiHtml() : ""}
    ${podiumAvatar(name, "pod-av-" + rank)}
    <div class="pod-name">${name}</div>
    <div class="pod-pts">${points[name] ?? 0} pts</div>
    <div class="pod-step">${rank}</div>
  </div>`;
  const side = (name, label) => name == null ? "" : `<div class="pod-side">
    ${podiumAvatar(name, "pod-av-side")}
    <div class="pod-name">${name}</div>
    <div class="pod-pts">${label}</div>
  </div>`;
  return `<div class="podium2">
    ${side(order[3], "4th")}
    ${block(order[1], 2)}
    ${block(order[0], 1)}
    ${block(order[2], 3)}
    ${side(order[4], "5th")}
  </div>`;
}

/* Folio close dates, 2026 (Frank's "Folio Close Dates" calendar). A folio's
   last day is the highlighted date; the next calendar day starts the next
   folio -- mirrors digest_config.FOLIO_CLOSE_DATES. Extend this array when
   next year's calendar arrives; a day past the last entry has no folio yet. */
const FOLIO_CLOSE_DATES = [
  "2026-01-20", "2026-02-18", "2026-03-18", "2026-04-17",
  "2026-05-19", "2026-06-18", "2026-07-17", "2026-08-19",
  "2026-09-18", "2026-10-19", "2026-11-17", "2026-12-17",
];
function folioEndFor(dateStr) {
  return FOLIO_CLOSE_DATES.find(end => dateStr <= end) || null;
}

const $ = (s, r) => (r || document).querySelector(s);
const el = (t, cls, txt) => { const e = document.createElement(t); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const money = n => "$" + Math.round(n || 0).toLocaleString();
const secs = n => { n = Math.round(n || 0); const m = Math.floor(n / 60); return m ? `${m}m ${String(n % 60).padStart(2, "0")}s` : `${n}s`; };
const hhmm = secs;

let DAYS = [];       // date strings from /api/days, newest first
let cur = null;      // the currently loaded day's full document
let view = "digest";
// One producer filter shared by the Digest and Coaching tabs. "" = whole
// agency. This is the roster CLAUDE.md treats as producers (not Debbie or
// Amanda, who show up in DOT/coaching data but are not tracked as such).
const PRODUCER_ROSTER = ["Crystal Mango", "Lorena Gonzalez", "Mike Olvera", "Coral Barwick", "Sarahi Chin"];
let producerFilter = "";
// Digest-tab range selector. "day" shows a picked day's full digest; every
// other value renders an aggregate via digestRange().
let rangeMode = "day";  // day | yesterday | week | mtd | ytd | folio | custom
let customFrom = "", customTo = "";

// Training tab state. TRAINING_CACHE is fetched once (static content, same
// for every viewer) and kept for the life of the page. trainingOrder is a
// shuffled index array into the current deck's cards, rebuilt whenever the
// deck changes or Shuffle is clicked -- trainingPos indexes INTO that order,
// not into the deck's cards directly.
let TRAINING_CACHE = null;
let trainingDeckIdx = 0;
let trainingOrder = [];
let trainingPos = 0;
let trainingFlipped = false;
// "cards" (flashcards, above) | "quiz" | "match" -- three study methods over
// the same deck data, switched via pills above the deck picker (Frank,
// 2026-09-11: "different interactive study methods").
let trainingMode = "cards";

// Quiz: 5 random questions per attempt, each the real front against its own
// back plus 3 real backs from other cards in the same deck as distractors --
// every decks has >=4 cards, so there's always exactly 3 distractors.
let quizQuestions = [];
let quizIdx = 0;
let quizScore = 0;
let quizSelected = null;   // chosen option index for the CURRENT question, null = unanswered
let quizMissed = [];       // [{front, correct}] for the results screen

// Match: click a term then a definition (or either order); a correct pair
// locks in, a wrong pair flashes red and clears. Capped at 6 pairs so the
// grid stays on one screen even for a 15-card deck.
let matchPairs = [];         // [{front, back}] subset for this attempt
let matchTermOrder = [];    // pair indices, shuffled for the left column's display order
let matchDefOrder = [];     // pair indices, shuffled for the right column's display order
let matchSelectedTerm = null;
let matchSelectedDef = null;
let matchSolved = new Set();
let matchWrong = null;      // {term, def} pair indices to flash red, cleared on next render
let matchAttempts = 0;

// Sales tab state (Frank, 2026-09-12): a same-day, self-reported log,
// explicitly NOT the official Premium Sold figure (that stays AgencyZoom-
// derived, as it already is everywhere else on this board). Entered sales
// are stored in R2 (saleslog/<day>.json, site/worker.js) and later matched
// against real AgencyZoom policies by sales_log_reconcile.py -- an entry
// that stays unreconciled is the "missing docs / not entered yet" signal.
let salesDay = null;          // set to today's AZ date on first load
let salesEntries = [];        // this day's entries, from the last /api/saleslog fetch
let salesProducer = "";       // who's currently logging a sale
let salesBusy = false;

/* ---- tooltip -------------------------------------------------------------- */
const tip = $("#tip");
function hoverable(node, html) {
  node.addEventListener("mousemove", e => {
    tip.innerHTML = html;
    tip.style.opacity = 1;
    const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
    let x = e.clientX + pad, y = e.clientY + pad;
    if (x + w > innerWidth - 8) x = e.clientX - w - pad;
    if (y + h > innerHeight - 8) y = e.clientY - h - pad;
    tip.style.left = x + "px"; tip.style.top = y + "px";
  });
  node.addEventListener("mouseleave", () => { tip.style.opacity = 0; });
}

/* ---- theme: system -> light -> dark, remembered per browser --------------- */
(function () {
  const K = "board-theme", R = document.documentElement, b = $("#thbtn"),
        ico = $("#thico"), lbl = $("#thlbl");
  const M = ["system", "light", "dark"],
        T = { system: ["◑", "System"], light: ["☀", "Light"], dark: ["☾", "Dark"] };
  const read = () => { try { const v = localStorage.getItem(K); return M.includes(v) ? v : "system"; } catch (_) { return "system"; } };
  const apply = (m, save) => {
    if (m === "system") { delete R.dataset.theme; R.style.colorScheme = ""; }
    else { R.dataset.theme = m; R.style.colorScheme = m; }
    ico.textContent = T[m][0]; lbl.textContent = T[m][1];
    if (save) try { localStorage.setItem(K, m); } catch (_) {}
  };
  let cur = read(); apply(cur, false);
  b.addEventListener("click", () => { cur = M[(M.indexOf(cur) + 1) % M.length]; apply(cur, true); });
})();

/* ---- Digest tab ------------------------------------------------------------
   Ranked like the leaderboard, medals on the top three. Each stat is coloured
   by the day document's own `tiers` (computed server-side from
   digest_config, so the boundary rules live in one place), and Policies
   falls back to the day's premium-sold streak when today's figure is $0, so
   the two never disagree. */
function digestDay(d, who) {
  const byName = Object.fromEntries((d.producers || []).map(p => [p.name, p]));
  const focus = who ? byName[who] : null;
  // Whole-agency tiles read from d.totals; a single producer's tiles read
  // from their own row instead, since "the team's numbers" is not what
  // filtering to one person means.
  const t = focus || d.totals || {};
  const rate = focus ? (focus.rate ?? 0) : (t.dials ? (100 * t.live / t.dials).toFixed(1) : "0");
  // Households Quoted and Premium Quoted share one tile (and likewise
  // Policies/Premium Sold), but as two figures side by side on the SAME big
  // number line, not one promoted to the big number with the other demoted
  // to a subtitle -- Frank, 2026-09-12: "I still want them in the same box,
  // just side by side, so abbreviate it and a slash." (First split into
  // four separate tiles per an earlier ask that they be "equally
  // important" -- this keeps that equal weight, one line, one box.)
  const tiles = [
    ["Dials", t.dials ?? 0],
    ["Live contacts", t.live ?? 0, rate + "% contact rate"],
    ["HH/Prem. Quoted", `${t.hh ?? 0} HH / ${money(t.pq)}`],
    ["Pol/Prem. Sold", `${t.pol ?? 0} Pol / ${money(t.ps)}`],
  ];
  if (t.util != null) tiles.push(["Utilization", t.util + "%", "weighted"]);
  const tilesHtml = tiles.map(([k, v, n]) =>
    `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div>${n ? `<div class="n">${n}</div>` : ""}</div>`).join("");

  return `<div class="tiles">${tilesHtml}</div>
  ${teamLeaderboardHtml(d, who)}`;
}

/* Team Leaderboard -- replaces what used to be two separate panels
   ("Scoreboard" and "Team Leaderboard"), which showed the same producers
   and mostly the same figures two different ways (Frank, 2026-09-10: "are
   identical, right?"). Podium below is styled after the email's MVP
   leaderboard (panels.leaderboard: a bar per producer sized to their
   standing) -- ranking and bar length still come from the same point
   system/rules the email uses (d.leaderboard.points, computed server-side
   in board_payload.leaderboard()), just never printed as a number. Below
   the podium, the per-category table is the OLD Scoreboard, unchanged:
   every figure coloured against its own goal, not by rank. */
function teamLeaderboardHtml(d, who) {
  const byName = Object.fromEntries((d.producers || []).map(p => [p.name, p]));
  const focus = who ? byName[who] : null;
  const TI = { green: "tg", yellow: "ty", red: "tr" };
  const tc = (name, key) => TI[((d.tiers || {})[name] || {})[key]] || "";
  const MEDAL = ["\u{1F3C6}", "\u{1F948}", "\u{1F949}"];
  const streak = d.policy_streak || {};
  const polTitle = n => {
    const g = streak[n];
    return g === 0 ? "sold today" : g == null ? "no sale on record"
         : g + " business day" + (g === 1 ? "" : "s") + " without a sale";
  };
  const lb = d.leaderboard || {};
  const ranked = focus ? [focus] : ((lb.order) || (d.producers || []).map(p => p.name))
                   .map(n => byName[n]).filter(Boolean);
  const hasRoleplay = ranked.some(p => (p.coach || {}).roleplay != null);

  let podium = "";
  if (!focus && lb.order && lb.order.length > 1) {
    const points = lb.points || {};
    podium = podiumHtml(lb.order, points);
  }

  const rows = ranked.map((p, i) => `<tr>
    <td><span class="who">${pbadge(DOT[p.name] || "#8a877f", p.name)}${
       !focus && i < 3 ? `<span class="mdl" role="img" aria-label="${["1st", "2nd", "3rd"][i]}">${MEDAL[i]}</span>` : ""}</span></td>
    ${hasRoleplay ? `<td class="num ${tc(p.name, "roleplay")}">${(p.coach || {}).roleplay ?? "—"}</td>` : ""}
    <td class="num ${tc(p.name, "dials")}">${p.dials ?? 0}</td>
    <td class="num ${tc(p.name, "talk")}">${hhmm(p.talk)}</td>
    <td class="num ${tc(p.name, "rate")}">${p.rate ?? 0}% <span style="opacity:.72">(${p.live ?? 0})</span></td>
    <td class="num ${tc(p.name, "hh")}">${p.hh ?? 0}</td>
    <td class="num ${tc(p.name, "pq")}">${money(p.pq)}</td>
    <td class="num ${tc(p.name, "pol")}" title="${polTitle(p.name)}">${p.pol ?? 0}</td>
    <td class="num ${tc(p.name, "ps")}">${money(p.ps)}</td>
    ${p.util != null ? `<td class="num ${tc(p.name, "util")}">${p.util}%</td>` : ""}</tr>`).join("");
  const tt = k => TI[((d.tiers || {})["team"] || {})[k]] || "";
  const T = d.totals || {};
  const teamRate = T.dials ? (100 * T.live / T.dials).toFixed(1) : "0";
  const tot = focus ? "" : `<tr class="tot"><td><span class="who">${pbadge(TEAM_DOT, "Team")}</span></td>
    ${hasRoleplay ? `<td class="num">—</td>` : ""}
    <td class="num ${tt("dials")}">${T.dials ?? 0}</td>
    <td class="num">—</td>
    <td class="num ${tt("rate")}">${teamRate}% <span style="opacity:.72">(${T.live ?? 0})</span></td>
    <td class="num ${tt("hh")}">${T.hh ?? 0}</td>
    <td class="num ${tt("pq")}">${money(T.pq)}</td>
    <td class="num ${tt("pol")}">${T.pol ?? 0}</td>
    <td class="num ${tt("ps")}">${money(T.ps)}</td>
    ${T.util != null ? `<td class="num ${tt("util")}">${T.util}%</td>` : ""}</tr>`;

  return `<div class="sect"><h2>Team Leaderboard</h2>
   <p class="sd">Ranked the same way the email's MVP leaderboard ranks producers -- but every figure below is
   coloured against its own goal, not by rank. Policies is coloured on a streak instead of a daily target.
   Hover a policy count for the gap. Contact Rate shows live contacts in brackets.</p>
   <div class="legend">
     <span class="item"><span class="swatch sw-g"></span>On or exceeding goal</span>
     <span class="item"><span class="swatch sw-y"></span>Off pace, but close</span>
     <span class="item"><span class="swatch sw-r"></span>Off track, needs review</span>
   </div>
   ${podium}
   <div class="scroll"><table><thead><tr><th>Producer</th>${hasRoleplay ? "<th class=\"num\">Role Play</th>" : ""}
   <th class="num">Call Volume</th><th class="num">Avg Talk Time</th><th class="num">Contact Rate</th>
   <th class="num">Households Quoted</th><th class="num">Premium Quoted</th>
   <th class="num">Policies</th><th class="num">Premium Sold</th>
   ${ranked.some(p => p.util != null) ? "<th class=\"num\">Utilization</th>" : ""}</tr></thead>
   <tbody>${rows}${tot}</tbody></table></div></div>`;
}

/* Wins and Losses -- was "What the day says" + "Objections by category" on
   the Digest tab; moved to its own section on the Coaching tab (Frank,
   2026-09-10). Team-level, not meaningful filtered to one producer, same as
   before. */
function winsLossesHtml(d, who) {
  if (who) return "";
  const s = d.scan;
  const sold = (d.calls || []).filter(c => c.catc === "cat-sold").map(c => c.lead);
  const says = !s ? "" : `
   <p class="sd">Two patterns that only show up across calls, not within one.</p>
   <div class="hero">
    <div class="hl">The opening asks permission</div>
    <p><b>${s.asked_open} of ${s.of}</b> coached calls opened by asking for the opportunity —
    the <b>${s.assumed_open}</b> that opened assumptively, with the work already done, are where the
    committed next steps came from.</p>
   </div>
   <div class="hero">
    <div class="hl">Prices on the table against asks made</div>
    <p><b>${s.priced}</b> of ${s.of} calls put a real price in front of someone. <b>${s.closed}</b> closed on the
    call${sold.length ? ` — ${sold.join(", ")}` : ""}. Current premium was captured on <b>${s.premium}</b>, a
    renewal date on <b>${s.xdate}</b>, and a bundle raised on <b>${s.bundle}</b>.
    <b>${s.timeset} of ${s.of}</b> set a specific callback time — that one is usually the cheapest to fix.</p>
   </div>`;
  const objs = !(d.objcats && d.objcats.length) ? "" : `
   <h3>Objections by category</h3>
   <p class="sd">Won means the objection was addressed and overcome on the call, not merely answered.</p>
   <div class="scroll"><table><thead><tr><th>Category</th><th class="num">Raised</th><th class="num">Won</th></tr></thead><tbody>
   ${d.objcats.map(([c, n, w]) => `<tr><td>${c}</td><td class="num">${n}</td>
     <td class="num">${w ? `<span class="chip c-g">${w}</span>` : `<span class="chip c-r">0</span>`}</td></tr>`).join("")}
   </tbody></table></div>`;
  if (!says && !objs) return "";
  return `<div class="sect"><h2>Wins and Losses</h2>${says}${objs}</div>`;
}

/* The next four sections mirror the customized email digest's own panels
   (Frank, 2026-09-10) -- Task Completion Rate, Call Outcome Breakdown,
   Utilization and Efficiency, and Coaching & Call Quality. All four read
   data board_payload.py already computed (d.totals.tasks/producers[].tasks,
   d.outcomes, producers[].util*, producers[].coach) but that had no
   frontend renderer at all until now -- board_payload.outcome_breakdown's
   own docstring already flagged the Outcomes figures as silently unused. */

function taskCompletionHtml(d, who) {
  const byName = Object.fromEntries((d.producers || []).map(p => [p.name, p]));
  const focus = who ? byName[who] : null;
  const TI = { green: "tg", yellow: "ty", red: "tr" };
  const tc = (name) => TI[((d.tiers || {})[name] || {})["tasks"]] || "";
  const list = (focus ? [focus] : (d.producers || [])).filter(p => p.tasks && p.tasks.total != null);
  if (!list.length) return "";
  const rows = list.map(p => { const t = p.tasks; const pct = t.pct ?? 0;
    return `<tr><td><span class="who">${pbadge(DOT[p.name] || "#8a877f", p.name)}</span></td>
      <td class="num">${t.total ?? 0}</td><td class="num">${t.completed ?? 0}</td>
      <td class="num ${tc(p.name)}">${(+pct).toFixed(1)}%</td></tr>`; }).join("");
  const T = (d.totals || {}).tasks || {};
  const tot = focus || T.total == null ? "" : `<tr class="tot"><td><span class="who">${pbadge(TEAM_DOT, "Team")}</span></td>

   <th class="num">Done</th><th class="num">Rate</th></tr></thead>
   <tbody>${rows}${tot}</tbody></table></div></div>`;
}

const OUTCOME_SEGMENTS = [["Live Contact", "--s1"], ["Voicemail", "--s2"], ["Screener", "--s3"],
  ["No Answer", "--s4"], ["No Outcome Logged", "--s5"]];
function outcomeBreakdownHtml(d, who) {
  const outcomes = d.outcomes || {};
  const byName = Object.fromEntries((d.producers || []).map(p => [p.name, p]));
  const names = (who ? [who] : Object.keys(outcomes)).filter(n => byName[n]);
  const withVol = names.map(n => ({ name: n, o: outcomes[n] || {}, vol: (byName[n] || {}).dials || 0 }))
    .filter(x => Object.values(x.o).some(v => v));
  if (!withVol.length) return "";
  withVol.sort((a, b) => b.vol - a.vol);
  const busiest = Math.max(...withVol.map(x => x.vol), 1);
  const rows = withVol.map(({ name, o, vol }) => {
    const total = vol || 1;
    const segs = OUTCOME_SEGMENTS.map(([label, cvar]) => {
      const n = o[label] || 0;
      if (!n) return "";
      return `<span class="ogseg" style="width:${(n / total * 100).toFixed(2)}%;background:var(${cvar})" title="${label}: ${n}"></span>`;
    }).join("");
    return `<div class="orow"><div class="orow-head">
      <span class="who">${pbadge(DOT[name] || "#8a877f", name)}</span>
      <span class="on">${vol} new-business dial${vol === 1 ? "" : "s"}</span></div>
      <div style="width:${(vol / busiest * 100).toFixed(2)}%"><div class="otrack">${segs}</div></div></div>`;
  }).join("");
  const legend = OUTCOME_SEGMENTS.map(([label, cvar]) =>
    `<span class="oleg-item"><span class="pd" style="background:var(${cvar})"></span>${label}</span>`).join("");
  return `<div class="sect"><h2>Call Outcome Breakdown</h2>
   <p class="sd">Behind the Contact Rate numbers — sorted by call volume, bars scaled to the busiest producer.</p>
   ${rows}<div class="oleg">${legend}</div></div>`;
}

// Idle = tracked minus productive, straight from the two "HH:MM" strings
// board_payload already carries -- the same figure util_panel.py's email
// card shows ("<b>{total-prod}</b> idle"), just not computed on the board
// (Frank, 2026-09-12: "the utilization cards dont have idle time anymore").
function idleFromHHMM(total, prod) {
  if (!total || !prod) return null;
  const mins = s => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
  const diff = mins(total) - mins(prod);
  if (!Number.isFinite(diff) || diff < 0) return null;
  return `${Math.floor(diff / 60)}h ${String(diff % 60).padStart(2, "0")}m`;
}
function utilizationHtml(d, who) {
  const byName = Object.fromEntries((d.producers || []).map(p => [p.name, p]));
  const focus = who ? byName[who] : null;
  const TI = { green: "tg", yellow: "ty", red: "tr" };
  const tc = (name) => TI[((d.tiers || {})[name] || {})["util"]] || "";
  const list = (focus ? [focus] : (d.producers || [])).filter(p => p.util != null);
  if (!list.length) return "";
  const cards = list.map(p => { const idle = idleFromHHMM(p.util_total, p.util_prod);
    return `<div class="tile">
    <div class="k">${p.name}</div><div class="v ${tc(p.name)}">${p.util}%</div>
    <div class="n">${p.util_prod || "—"} productive / ${p.util_total || "—"} tracked</div>
    ${idle ? `<div class="n">${idle} idle</div>` : ""}</div>`; }).join("");
  const T = d.totals || {};
  const teamCard = focus || T.util == null ? "" : `<div class="tile" style="border-color:var(--border-strong)">
    <div class="k">Team</div><div class="v ${TI[((d.tiers || {})["team"] || {})["util"]] || ""}">${T.util}%</div>
    <div class="n">weighted</div></div>`;
  return `<div class="sect"><h2>Utilization and Efficiency</h2>
   <p class="sd">Tracked time in Insightful, per producer.</p>
   <div class="tiles">${cards}${teamCard}</div></div>`;
}

// Must mirror digest_config.COACH_BAR_RANGES -- team-relative extremes over
// the trailing window, not a share of the 0-800 scale (CLAUDE.md's Coach AI
// section). Not exposed in the JSON payload since it's a fixed, manually-
// curated constant, not per-day data.
const COACH_BAR_RANGES = { "Avg Call Score": [38, 251], "Avg Sentiment": [11, 43], "Role Play": [58, 87] };
function coachQualityHtml(d, who) {
  const byName = Object.fromEntries((d.producers || []).map(p => [p.name, p]));
  const focus = who ? byName[who] : null;
  const list = (focus ? [focus] : (d.producers || []))
    .filter(p => p.coach && (p.coach.calls || p.coach.score || p.coach.roleplay));
  if (!list.length) return "";
  const bar = (color, label, val) => {
    const [lo, hi] = COACH_BAR_RANGES[label];
    const pct = hi > lo ? Math.max(0, Math.min(100, (val - lo) / (hi - lo) * 100)) : 0;
    return `<div class="sbar"><div class="sbl">${label}</div>
      <div class="ptrack"><div class="pfill" style="width:${pct.toFixed(2)}%;background:${color}"></div></div>
      <div class="sbv">${val ?? "—"}</div></div>`;
  };
  const cards = list.map(p => { const c = p.coach; const color = DOT[p.name] || "#8a877f";
    return `<div class="tile" style="text-align:left">
    <div class="who" style="margin-bottom:8px">${pbadge(color, p.name.split(" ")[0])}</div>
    ${bar(color, "Avg Call Score", c.score || 0)}
    ${bar(color, "Avg Sentiment", c.sentiment || 0)}
    ${bar(color, "Role Play", c.roleplay || 0)}
    </div>`; }).join("");
  return `<div class="sect"><h2>Coaching &amp; Call Quality</h2>
   <p class="sd">Coach AI (TRAQ). Avg Call Score and Avg Sentiment are excluded from the leaderboard — TRAQ
   scores a voicemail as a call (~3 against a live call's ~292), so both track who answered more than how
   the call went.</p>
   <div class="tiles" style="grid-template-columns:repeat(auto-fill,minmax(210px,1fr))">${cards}</div></div>`;
}

function speedPanel(d, who) {

   + (!who && s.team ? `<div class="tile" style="border-color:var(--border-strong);background:var(--surface)">

function recontactPanel(d, who) {

function auditPanel(d, who) {
  const ta = d.task_audit || {};
  const LB = { a: "Task says no answer, call says contact", b: "Task done, no dial found",
               c: "Completed with a matching dial", d: "Completed, dial on another number", e: "Completed, no phone on record" };
  // Bucket counts come pre-aggregated team-wide; filtering to one producer
  // recomputes them from the underlying rows, which do carry a producer field.
  const counts = who
    ? Object.fromEntries(Object.keys(LB).map(k => [k, ((ta.rows || {})[k] || []).filter(r => r.producer === who).length]))
    : (ta.buckets || {});
  const rows = Object.entries(counts).filter(([, v]) => v).map(([k, v]) => `<tr><td>${LB[k] || k}</td><td class="num">${v}</td></tr>`).join("");
  if (!rows) return "";
  const counted = who ? Object.values(counts).reduce((a, b) => a + b, 0) : (ta.counted ?? 0);
  return `<div class="sect"><h2>Task Completion Audit</h2>
   <p class="sd">${counted} completed tasks checked against the call log.</p>
   <div class="scroll"><table><thead><tr><th>Finding</th><th class="num">Tasks</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

// True when `cur` was not a finalized days/<day>.json but a fallback from
// intraday.py's latest checkpoint (see loadDay) -- the WHOLE report renders
// from that same document (board_payload.build()'s shape is identical
// either way), so this only has to gate a small "still updating" indicator,
// not a second, separate set of numbers (Frank, 2026-09-12: the old "So far
// today" box duplicated the totals row and, worse, froze forever at
// whatever intraday.py last wrote before a day finalized -- once the
// pull_sources() staleness bug hit a checkpoint, that box showed the same
// stale reading on every later visit to that day, since nothing ever
// rewrites intraday/<day>.json after finalization).
let curLive = false;

/** One slim line above the report when it's still today's in-progress
 * snapshot, not the finalized build -- last-checkpoint time plus any
 * tripped sanity_gate.py flags. Team-level only (Frank's board, not a
 * per-producer breakdown), so it's gated the same way winsLossesHtml() is:
 * skip entirely on a producer filter. */
function liveBannerHtml(d, who) {
  if (who || !curLive) return "";
  const asOf = d.as_of ?
    new Date(d.as_of).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "";
  const flags = d.flags || [];
  return `<div class="livebanner">
    <div>Live${asOf ? ` — last checkpoint ${asOf}` : ""}, still updating through the day. Tonight's build finalizes it.</div>
    ${flags.length ? `<div class="liveflags">${flags.map(f => `<div class="liveflag">${f}</div>`).join("")}</div>` : ""}
  </div>`;
}

function digestPanel(d, who) {
  // Two-column card layout below the leaderboard, matching the email's own
  // template/report_template.html two-col-table (Frank, 2026-09-12: "the
  // digest was side by side after the leaderboard... it threw the order off
  // and i dont like the one by one"). The email's own left/right split there
  // is Sales Funnel + Task Completion Rate (left) vs. Team Leaderboard + Call
  // Outcome Breakdown + Speed to Dial + Coaching & Call Quality (right) --
  // but Sales Funnel and Team Leaderboard are already merged into ONE
  // section above (see teamLeaderboardHtml's own comment), which leaves the
  // email's own split lopsided once copied here: Coaching's cards alone run
  // taller than everything else in this grid combined, and stacking Outcome
  // Breakdown + Speed to Dial + Utilization on top of it made the right
  // column roughly double the left's height for no reason a reader would
  // want. Grouped by kind instead, at 3-and-3 for a closer match: Task
  // Completion Rate, Recontact Struggle and Call Outcome Breakdown (all
  // "how the day's effort is landing") on the left; Speed to Dial,
  // Utilization and Coaching & Call Quality (all "how time is being spent")
  // on the right. Task Completion Audit stays full-width, last -- it's the
  // OTHER, ops-only email's content, not part of the Sales Digest proper.
  // The live banner, if any, sits above all of it -- it's about right now,
  // not last night.
  return `${liveBannerHtml(d, who)}
  ${digestDay(d, who)}
  <div class="digestgrid">
    <div>${taskCompletionHtml(d, who)}${recontactPanel(d, who)}${outcomeBreakdownHtml(d, who)}</div>
    <div>${speedPanel(d, who)}${utilizationHtml(d, who)}${coachQualityHtml(d, who)}</div>
  </div>
  ${auditPanel(d, who)}`;
}

/* ---- Range aggregates (This Week / MTD / YTD / Folio / Custom) ------------
   One generic aggregator + renderer feeds every non-single-day preset.
   `docs` is either a list of full day documents (from /api/days/:day) or a
   list of already-aggregated rollup documents (month/folio) -- both shapes
   carry `totals` and `producers`, so the same merge works for either,
   reconstructing each producer's weighted talk time from `talk * live`
   (a rollup's `talk` is already an average, not raw seconds, same trick
   publish_board.publish_month/_folio use server-side). */
function aggregateDocs(docs) {
  const NUM = ["dials", "live", "hh", "pq", "ps", "pol"];
  const totals = Object.fromEntries(NUM.map(k => [k, 0]));
  const per = {};
  const days = new Set();
  for (const doc of docs) {
    const t = doc.totals || {};
    for (const k of NUM) totals[k] += t[k] || 0;
    if (doc.date) days.add(doc.date);
    for (const d of doc.days || []) days.add(d);
    for (const p of doc.producers || []) {
      const row = per[p.name] || (per[p.name] = { name: p.name, days: 0, talk_secs: 0, ...Object.fromEntries(NUM.map(k => [k, 0])) });
      for (const k of NUM) row[k] += p[k] || 0;
      row.days += p.days || 1;
      row.talk_secs += (p.talk || 0) * (p.live || 0);
    }
  }
  for (const row of Object.values(per)) {
    row.rate = row.dials ? Math.round(1000 * row.live / row.dials) / 10 : 0;
    row.talk = row.live ? Math.round(row.talk_secs / row.live) : 0;
    delete row.talk_secs;
  }
  totals.rate = totals.dials ? Math.round(1000 * totals.live / totals.dials) / 10 : 0;
  return { totals, producers: Object.values(per).sort((a, b) => b.ps - a.ps),
           business_days: days.size, days: [...days].sort() };
}
function digestRange(agg, label, sub, who) {
  const byName = Object.fromEntries((agg.producers || []).map(p => [p.name, p]));
  const focus = who ? byName[who] : null;
  const T = focus || agg.totals || {};
  const tiles = [
    ["Dials", (T.dials ?? 0).toLocaleString(), ""],
    ["Live Contacts", (T.live ?? 0).toLocaleString(), `${T.rate ?? 0}% contact rate`],
    ["Households Quoted", T.hh ?? 0, ""],
    ["Premium Quoted", money(T.pq), ""],
    ["Premium Sold", money(T.ps), `${T.pol ?? 0} policies`],
    ["Business Days", (focus ? focus.days : agg.business_days) ?? 0, ""],
  ].map(([k, v, n]) => `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div>${n ? `<div class="n">${n}</div>` : ""}</div>`).join("");

  const P = focus ? [] : (agg.producers || []);
  const rows = P.map(r => `<tr><td class="name">${r.name}</td><td class="num">${r.days ?? 0}</td>
    <td class="num">${r.dials ?? 0}</td><td class="num">${r.live ?? 0}</td><td class="num">${r.rate ?? 0}%</td>
    <td class="num">${secs(r.talk)}</td><td class="num">${r.hh ?? 0}</td>
    <td class="num">${money(r.pq)}</td><td class="num">${money(r.ps)}</td></tr>`).join("");

  return `<div class="sect"><h2>${label}${focus ? ` · ${who}` : ""}</h2>${sub ? `<p class="sd">${sub}</p>` : ""}<div class="tiles">${tiles}</div></div>
  ${P.length ? `<div class="sect"><h2>Producers</h2>
    <div class="scroll"><table><thead><tr><th>Producer</th><th class="num">Days</th><th class="num">Dials</th>
    <th class="num">Live</th><th class="num">Rate</th><th class="num">Avg Talk</th><th class="num">HH</th>

/* ---- date helpers: Arizona is always UTC-7, never DST --------------------- */
function azTodayDate() {
  // Deliberately ignores the viewer's own device timezone. The old formula
  // (now.getTime() + now.getTimezoneOffset()*60000 - 7*3600000) only came out
  // right when the viewer's device was set to UTC+0 -- getTime() is already
  // an absolute instant, so adding the device's own offset just mis-shifts
  // it by that amount for everyone else. For a device actually set to
  // Arizona (offset +420, no DST) the two terms cancel exactly, so it
  // returned the raw instant unshifted -- correct only until the true UTC
  // calendar day rolls over while Arizona's hasn't (any time from 5pm to
  // midnight AZ), at which point it silently returned TOMORROW's date.
  // Arizona is always UTC-7, never DST -- shift the absolute instant
  // directly and nothing about the viewer's own clock matters.
  return new Date(Date.now() - 7 * 3600000);
}
function isoDate(d) { return d.toISOString().slice(0, 10); }
function addDays(iso, n) { const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return isoDate(d); }
function weekStart(iso) { const d = new Date(iso + "T12:00:00Z"); return addDays(iso, -d.getUTCDay()); }

// Monday-anchored, distinct from weekStart()'s Sunday-anchored week used for
// This Week/Custom range. Role Play's weak-spot window refreshes every
// Monday to the 4 weeks that just closed (Mon-Sun x4), not a rolling 28
// days from today -- so it stays fixed all week rather than shrinking daily.
function mostRecentMonday(iso) {
  const d = new Date(iso + "T12:00:00Z");
  const sinceMonday = (d.getUTCDay() + 6) % 7;   // Mon=0 ... Sun=6
  return addDays(iso, -sinceMonday);
}
function objectionWindow4wk() {
  const monday = mostRecentMonday(isoDate(azTodayDate()));
  return { start: addDays(monday, -28), end: addDays(monday, -1) };
}

/* Fetch every day in [from, to] that actually has a report (checked against
   DAYS, the /api/days list), then aggregate. Used for This Week and Custom
   range -- there is no precomputed rollup for an arbitrary span. */
async function fetchRangeDocs(from, to) {
  const wanted = DAYS.filter(d => d >= from && d <= to);
  const docs = [];
  for (const d of wanted) {
    try {
      const r = await fetch(`/api/days/${d}`, { cache: "no-store" });
      if (r.ok) docs.push(await r.json());
    } catch (_) {}
  }
  return docs;
}

/* Cross-day objection index -- every coached call's objection, across every
   reporting day, flattened and cached once per page load. Feeds two
   things: the Coaching tab's "browse by objection" control (any producer,
   any day) and the Role Play tab's "recommended" persona (this producer's
   real unresolved objections). Fetches every day document once DAYS is
   known; small enough at current volume to just do this in the browser,
   the same way This Week/Custom range already re-fetch multiple days. */
let ALL_CALLS_CACHE = null;
async function fetchAllCalls() {
  if (ALL_CALLS_CACHE) return ALL_CALLS_CACHE;
  const out = [];
  for (const d of DAYS) {
    try {
      const r = await fetch(`/api/days/${d}`, { cache: "no-store" });
      if (!r.ok) continue;
      const doc = await r.json();
      for (const c of (doc.calls || [])) {
        if (!c.obj) continue;
        out.push({ date: d, who: c.who, lead: c.lead, cat: c.obj.cat,
                  chipt: c.obj.chipt, addressed: c.obj.addressed });
      }
    } catch (_) {}
  }
  ALL_CALLS_CACHE = out;
  return out;
}

// no toggle (Frank, 2026-09-10): a browser without SpeechRecognition just
// can't practice here yet rather than falling back to typing.
// onDone fires once the utterance finishes (or fails/is skipped), so the

// hands-free conversation, not push-to-talk every turn.
function speakProspect(text, onDone) {
  const done = () => { rpSpeaking = false; rpUpdateMicUI(); if (onDone) onDone(); };
  if (!("speechSynthesis" in window)) { done(); return; }
  try {
    window.speechSynthesis.cancel();   // don't stack replies if one is still talking

    const p = rpPersona(rpPersonaKey);
    if (p) { u.rate = p.rate; u.pitch = p.pitch; }
    rpSpeaking = true;
    u.onend = done; u.onerror = done;
    rpUpdateMicUI();
    window.speechSynthesis.speak(u);
  } catch (_) { done(); }
}

function rpUpdateMicUI(interim) {
  const mic = document.getElementById("rpMic");
  if (!mic) return;

    : rpSpeaking ? "🔊 Prospect talking…"

function rpStartListening() {
  if (rpBusy || rpSpeaking || rpListening || !rpSpeechSupported()) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new SR();
  rec.lang = "en-US";
  rec.interimResults = true;
  rec.continuous = false;
  rec.onresult = (e) => {
    let finalText = "", interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript;
    }
    if (finalText.trim()) {
      const text = finalText.trim();
      rpStopListening();
      rpSendTurn(text);
    } else {
      rpUpdateMicUI(interim.trim());
    }
  };
  rec.onerror = () => { rpListening = false; rpUpdateMicUI(); };
  rec.onend = () => { rpListening = false; rpUpdateMicUI(); };
  rpRecognition = rec;
  rpListening = true;
  rpUpdateMicUI();
  try { rec.start(); } catch (_) { rpListening = false; rpUpdateMicUI(); }
}

    return `<div class="sect"><h2>Role Play</h2>

      ${histHtml}`;
  }

  const p = rpPersona(rpPersonaKey);
  if (!rpStarted) return roleplayDebriefHtml(p);

  const msgs = rpHistory.map(m => `<div class="rpmsg ${m.role}">
    <span class="rl">${m.role === "producer" ? rpProducer.split(" ")[0] : "Prospect"}</span>${m.content}</div>`).join("")
    || `<div class="empty" style="padding:20px 0">Say hello to open the call.</div>`;

  return `<div class="sect"><h2>Role Play &middot; ${p.name}</h2>
    <p class="sd">${rpProducer}

      </div>` : `<p class="sd" style="margin:6px 0 0">This browser can't listen for speech input -- try Chrome or Edge.</p>`}
      <div class="rpactions" style="justify-content:center">

function roleplayCallGuideHtml(data, weak) {
  const decks = data.decks || [];

async function rpSendTurn(text) {
  rpHistory.push({ role: "producer", content: text });
  rpBusy = true;
  document.getElementById("view").innerHTML = roleplayPanel();
  wireRoleplayPanel();
  try {
    const focusObjections = producerWeakSpots(rpProducer).map(([c]) => c);
    const r = await fetch("/api/roleplay/turn", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ persona: rpPersonaKey, history: rpHistory, focus_objections: focusObjections, lead_source: rpLeadSource ? rpLeadSource.forCustomer : "" }),
    });
    const body = await r.json();
    if (r.ok && body.reply) {
      rpHistory.push({ role: "prospect", content: body.reply });
      speakProspect(body.reply, () => {
        if (view === "roleplay" && rpPersonaKey && !rpGrade) rpStartListening();
      });
    } else {
      rpHistory.push({ role: "prospect", content: `[could not reach the practice partner: ${body.error || r.status}]` });
    }
  } catch (e) {
    rpHistory.push({ role: "prospect", content: `[connection error: ${e}]` });

  rpBusy = false;
  document.getElementById("view").innerHTML = roleplayPanel();
  wireRoleplayPanel();
}

async function rpSubmitGrade() {
  if (!rpHistory.length || rpGrade || rpBusy) return;
  rpBusy = true;
  document.getElementById("view").innerHTML = roleplayPanel();
  wireRoleplayPanel();
  try {
    const r = await fetch("/api/roleplay/grade", {
