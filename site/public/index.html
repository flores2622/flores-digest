// Objection chart: a click-to-filter bar chart, scoped to whatever date
// range + producer filter is already active -- NOT the old bottom-of-tab
// "Browse by objection" control, which read ALL_CALLS_CACHE (every day,
// fetched once and never invalidated) so its counts never moved when the
// range changed (Frank, 2026-09-17: "i dont even think the quantity count
// is updating, numbers always stay the same when filtering different
// dates"). Computed fresh from `d.calls` (already scoped to the current
// range) on every render instead, respecting the producer filter too --
// something the old global cache couldn't do since it wasn't scoped to
// either. Moved to the TOP of Live Contact Detail, above the cards, per
// Frank's own ask.
let objFilterCat = "";
// Grouped by objection GROUP (digest_config.OBJECTION_GROUPS), not the
// model's free-text label -- 15 days produced 170 distinct labels for 198
// objections, so the chart was a list of one-offs (Frank, 2026-09-23: "they
// should be categorized"). The specific label stays on each card.
function computeObjCats(cards) {
  const agg = {};
  for (const c of cards) {
    for (const o of (c.objs || [])) {
      const g = o.group || "Other";
      const row = agg[g] || (agg[g] = [g, 0, 0]);
      row[1]++;
      if ((o.score || 0) >= 8) row[2]++;
    }
  }
  return Object.values(agg).sort((a, b) => b[1] - a[1]);
}
function objectionChartHtml(objData, scopedCount) {
  if (!objData.length) return "";
  const maxN = Math.max(...objData.map(([, n]) => n), 1);
  const rows = objData.map(([cat, n, w]) => {
    const pct = n ? Math.round(100 * w / n) : 0;
    const wonPct = n ? (100 * w / n) : 0;
    return `<div class="objrow${cat === objFilterCat ? " sel" : ""}" data-cat="${encodeURIComponent(cat)}" role="button" tabindex="0">
      <div class="objrow-head"><span class="objcat">${cat}</span><span class="objn">${n} raised · ${pct}% won</span></div>
      <div class="objtrack" style="width:${(100 * n / maxN).toFixed(1)}%"><div class="objwon" style="width:${wonPct.toFixed(1)}%"></div></div>
    </div>`;
  }).join("");
  return `<div class="sect"><h2>Objections</h2>
   <p class="sd">Raised across ${scopedCount} coached call${scopedCount === 1 ? "" : "s"} in this range. Won means addressed and overcome (score 8+/10).
   Click a bar to filter the Cards tab to that objection.${objFilterCat ? ` <button type="button" id="objClearBtn" class="linkbtn">Clear filter</button>` : ""}</p>
   <div>${rows}</div>
  </div>`;
}

function coachingPanel(d, who) {
  // `who` is the shared producerFilter (top-of-page dropdown), not a
  // tab-local control -- Digest and Coaching stay in sync on whoever is
  // selected.
  const order = ["Lorena Gonzalez", "Crystal Mango", "Mike Olvera", "Coral Barwick", "Sarahi Chin"];
  const sel = who && order.includes(who) ? who : "";
  const nav = coachSubTabsHtml();

  if (coachSubTab === "wins") {
    return nav + (winsLossesHtml(d, sel) || `<div class="empty">Nothing to show for this day.</div>`);
  }

  const multiDay = (d.days || []).length > 1;
  if (!(d.calls && d.calls.length)) return nav + `<div class="empty">
    <div style="font-weight:600;font-size:15px;margin-bottom:6px">No coaching cards ${multiDay ? "in this range" : "for this day"}</div>
    <p style="max-width:46ch;margin:0 auto;font-size:12.5px;line-height:1.6">${multiDay ? (d.label || "This range") + " has no coached calls yet"
    : `${d.label || d.date} was uploaded with its stats only`}. The cards are written from the call recordings and are not generated, so a day gets them when someone
    writes them — an empty tab here means nobody has yet, not that the calls were clean.</p></div>`;

  // Scoped to the date range (d.calls already is) AND the producer filter
  // (d.calls is NOT -- that only happens in the per-producer loop below),
  // so the chart's counts and the cards' counts always agree.
  const scoped = sel ? d.calls.filter(c => c.who === sel) : d.calls;
  const objData = computeObjCats(scoped);
  if (objFilterCat && !objData.some(([cat]) => cat === objFilterCat)) objFilterCat = "";

  if (coachSubTab === "objections") {
    return nav + (objectionChartHtml(objData, scoped.length)
      || `<div class="empty">No objections logged ${multiDay ? "in this range" : "on this day"}.</div>`);
  }

  // coachSubTab === "detail" (Cards)
  const matches = c => !objFilterCat || (c.objs || []).some(o => (o.group || "Other") === objFilterCat);
  const filterBanner = objFilterCat ? `<div class="sect" style="display:flex;justify-content:space-between;align-items:center;gap:10px">
    <span class="sd" style="margin:0">Filtered to objection "${objFilterCat}"</span>
    <button type="button" id="objClearBtn" class="linkbtn">Clear filter</button></div>` : "";

  let out = "";
  let shown = 0;
  order.forEach(p => {
    if (sel && sel !== p) return;
    const mine = d.calls.filter(c => c.who === p && matches(c));
    if (!mine.length) return;
    shown += mine.length;
    out += `<div class="sect"><h2>${p}</h2><p class="sd">${mine.length} coached call${mine.length > 1 ? "s" : ""}${objFilterCat ? ` carrying "${objFilterCat}"` : ""}</p>
      ${mine.map(card).join("")}</div>`;
  });
  if (!shown) {
    const scope = multiDay ? "in this range" : "on this day";
    out = `<div class="empty">${objFilterCat ? `No coaching cards carrying "${objFilterCat}"${sel ? ` for ${sel}` : ""} ${scope}.`
      : sel ? `No coaching cards for ${sel} ${scope}.` : `No coaching cards ${scope}.`}</div>`;
  }
  return nav + filterBanner + out + (d.notcoached ? `<div class="note" style="border:1px dashed var(--border-strong);border-radius:8px;padding:14px 16px">
    <b>Not coached, and why.</b> ${d.notcoached}</div>` : "");
}

// Flavor only -- backstory context for the debrief screen and for the

// The 4-5 things every call needs regardless of persona or lead source --
// condensed from coaching/METHODOLOGY.md's 9-dimension framework and
// coaching/TRAINING.md, not re-derived here; keep those three in sync if
// this list ever changes (Frank, 2026-09-11: training/coaching/Apollo's

const RP_APPROACH_CHECKLIST = [
  "Identify yourself and the reason for the call in the first line -- don't ask permission to explain why you're calling.",
  "Get discovery before you pitch: current premium, renewal/X-date, and what's currently covered.",

let rpProducer = "";
let rpPersonaKey = "";
let rpLeadSource = null;
let rpStarted = false;     // true once the producer clicks past the debrief into the live chat
let rpHistory = [];        // [{role:"producer"|"prospect", content}]
let rpGrade = null;
let rpBusy = false;
let rpHistoryCache = [];   // past sessions for the selected producer
let rpListening = false;
let rpSpeaking = false;
let rpRecognition = null;

function rpPersona(key) { return RP_PERSONAS.find(p => p.key === key); }

function rpSpeechSupported() { return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }

// Voice only, both directions, always on -- there is no text fallback and
// no toggle (Frank, 2026-09-10): a browser without SpeechRecognition just
// can't practice here yet rather than falling back to typing.
// onDone fires once the utterance finishes (or fails/is skipped), so the
// mic re-arms itself right after the prospect stops talking -- a continuous
// hands-free conversation, not push-to-talk every turn.
function speakProspect(text, onDone) {
  const done = () => { rpSpeaking = false; rpUpdateMicUI(); if (onDone) onDone(); };
  if (!("speechSynthesis" in window)) { done(); return; }
  try {
    window.speechSynthesis.cancel();   // don't stack replies if one is still talking
    const u = new SpeechSynthesisUtterance(text);
    const p = rpPersona(rpPersonaKey);
    if (p) { u.rate = p.rate; u.pitch = p.pitch; }
    rpSpeaking = true;
    u.onend = done; u.onerror = done;
    rpUpdateMicUI();
    window.speechSynthesis.speak(u);
  } catch (_) { done(); }
}

function rpUpdateMicUI(interim) {
  const mic = document.getElementById("rpMic");
  if (!mic) return;
  mic.classList.toggle("listening", rpListening);
  mic.disabled = rpBusy || rpSpeaking;
  mic.textContent = rpBusy ? "…"
    : rpSpeaking ? "🔊 Prospect talking…"
    : rpListening ? (interim ? `● "${interim}"` : "● Listening… (tap to pause)")
    : rpHistory.length ? "🎙 Talk" : "🎙 Push to start";
}

function rpStopListening() {
  if (rpRecognition) { try { rpRecognition.stop(); } catch (_) {} }
  rpListening = false;
  rpUpdateMicUI();
}

function rpStartListening() {
  if (rpBusy || rpSpeaking || rpListening || !rpSpeechSupported()) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new SR();
  rec.lang = "en-US";
  rec.interimResults = true;
  rec.continuous = false;
  rec.onresult = (e) => {
    let finalText = "", interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript;
    }
    if (finalText.trim()) {
      const text = finalText.trim();
      rpStopListening();
      rpSendTurn(text);
    } else {
      rpUpdateMicUI(interim.trim());
    }
  };
  rec.onerror = () => { rpListening = false; rpUpdateMicUI(); };
  rec.onend = () => { rpListening = false; rpUpdateMicUI(); };
  rpRecognition = rec;
  rpListening = true;
  rpUpdateMicUI();
  try { rec.start(); } catch (_) { rpListening = false; rpUpdateMicUI(); }
}

// "Beta / testing" (Frank, 2026-09-24): practice runs by anyone trying the
// system -- saved to the board's beta area, never to a producer's history,
// and never steered by a producer's weak spots. Until Role Play is final.
const RP_BETA = "Beta / testing";
const rpIsBeta = () => rpProducer === RP_BETA;

// on one actual producer's weak spots and rotates to the next producer with
// every session, so a tester sees what each producer would really be given.
// The pointer is per browser; it only affects which producer is borrowed.
let rpBetaAs = "";
function rpNextBetaProducer() {
  let i = -1;
  try { i = parseInt(localStorage.getItem("rpBetaRotate") || "-1", 10); } catch (_) {}
  const withWeak = PRODUCER_ROSTER.filter(p => producerWeakSpots(p).length);
  const pool = withWeak.length ? withWeak : PRODUCER_ROSTER;
  const cur = PRODUCER_ROSTER.indexOf(rpBetaAs);
  // Next producer in roster order after the last one used, among those with
  // real weak spots to borrow.
  const start = cur >= 0 ? cur : i;
  let next = pool[0];
  for (let k = 1; k <= PRODUCER_ROSTER.length; k++) {
    const cand = PRODUCER_ROSTER[(start + k + PRODUCER_ROSTER.length) % PRODUCER_ROSTER.length];
    if (pool.includes(cand)) { next = cand; break; }
  }
  rpBetaAs = next;
  try { localStorage.setItem("rpBetaRotate", String(PRODUCER_ROSTER.indexOf(next))); } catch (_) {}
  return next;
}
// Whose real weak spots steer this session: the producer practising, or --
// for a beta session -- the producer it is currently borrowing.
// Not chosen until the real calls have loaded -- before that nobody has weak
// spots and the rotation would pick blind.
const rpWeakFor = () => !rpIsBeta() ? rpProducer
  : (rpBetaAs || (ALL_CALLS_CACHE ? rpNextBetaProducer() : ""));

async function rpFetchHistory() {
  if (!rpProducer) { rpHistoryCache = []; return; }
  try {
    const q = rpIsBeta() ? "beta=1" : `producer=${encodeURIComponent(rpProducer)}`;
    const r = await fetch(`/api/roleplay/history?${q}`, { cache: "no-store" });
    const body = r.ok ? await r.json() : { sessions: [] };
    rpHistoryCache = body.sessions || [];
  } catch (_) { rpHistoryCache = []; }
}

/* This producer's real, unresolved objection categories -- from actual
   coached calls, not practice sessions -- most-common first, capped at 2.
   "Unresolved" here means a score under 8/10; a strongly-resolved
   objection isn't a weak spot to drill. Windowed to the trailing 4
   completed weeks (Frank, 2026-09-10): refreshes every Monday to the 4
   weeks that just closed, so a bad stretch from months ago doesn't keep
   dictating today's practice once it's been fixed. */
function producerWeakSpots(producer) {
  if (!ALL_CALLS_CACHE) return [];
  const { start, end } = objectionWindow4wk();
  const counts = {};
  for (const c of ALL_CALLS_CACHE) {
    if (!c.cat || c.who !== producer || (c.score || 0) >= 8) continue;
    if (c.date < start || c.date > end) continue;
    // By objection GROUP, not the free-text label -- with ~one label per
    // objection, counting labels picked two near-random one-offs.
    const g = c.group || "Other";
    counts[g] = (counts[g] || 0) + 1;
  }
  return Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 2);
}

function roleplayCallGuideHtml(data, weak) {

async function rpSendTurn(text) {
  rpHistory.push({ role: "producer", content: text });
  rpBusy = true;
  document.getElementById("view").innerHTML = roleplayPanel();
  wireRoleplayPanel();
  try {
    const focusObjections = producerWeakSpots(rpWeakFor()).map(([c]) => c);
    const r = await fetch("/api/roleplay/turn", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ persona: rpPersonaKey, history: rpHistory, focus_objections: focusObjections, lead_source: rpLeadSource ? rpLeadSource.forCustomer : "" }),
    });
    const body = await r.json();
    if (r.ok && body.reply) {
      rpHistory.push({ role: "prospect", content: body.reply });
      speakProspect(body.reply, () => {
        if (view === "roleplay" && rpPersonaKey && !rpGrade) rpStartListening();
      });
    } else {
      rpHistory.push({ role: "prospect", content: `[could not reach the practice partner: ${body.error || r.status}]` });
    }
  } catch (e) {
    rpHistory.push({ role: "prospect", content: `[connection error: ${e}]` });
  }
  rpBusy = false;
  document.getElementById("view").innerHTML = roleplayPanel();
  wireRoleplayPanel();
}

async function rpSubmitGrade() {
  if (!rpHistory.length || rpGrade || rpBusy) return;
  rpBusy = true;
  document.getElementById("view").innerHTML = roleplayPanel();
  wireRoleplayPanel();
  try {
    const r = await fetch("/api/roleplay/grade", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ producer: rpProducer, persona: rpPersonaKey, history: rpHistory, lead_source: rpLeadSource ? rpLeadSource.label : "",
                             beta: rpIsBeta(), ...(rpIsBeta() ? { as_producer: rpWeakFor() } : {}) }),
    });
    const body = await r.json();
    if (r.ok && body.grade) rpGrade = body.grade;
    if (rpIsBeta()) rpNextBetaProducer();     // next beta session borrows the next producer
    await rpFetchHistory();
  } catch (_) {}
  rpBusy = false;
  document.getElementById("view").innerHTML = roleplayPanel();
  wireRoleplayPanel();
}

function wireRoleplayPanel() {
  // Auto-grade on the way out: nothing that got practiced should go
  // ungraded just because the producer picked a new scenario or switched
  // who's practicing, rather than clicking "Grade my attempt" themselves.
  const gradeThenReset = async (reset) => {
    rpStopListening();
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    if (rpHistory.length && !rpGrade) await rpSubmitGrade();
    reset();
    document.getElementById("view").innerHTML = roleplayPanel();
    wireRoleplayPanel();
    // The producer picker needs the cross-day objection index for its
    // "Recommended" banner; paint() only fetches it on a fresh tab entry,
    // so a same-tab producer change/reset has to ask for it too.
    if (rpProducer && !ALL_CALLS_CACHE) {
      fetchAllCalls().then(() => {
        if (view !== "roleplay") return;
        document.getElementById("view").innerHTML = roleplayPanel();
        wireRoleplayPanel();
      });
    }
  };
  const prodSel = document.getElementById("rpProdSel");
  if (prodSel) prodSel.onchange = () => gradeThenReset(async () => {
    rpProducer = prodSel.value; rpPersonaKey = ""; rpStarted = false; rpHistory = []; rpGrade = null;
    await rpFetchHistory();
  });
  const changeProd = document.getElementById("rpChangeProducer");
  if (changeProd) changeProd.onclick = () => gradeThenReset(() => {
    rpProducer = ""; rpPersonaKey = ""; rpStarted = false; rpHistory = []; rpGrade = null;
  });
  document.querySelectorAll(".pcard").forEach(el => el.onclick = () => {
    rpStopListening();
    rpPersonaKey = el.dataset.persona; rpLeadSource = pickLeadSource(); rpStarted = false; rpHistory = []; rpGrade = null;
    document.getElementById("view").innerHTML = roleplayPanel();
    wireRoleplayPanel();
  });
  const changePersona = document.getElementById("rpChangePersona");
  if (changePersona) changePersona.onclick = () => {
    rpStopListening();
    rpPersonaKey = ""; rpStarted = false; rpHistory = []; rpGrade = null;
    document.getElementById("view").innerHTML = roleplayPanel();
    wireRoleplayPanel();
  };
  const startCall = document.getElementById("rpStartCall");
  if (startCall) startCall.onclick = () => {
    rpStarted = true;
    document.getElementById("view").innerHTML = roleplayPanel();
    wireRoleplayPanel();
  };
  const newScenario = document.getElementById("rpNewScenario");
  // Reset the transcript/grade (same persona, same producer) and roll a
  // fresh lead source, back to the debrief screen -- a "new scenario" is a
  // new client, not just a blank transcript (Frank, 2026-09-10 originally
  // added this button to reset the transcript; extended 2026-09-11 to also
  // re-debrief since scenarios now carry a lead source).
  if (newScenario) newScenario.onclick = () => gradeThenReset(() => {
    rpLeadSource = pickLeadSource(); rpStarted = false; rpHistory = []; rpGrade = null;
  });
  const grade = document.getElementById("rpGrade");
  if (grade) grade.onclick = () => { rpStopListening(); rpSubmitGrade(); };
  const mic = document.getElementById("rpMic");
  if (mic) { mic.onclick = () => { rpListening ? rpStopListening() : rpStartListening(); }; rpUpdateMicUI(); }
}

/* ---- Trends tab ------------------------------------------------------------
   Built from the month rollups' own `trend` arrays (already computed nightly
   by publish_board.publish_month) rather than fetching every day's full
   document -- that keeps this tab to one small read per month instead of
   megabytes of R2 reads on every page load. The rollup doesn't carry the
   per-day "time set" figure the original artifact's Trends table had, so
   that column isn't reproducible here.

   NOT cached across visits (removed 2026-09-17, Frank: "11 reporting days
   is half the business month. it still says not enough days"). The old
   `if (TREND_CACHE) return TREND_CACHE` locked in whatever the trend
   looked like the first time this tab was opened in a given browser
   session and never refreshed it again -- a tab left open from earlier in
   the day, before that day (or any new day since) was published, kept
   showing "not enough days on file" forever after, even once the real
   month rollup had 11+ real entries (confirmed directly against
   /api/months/2026-09, which was already correct). Re-fetching the
   month rollup on every visit is still cheap -- it's the one small
   monthly-rollup read this comment already describes, not a full day
   document -- so there's no real cost to dropping the cache. */
async function loadTrend() {
  const months = [...new Set(DAYS.map(d => d.slice(0, 7)))].sort();
  const rows = [];
  for (const m of months) {
    try {
      const r = await fetch(`/api/months/${m}`, { cache: "no-store" });
      if (!r.ok) continue;
      const doc = await r.json();
      for (const t of (doc.trend || [])) rows.push(t);
    } catch (_) {}
  }
  rows.sort((a, b) => a.date < b.date ? -1 : 1);
  return rows;
}
function lineChart(points, fmt, tipFn) {
  const W = 720, H = 200, L = 44, R = 12, T = 14, B = 26;
  const xs = i => L + (points.length < 2 ? (W - L - R) / 2 : i * (W - L - R) / (points.length - 1));
  const vals = points.map(p => p.v);
  const hi = Math.max(...vals, 0), lo = Math.min(...vals, 0);
  const span = (hi - lo) || 1;
  const ys = v => T + (H - T - B) * (1 - (v - lo) / span);
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("class", "trend"); svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("preserveAspectRatio", "none");
  for (const frac of [0, 0.5, 1]) {
    const v = lo + span * frac, y = ys(v);
    const g = document.createElementNS(ns, "line");
    g.setAttribute("class", "grid"); g.setAttribute("x1", L); g.setAttribute("x2", W - R); g.setAttribute("y1", y); g.setAttribute("y2", y);
    svg.append(g);
    const t = document.createElementNS(ns, "text");
    t.setAttribute("class", "axis"); t.setAttribute("x", 4); t.setAttribute("y", y + 4);
    t.textContent = fmt(Math.round(v * 10) / 10);
    svg.append(t);
  }
  const path = document.createElementNS(ns, "path");
  path.setAttribute("class", "ln");
  path.setAttribute("d", points.map((p, i) => `${i ? "L" : "M"}${xs(i)},${ys(p.v)}`).join(" "));
  svg.append(path);
  points.forEach((p, i) => {
    const c = document.createElementNS(ns, "circle");
    c.setAttribute("class", "dot"); c.setAttribute("cx", xs(i)); c.setAttribute("cy", ys(p.v)); c.setAttribute("r", 4);
    svg.append(c);
    const lab = document.createElementNS(ns, "text");
    lab.setAttribute("class", "axis"); lab.setAttribute("x", xs(i)); lab.setAttribute("y", H - 8); lab.setAttribute("text-anchor", "middle");
    lab.textContent = p.label;
    svg.append(lab);
    const hit = document.createElementNS(ns, "rect");
    hit.setAttribute("class", "hit");
    hit.setAttribute("x", xs(i) - (W - L - R) / (2 * Math.max(1, points.length - 1)));
    hit.setAttribute("y", 0);
    hit.setAttribute("width", (W - L - R) / Math.max(1, points.length - 1));
    hit.setAttribute("height", H);
    hoverable(hit, tipFn(p));
    svg.append(hit);
  });
  return svg.outerHTML;
}
/* ---- Training tab: Apollo's flashcard decks (coaching/TRAINING.md) -------- */

async function loadTraining() {
  if (TRAINING_CACHE) return TRAINING_CACHE;
  try {
    const r = await fetch("/api/training", { cache: "no-store" });
    TRAINING_CACHE = r.ok ? await r.json() : { decks: [] };
  } catch (_) { TRAINING_CACHE = { decks: [] }; }
  return TRAINING_CACHE;
}

function shuffledOrder(n) {
  const a = Array.from({ length: n }, (_, i) => i);
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// mini markdown -> html for a card's back: just bullet lines and *word* bold,
// enough for TRAINING.md's own "- " lines and quoted example phrasing --
// deliberately not a full markdown parser, this content is hand-written and
// never carries anything richer than that.
//
// A bullet's own wrapped continuation line is indented in the source with
// no leading "- " (TRAINING.md wraps long quoted lines this way, often with
// no blank line before the next paragraph either -- e.g. "- ...\n  ...\nThe
// failure mode..."). Indentation, not blank lines, is what marks a
// continuation vs. a new paragraph that just happens to follow a list.
function trainingMd(text) {
  const lines = text.split("\n");
  let html = "", inList = false;
  for (const line of lines) {
    const mNew = line.match(/^- (.*)/);
    const mCont = !mNew && inList ? line.match(/^\s+(\S.*)/) : null;
    if (mNew) {
      if (!inList) { html += "<ul class=\"gl\">"; inList = true; }
      html += `<li>${mNew[1]}</li>`;
    } else if (mCont) {
      html = html.replace(/<\/li>$/, ` ${mCont[1]}</li>`);
    } else {
      if (inList) { html += "</ul>"; inList = false; }
      if (line.trim()) html += `<p style="margin:0 0 10px">${line}</p>`;
    }
  }
  if (inList) html += "</ul>";
  return html;
}

// Flattened, length-capped version of a card's back for contexts that need
// short text (quiz answer choices, match tiles) instead of the full
// markdown-rendered back -- strips bullet markers and line breaks, cuts at
// a word boundary rather than mid-word.
function plainSnippet(text, maxLen) {
  maxLen = maxLen || 130;
  const flat = text.replace(/^- /gm, "").replace(/\s+/g, " ").trim();
  if (flat.length <= maxLen) return flat;
  const cut = flat.slice(0, maxLen);
  const lastSpace = cut.lastIndexOf(" ");
  return (lastSpace > 40 ? cut.slice(0, lastSpace) : cut) + "…";
}

// Left-to-right order of the mode pills (Frank, 2026-09-23): reference first,
// then the three ways to practise it. The leftmost is also what opens.
const TRAINING_MODE_LABELS = { ref: "Terms & Techniques", cards: "Flashcards", match: "Match", quiz: "Quiz" };

function trainingPanel(data) {
  const decks = data.decks || [];
  if (!decks.length) return '<div class="empty">No training content yet.</div>';
  const deck = decks[trainingDeckIdx] || decks[0];
  const modePills = Object.keys(TRAINING_MODE_LABELS).map(m =>
    `<button class="subtab ${m === trainingMode ? "sel" : ""}" data-mode="${m}">${TRAINING_MODE_LABELS[m]}</button>`).join("");
  const deckPills = decks.map((d, i) =>
    `<button class="subtab ${i === trainingDeckIdx ? "sel" : ""}" data-deck="${i}">${d.name}</button>`).join("");
  let body;
  if (trainingMode === "quiz") body = quizBody(deck);
  else if (trainingMode === "match") body = matchBody(deck);
  else if (trainingMode === "ref") body = refBody(deck);
  else body = flashcardsBody(deck);
  return `<div class="subtabs" style="margin-bottom:8px">${modePills}</div>
  <div class="subtabs" style="margin-bottom:16px">${deckPills}</div>
  ${body}`;
}

// Terms & Techniques (Frank, 2026-09-11): a plain scrollable read of the
// same deck data flashcards flips one at a time -- "explains everything
// without having to download the cheatsheet." Replaces an earlier
// print-cheatsheet attempt entirely; nothing here is ever saved, emailed,
// or printed, so there's no stale copy to worry about -- it's just the
// live content, read straight from the page.
function refBody(deck) {
  const cards = deck.cards.map(c =>
    `<div class="refcard"><h3>${c.front}</h3><div class="fctext-back">${trainingMd(c.back)}</div></div>`).join("");
  return `<div class="sect refdeck">
    <div class="bl">${deck.name} &middot; ${deck.cards.length} ${deck.cards.length === 1 ? "term" : "terms"}</div>
    ${cards}
  </div>`;
}

function flashcardsBody(deck) {
  ensureTrainingOrder(deck);   // must run before idx below -- otherwise the
  // first render (before wireFlashcards ever runs) uses an empty
  // trainingOrder and shows card 0 unshuffled, then the first flip jumps to
  // whatever the freshly-shuffled order actually put at position 0
  const idx = trainingOrder[trainingPos] ?? 0;
  const card = deck.cards[idx];
  return `<div class="sect">
    <div class="bl">${deck.name} &middot; card ${trainingPos + 1} of ${deck.cards.length}</div>
    <div class="flashcard ${trainingFlipped ? "flipped" : ""}" id="flashcard" tabindex="0" role="button" aria-label="Flip card">
      <div class="fcinner">
        <div class="fcface fcfront"><div class="fctext">${card.front}</div></div>
        <div class="fcface fcback"><div class="fctext fctext-back">${trainingMd(card.back)}</div></div>
      </div>
    </div>
    <div class="fccontrols">
      <button class="btn" id="fcprev">&larr; Prev</button>
      <button class="btn" id="fcflip">Flip</button>
      <button class="btn" id="fcnext">Next &rarr;</button>
      <button class="btn" id="fcshuffle">Shuffle</button>
    </div>
  </div>`;
}

function ensureTrainingOrder(deck) {
  if (trainingOrder.length !== deck.cards.length) {
    trainingOrder = shuffledOrder(deck.cards.length);
    trainingPos = 0;
  }
}

// ---- Quiz: 5 random questions, each deck card's real front against its
// own back plus 3 real backs from other cards in the same deck as
// distractors (every deck has >=4 cards, so there are always 3 of them). ----
function buildQuiz(deck) {
  const n = Math.min(5, deck.cards.length);
  const order = shuffledOrder(deck.cards.length).slice(0, n);
  quizQuestions = order.map(i => {
    const correct = deck.cards[i];
    const pool = deck.cards.filter((_, j) => j !== i);
    const distractIdx = shuffledOrder(pool.length).slice(0, Math.min(3, pool.length));
    const raw = [{ text: plainSnippet(correct.back), correct: true }]
      .concat(distractIdx.map(j => ({ text: plainSnippet(pool[j].back), correct: false })));
    const shuffled = shuffledOrder(raw.length).map(k => raw[k]);
    return { front: correct.front, options: shuffled };
  });
  quizIdx = 0; quizScore = 0; quizSelected = null; quizMissed = [];
}
function ensureQuiz(deck) { if (!quizQuestions.length) buildQuiz(deck); }

function quizBody(deck) {
  ensureQuiz(deck);
  if (quizIdx >= quizQuestions.length) {
    const rows = quizMissed.map(m => `<div class="quizmissrow"><b>${m.front}</b><div class="sd" style="margin:2px 0 0">${m.correct}</div></div>`).join("");
    return `<div class="sect">
      <div class="bl">${deck.name} &middot; Quiz results</div>
      <div class="quizscore">${quizScore} / ${quizQuestions.length}</div>
      ${quizMissed.length ? `<div class="bl" style="margin-top:14px">Missed</div>${rows}` : '<p class="sd">Perfect score.</p>'}
      <div class="fccontrols" style="margin-top:14px"><button class="btn" id="quizRetry">Retry quiz</button></div>
    </div>`;
  }
  const q = quizQuestions[quizIdx];
  const answered = quizSelected !== null;
  const opts = q.options.map((o, i) => {
    let cls = "quizopt";
    if (answered && o.correct) cls += " correct";
    else if (answered && i === quizSelected) cls += " wrong";
    return `<button class="${cls}" data-opt="${i}" ${answered ? "disabled" : ""}>${o.text}</button>`;
  }).join("");
  return `<div class="sect">
    <div class="bl">${deck.name} &middot; Quiz &middot; question ${quizIdx + 1} of ${quizQuestions.length} &middot; score ${quizScore}</div>
    <div class="quizq">${q.front}</div>
    <div class="quizopts">${opts}</div>
    ${answered ? `<div class="fccontrols" style="margin-top:12px"><button class="btn" id="quizNext">${quizIdx + 1 < quizQuestions.length ? "Next question →" : "See results →"}</button></div>` : ""}
  </div>`;
}

// ---- Match: click a term then a definition (either order); a correct pair
// locks in green, a wrong pair flashes red and clears both selections.
// Capped at 6 pairs so even a 15-card deck fits on one screen. ----
function buildMatch(deck) {
  const n = Math.min(6, deck.cards.length);
  const idxs = shuffledOrder(deck.cards.length).slice(0, n);
  matchPairs = idxs.map(i => ({ front: deck.cards[i].front, back: plainSnippet(deck.cards[i].back, 90) }));
  matchTermOrder = shuffledOrder(matchPairs.length);
  matchDefOrder = shuffledOrder(matchPairs.length);
  matchSelectedTerm = null; matchSelectedDef = null; matchSolved = new Set(); matchWrong = null; matchAttempts = 0;
}
function ensureMatch(deck) { if (!matchPairs.length) buildMatch(deck); }

function matchBody(deck) {
  ensureMatch(deck);
  const won = matchSolved.size === matchPairs.length;
  const tile = (i, label, selected) => {
    let cls = "matchtile";
    if (matchSolved.has(i)) cls += " solved";
    else if (selected === i) cls += " sel";
    if (matchWrong && (matchWrong.term === i || matchWrong.def === i) && selected === i) cls += " wrong";
    return `<button class="${cls}" data-idx="${i}" ${matchSolved.has(i) ? "disabled" : ""}>${label}</button>`;
  };
  const termCol = matchTermOrder.map(i => tile(i, matchPairs[i].front, matchSelectedTerm)).join("");
  const defCol = matchDefOrder.map(i => tile(i, matchPairs[i].back, matchSelectedDef)).join("");
  return `<div class="sect">
    <div class="bl">${deck.name} &middot; Match &middot; ${matchSolved.size} of ${matchPairs.length} matched &middot; ${matchAttempts} attempts</div>
    ${won
      ? `<div class="quizscore">Solved!</div><div class="fccontrols" style="margin-top:10px"><button class="btn" id="matchRetry">Play again</button></div>`
      : `<div class="matchgrid">
          <div class="matchcol" data-col="term">${termCol}</div>
          <div class="matchcol" data-col="def">${defCol}</div>
        </div>`}
  </div>`;
}

function wireTrainingPanel(data) {
  const decks = data.decks || [];
  const repaintAll = () => { $("#view").innerHTML = trainingPanel(data); wireTrainingPanel(data); };
  $$(".subtab[data-deck]").forEach(b => b.onclick = () => {
    trainingDeckIdx = Number(b.dataset.deck);
    trainingOrder = []; trainingPos = 0; trainingFlipped = false;
    quizQuestions = []; matchPairs = [];   // force a fresh build for the new deck
    repaintAll();
  });
  $$(".subtab[data-mode]").forEach(b => b.onclick = () => {
    trainingMode = b.dataset.mode;
    quizQuestions = []; matchPairs = [];   // fresh questions/pairs every time a mode is (re-)entered
    repaintAll();
  });
  const deck = decks[trainingDeckIdx];
  if (trainingMode === "quiz") { wireQuiz(deck, repaintAll); return; }
  if (trainingMode === "match") { wireMatch(deck, repaintAll); return; }

  ensureTrainingOrder(deck);
  const flip = () => { trainingFlipped = !trainingFlipped; repaintAll(); };
  const move = (delta) => {
    trainingPos = (trainingPos + delta + deck.cards.length) % deck.cards.length;
    trainingFlipped = false;
    repaintAll();
  };
  const fc = $("#flashcard");
  if (fc) {
    fc.onclick = flip;
    fc.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } };
  }
  const flipBtn = $("#fcflip"); if (flipBtn) flipBtn.onclick = flip;
  const prevBtn = $("#fcprev"); if (prevBtn) prevBtn.onclick = () => move(-1);
  const nextBtn = $("#fcnext"); if (nextBtn) nextBtn.onclick = () => move(1);
  const shufBtn = $("#fcshuffle"); if (shufBtn) shufBtn.onclick = () => {
    trainingOrder = shuffledOrder(deck.cards.length);
    trainingPos = 0; trainingFlipped = false;
    repaintAll();
  };
}

function wireQuiz(deck, repaintAll) {
  ensureQuiz(deck);
  $$(".quizopt[data-opt]").forEach(b => b.onclick = () => {
    if (quizSelected !== null) return;
    const i = Number(b.dataset.opt);
    quizSelected = i;
    const q = quizQuestions[quizIdx];
    if (q.options[i].correct) quizScore++;
    else quizMissed.push({ front: q.front, correct: (q.options.find(o => o.correct) || {}).text || "" });
    repaintAll();
  });
  const next = $("#quizNext");
  if (next) next.onclick = () => { quizIdx++; quizSelected = null; repaintAll(); };
  const retry = $("#quizRetry");
  if (retry) retry.onclick = () => { buildQuiz(deck); repaintAll(); };
}

function wireMatch(deck, repaintAll) {
  ensureMatch(deck);
  const tryMatch = () => {
    if (matchSelectedTerm === null || matchSelectedDef === null) { repaintAll(); return; }
    matchAttempts++;
    if (matchSelectedTerm === matchSelectedDef) {
      matchSolved.add(matchSelectedTerm);
      matchSelectedTerm = null; matchSelectedDef = null; matchWrong = null;
      repaintAll();
    } else {
      matchWrong = { term: matchSelectedTerm, def: matchSelectedDef };
      repaintAll();
      setTimeout(() => {
        if (view !== "training" || trainingMode !== "match") return;   // navigated away before the flash cleared
        matchSelectedTerm = null; matchSelectedDef = null; matchWrong = null;
        repaintAll();
      }, 700);
    }
  };
  $$('.matchcol[data-col="term"] .matchtile[data-idx]').forEach(b => b.onclick = () => {
    matchSelectedTerm = Number(b.dataset.idx);
    tryMatch();
  });
  $$('.matchcol[data-col="def"] .matchtile[data-idx]').forEach(b => b.onclick = () => {
    matchSelectedDef = Number(b.dataset.idx);
    tryMatch();
  });
  const retry = $("#matchRetry");
  if (retry) retry.onclick = () => { buildMatch(deck); repaintAll(); };
}

/* ---- Sales tab -------------------------------------------------------------
   A same-day, self-reported log producers fill in themselves (Frank,
   2026-09-12) -- explicitly NOT the official Premium Sold figure, which
   stays AgencyZoom-derived everywhere else on this board (see
   site/worker.js's postSalesLog docstring). Reconciliation against real
   AgencyZoom policies happens offline; this UI only creates/lists/deletes
   entries and shows whatever reconciliation status R2 already carries.

   The log below the form spans the WHOLE current folio, not just today
   (Frank, 2026-09-14: "I want this folios sales sheet to be displayed,
   sorted from recently added to oldest added") -- a new sale is still
   logged against salesDay specifically, but everyone wants to see the
   whole folio's entries in one place, newest first. Each entry carries its
   own `day` (from the folio endpoint, or injected here for the single-day
   fallback) so a delete request targets the right day's R2 key even when
   that's not today. */
async function loadSalesLog(day, folioEnd) {
  if (!salesDay) salesDay = isoDate(azTodayDate());
  const d = day || salesDay;
  // folioEnd lets a caller pin an older, already-closed folio (see
  // salesFolioPick) instead of always resolving to whichever folio `d`
  // (today) falls in.
  const end = folioEnd || folioEndFor(d);
  try {
    const url = end ? `/api/saleslog/folio/${end}` : `/api/saleslog/${d}`;
    const r = await fetch(url, { cache: "no-store" });
    const body = r.ok ? await r.json() : { entries: [] };
    salesEntries = (body.entries || []).map(e => ({ day: d, ...e }))
      .sort((a, b) => (b.created_at || "").localeCompare(a.created_at || ""));
  } catch (_) { salesEntries = []; }
  return { day: d, entries: salesEntries, folio_end: end };
}

async function loadLeadSources() {
  if (salesLeadSourceCache) return salesLeadSourceCache;
  try {
    const r = await fetch("/api/leadsources", { cache: "no-store" });
    const body = r.ok ? await r.json() : { sources: [] };
    salesLeadSourceCache = body.sources || [];
  } catch (_) { salesLeadSourceCache = []; }
  return salesLeadSourceCache;
}

function docsSignedOpts(selected) {
  return DOCS_SIGNED_OPTIONS.map(v =>
    `<option value="${v}"${v === selected ? " selected" : ""}>${v || "(pending)"}</option>`).join("");
}

// Small red trashcan (Frank, 2026-09-15: "instead of a button labeled
// delete, a small red trashcan") -- replaces the old text "delete" button
// on a logged row. currentColor so .del-btn's own CSS colour applies.
const TRASH_ICON = `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>`;

// Per-producer + team totals for this folio's log, at the top of the Sales
// tab (Frank, 2026-09-15: "i want totals at the top for everyone and the
// team total"). Counts every logged entry regardless of Docs Signed/
// Review Sent state -- this is a tally of what's been SELF-REPORTED this
// folio, the same "not the official Premium Sold figure" scope as the log
// itself, not a reconciled/official count.
function salesTotalsHtml(entries) {
  if (!entries.length) return "";
  const byProd = {};
  for (const e of entries) {
    const group = salesGroupName(e.producer);
    const row = byProd[group] || (byProd[group] = { count: 0, premium: 0 });
    row.count++;
    row.premium += e.premium || 0;
  }
  // Producer cards stacked 3-across on the left (Frank, 2026-09-15: "the
  // producer boxes would be in three columns, 2 rows"), the Team card on
  // its own row underneath them, and a pie chart of the same premium split
  // to the right -- same .tile component speedPanel uses elsewhere, same
  // shape: name in .k, the dollar figure in .v. Coral/Sarahi collapse into
  // one "The Insurance Icons" card here (salesGroupName above); every other
  // rollup on the board keeps them separate.
  const names = Object.keys(byProd).sort((a, b) => byProd[b].premium - byProd[a].premium);
  const cards = names.map(name => `
    <div class="tile"><div class="k">${pbadge(DOT[name] || "#8a877f", salesShortLabel(name))}</div>
      <div class="v">${money(byProd[name].premium)}</div>
      <div class="n">${byProd[name].count} sale${byProd[name].count === 1 ? "" : "s"}</div></div>`).join("");
  const teamCount = entries.length;
  const teamPremium = entries.reduce((s, e) => s + (e.premium || 0), 0);

  // conic-gradient pie, one slice per producer by premium share -- no
  // charting library on this page, and a CSS conic-gradient circle needs
  // nothing more than the same start/end percentages every slice already
  // has to add up to 100 anyway.
  let acc = 0;
  const slices = names.map(name => {
    const pct = teamPremium ? byProd[name].premium / teamPremium * 100 : 0;
    const from = acc; acc += pct;
    return `${DOT[name] || "#8a877f"} ${from.toFixed(2)}% ${acc.toFixed(2)}%`;
  }).join(", ");
  const legend = names.map(name => `<div style="display:flex;align-items:center;gap:6px">
      <i style="width:10px;height:10px;border-radius:2px;background:${DOT[name] || "#8a877f"};flex:none"></i>
      <span style="flex:1">${salesShortLabel(name)}</span>
      <span style="color:var(--text-muted);font-variant-numeric:tabular-nums">${teamPremium ? Math.round(byProd[name].premium / teamPremium * 100) : 0}%</span>
    </div>`).join("");

  return `<div class="sect">
    <h2>Totals</h2>
    <div style="display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start">
      <div style="flex:0 1 460px">
        <div class="tiles" style="grid-template-columns:repeat(3, 1fr)">${cards}</div>
        <div class="tile" style="margin-top:10px;max-width:148px;border-color:var(--border-strong);background:var(--surface)">
          <div class="k">Team</div>
          <div class="v">${money(teamPremium)}</div>
          <div class="n">${teamCount} sale${teamCount === 1 ? "" : "s"}</div>
        </div>
      </div>
      <div style="flex:1 1 260px;display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:4px">
        <div style="width:210px;height:210px;border-radius:50%;background:conic-gradient(${slices});flex:none"
             title="Premium sold by producer, this folio"></div>
        <div style="display:flex;flex-direction:column;gap:6px;width:100%;max-width:220px;font-size:12px">${legend}</div>
      </div>
    </div>
  </div>`;
}

// Same DOT palette as everywhere else on the board (Frank, 2026-09-14:
// "match all the coloring and the highlight based on producer sold") --
// the picker itself is tinted to the chosen producer's colour, and every
// logged row's Producer cell gets the same pbadge every other table uses.
function prodSelStyle(name) {
  const color = DOT[name] || "";
  return color ? `background:${color};color:${badgeTextColor(color)}` : "";
}
// Every closed folio through the current one, newest first -- Frank wants
// to reach for "last folio" fast when a new one just opened (2026-09-21).
// Sales has no other way to reach a closed folio's sheet.
function salesFolioOptions() {
  const today = isoDate(azTodayDate());
  const curEnd = folioEndFor(today);
  const choices = curEnd
    ? FOLIO_CLOSE_DATES.filter(end => end <= curEnd).sort((a, b) => b.localeCompare(a))
    : [];
  const picked = salesFolioPick || curEnd;
  return choices.map(end => {
    const start = folioStartFor(end);
    const label = `${start ? fmtShortDate(start) : "start"} – ${fmtShortDate(end)}, ${end.slice(0, 4)}`;
    return `<option value="${end}"${picked === end ? " selected" : ""}>${label}${end === curEnd ? " (current)" : ""}</option>`;
  }).join("");
}
function salesPanel(data) {
  const entries = data.entries || [];
  const today = isoDate(azTodayDate());
  const curEnd = folioEndFor(today);
  const viewingEnd = data.folio_end || curEnd;
  const isCurrent = !curEnd || viewingEnd === curEnd;
  const folioOpts = salesFolioOptions();
  const producerOpts = [`<option value="">Who's logging?</option>`]
    .concat(SALES_LOGGER_ROSTER.map(p => `<option value="${p}"${p === salesProducer ? " selected" : ""}>${p}</option>`)).join("");
  const sourceOpts = [`<option value="">Lead source</option>`]
    .concat((salesLeadSourceCache || []).map(s => `<option value="${s}">${s}</option>`)).join("");
  // Client name links to the real AgencyZoom customer account when its id
  // was typed in at logging time (Frank, 2026-09-15) -- same
  // app.agencyzoom.com/customer?id=... URL panels.py's own AZ_URL uses for
  // the email, minus that file's &#61; entity escaping (this isn't going
  // into an email body, a literal = is correct here). Plain text otherwise;
  // there's no reliable way to look this id up from anything else on a
  // self-reported entry (AgencyZoom policy records carry no customerId).
  const clientCell = e => {
    const name = e.az_customer_id
      ? `<a href="https://app.agencyzoom.com/customer?id=${encodeURIComponent(e.az_customer_id)}" target="_blank" rel="noopener">${e.client_name}</a>`
      : e.client_name;
    // sales_log_auto.py marks every row it creates with source: "auto" (a
    // manually-typed entry via the Worker's own POST never has this key) --
    // flagged here, reusing the existing .ctype badge, so a blank name (a
    // sale with no confident lead match, see that file's own docstring) or
    // any other gap is obviously "needs a human to check", not a mistake.
    return e.source === "auto"
      ? `${name} <span class="ctype" title="Auto-added from AgencyZoom">auto</span>`
      : name;
  };
  const rows = entries.map(e => `<tr>
    <td class="name"><span class="who">${pbadge(DOT[e.producer] || "#8a877f", e.producer)}</span></td>
    <td>${fmtMDY(e.date_sold)}</td>
    <td>${fmtMDY(e.effective_date)}</td>
    <td>${clientCell(e)}</td>
    <td>${e.lead_source || ""}</td>
    <td>${e.policy_number || ""}</td>
    <td>${e.product || ""}</td>
    <td class="num">${e.premium != null ? money(e.premium) : ""}</td>
    <td>${e.term || ""}</td>
    <td><select data-track="docs_signed" data-id="${e.id}" data-day="${e.day}">${docsSignedOpts(e.docs_signed || "")}</select></td>
    <td><input type="checkbox" data-track="review_sent" data-id="${e.id}" data-day="${e.day}" ${e.review_sent ? "checked" : ""}></td>
    <td><button class="icon-btn del-btn" data-del="${e.id}" data-day="${e.day}" type="button" title="Delete" aria-label="Delete">${TRASH_ICON}</button></td>
  </tr>`).join("");

  return `${salesTotalsHtml(entries)}<div class="sect">
    <h2>Log a sale</h2>
    <p class="sd">Same-day list for immediate visibility -- AgencyZoom stays the official Premium Sold number.${
      isCurrent ? "" : ` Always logs against today, even while you're looking at an older folio below.`}</p>
    <div class="controls" style="flex-wrap:wrap;gap:10px;align-items:center">
      <select id="salesProdSel" style="${prodSelStyle(salesProducer)}">${producerOpts}</select>
      <label style="display:flex;align-items:center;gap:5px;font-size:12.5px">Date sold <input id="salesDateSold" type="date" value="${salesDay}"></label>
      <label style="display:flex;align-items:center;gap:5px;font-size:12.5px">Effective <input id="salesEffectiveDate" type="date"></label>
      <input id="salesClient" type="text" placeholder="Client name" style="flex:1;min-width:160px">
      <input id="salesCustomerId" type="text" placeholder="AZ customer ID (if known)" style="width:170px">
      <select id="salesLeadSource">${sourceOpts}</select>
      <input id="salesPolicy" type="text" placeholder="Policy # (if known)" style="width:150px">
      <input id="salesProduct" type="text" placeholder="Product" style="width:140px">
      <input id="salesPremium" type="number" step="0.01" placeholder="Premium" style="width:110px">
      <input id="salesTerm" type="text" placeholder="Term" style="width:90px">
      <select id="salesDocsSigned">${docsSignedOpts("")}</select>
      <label style="display:flex;align-items:center;gap:5px;font-size:12.5px"><input id="salesReviewSent" type="checkbox"> Review sent</label>
    </div>
    <div class="controls" style="margin-top:8px">
      <input id="salesNotes" type="text" placeholder="Notes (optional)" style="flex:1">
      <button class="btn" id="salesSubmit" type="button" ${salesBusy ? "disabled" : ""}>Log sale</button>
    </div>
    <h2 style="margin-top:28px">${isCurrent ? "This folio's log" : "Folio log"}</h2>
    <div class="controls" style="margin:4px 0 2px">
      ${folioOpts ? `<select id="salesFolioSel" aria-label="Folio period">${folioOpts}</select>` : ""}
    </div>

function wireSalesPanel(data) {
  const repaintAll = async () => {
    salesLastData = await loadSalesLog(salesDay, salesFolioPick);
    repaintSales();
  };
  const prodSel = $("#salesProdSel");
  if (prodSel) prodSel.onchange = () => {
    salesProducer = prodSel.value;
    prodSel.style.cssText = prodSelStyle(salesProducer);
  };
  const folioSel = $("#salesFolioSel");
  if (folioSel) folioSel.onchange = async () => {
    const today = isoDate(azTodayDate());
    const curEnd = folioEndFor(today);
    // "" means the current folio, same convention as the Digest tab's
    // folioPick -- keeps a fresh page load defaulting to "current" even
    // after the calendar rolls to a new folio.
    salesFolioPick = folioSel.value === curEnd ? "" : folioSel.value;
    await repaintAll();
  };
  const submit = $("#salesSubmit");
  if (submit) submit.onclick = async () => {
    const producer = $("#salesProdSel").value;
    const client_name = $("#salesClient").value.trim();
    if (!producer || !client_name) {
      alert("Pick who's logging and enter a client name.");
      return;
    }
    salesBusy = true;
    submit.disabled = true;
    try {
      const r = await fetch(`/api/saleslog/${salesDay}`, {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({
          producer, client_name,
          az_customer_id: $("#salesCustomerId").value.trim(),
          lead_source: $("#salesLeadSource").value,
          policy_number: $("#salesPolicy").value.trim(),
          product: $("#salesProduct").value.trim(),
          premium: $("#salesPremium").value ? Number($("#salesPremium").value) : null,
          term: $("#salesTerm").value.trim(),
          date_sold: $("#salesDateSold").value,
          effective_date: $("#salesEffectiveDate").value,
          notes: $("#salesNotes").value.trim(),
          docs_signed: $("#salesDocsSigned").value,
          review_sent: $("#salesReviewSent").checked,
        }),
      });
      if (!r.ok) alert("Couldn't save that -- try again.");
    } catch (_) { alert("Couldn't save that -- try again."); }
    salesBusy = false;
    await repaintAll();
  };
  // Docs Signed / Review Sent are editable in place on any row via /track
  // -- neither touches the sale record itself (see trackSalesLogEntry in
  // worker.js).
  $$("[data-track]").forEach(el => el.onchange = async () => {
    const field = el.dataset.track;
    const value = el.type === "checkbox" ? el.checked : el.value;
    el.disabled = true;
    try {
      const r = await fetch(`/api/saleslog/${el.dataset.day}/track`, {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ id: el.dataset.id, [field]: value }),
      });
      if (!r.ok) alert("Couldn't save that -- try again.");
    } catch (_) { alert("Couldn't save that -- try again."); }
    el.disabled = false;
  });
  // Each row's own day (see loadSalesLog), not the fixed salesDay a NEW sale
  // is logged against -- the folio log below the form can show entries from
  // any day in the folio, and a delete has to hit the R2 key that entry
  // actually lives under.
  $$("[data-del]").forEach(b => b.onclick = async () => {
    if (!confirm("Delete this logged sale?")) return;
    try {
      const r = await fetch(`/api/saleslog/${b.dataset.day}/delete`, {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ id: b.dataset.del }),
      });
      if (!r.ok) alert("Couldn't delete that -- try again.");
    } catch (_) { alert("Couldn't delete that -- try again."); }
    await repaintAll();
  });
}

// Breakdown sub-tab (Frank, 2026-09-21): the same folio's entries the Log
// tab is showing (picked via salesFolioPick there), grouped one of three
// ways and drawn as a bar chart -- same row/track shape as the Digest tab's
// own Call Outcome Breakdown (.orow/.otrack/.ogseg/.oleg) so this reads as
// the same chart language, not a new one. Bar length is total premium
// (this tool's headline number); sale count rides along as the row's own
// label, same as outcomeBreakdownHtml's dial count.
const SALES_BREAKDOWN_DIMS = {
  lead_source: { label: "Lead Source", key: e => (e.lead_source || "").trim() || "(none logged)" },
  product:     { label: "Policy Type", key: e => (e.product || "").trim() || "(none logged)" },
  // salesGroupName folds Coral/Sarahi into "The Insurance Icons" here too --
  // same Sales-only team grouping salesTotalsHtml uses.
  producer:    { label: "Producer",    key: e => salesGroupName(e.producer) || "(none logged)" },
};
// Categorical slots --s1..--s7 (validated 8-hue theme, see :root); slot 8
// is left for "Other" to stay a neutral grey rather than a hue with no real
// identity behind it (Lead Source/Policy Type are open-ended and can run
// well past 7 distinct values -- Producer never does, so it never folds).
function computeSalesBreakdown(entries, dim) {
  const keyOf = SALES_BREAKDOWN_DIMS[dim].key;
  const agg = {};
  for (const e of entries) {
    const key = keyOf(e);
    const row = agg[key] || (agg[key] = { key, premium: 0, count: 0 });
    row.premium += e.premium || 0;
    row.count++;
  }
  const rows = Object.values(agg).sort((a, b) => b.premium - a.premium);
  if (dim === "producer" || rows.length <= 7) return { rows, otherCount: 0 };
  const top = rows.slice(0, 7);
  const rest = rows.slice(7);
  top.push({ key: "Other", premium: rest.reduce((s, r) => s + r.premium, 0),
             count: rest.reduce((s, r) => s + r.count, 0), other: true });
  return { rows: top, otherCount: rest.length };
}
function salesBreakdownPanel(data) {
  const entries = data.entries || [];
  const today = isoDate(azTodayDate());
  const curEnd = folioEndFor(today);
  const viewingEnd = data.folio_end || curEnd;
  const isCurrent = !curEnd || viewingEnd === curEnd;
  const dim = salesBreakdownDim;
  const { rows, otherCount } = computeSalesBreakdown(entries, dim);
  const totalPremium = entries.reduce((s, e) => s + (e.premium || 0), 0);
  const dimOpts = Object.entries(SALES_BREAKDOWN_DIMS).map(([k, v]) =>
    `<option value="${k}"${k === dim ? " selected" : ""}>${v.label}</option>`).join("");

  if (!rows.length) {
    return `<div class="sect"><h2>Sales breakdown</h2>
     <div class="controls" style="margin-bottom:14px"><select id="salesBkDim" aria-label="Breakdown dimension">${dimOpts}</select></div>
     <div class="empty">${isCurrent ? "Nothing logged yet this folio." : "Nothing was logged in this folio."}</div></div>`;
  }

  const busiest = Math.max(...rows.map(r => r.premium), 1);
  const colorFor = (row, i) => dim === "producer" ? (DOT[row.key] || "#8a877f")
    : row.other ? "var(--text-muted)" : `var(--s${i + 1})`;
  const barRows = rows.map((row, i) => {
    const color = colorFor(row, i);
    const label = dim === "producer" ? pbadge(color, row.key)
      : `<span class="who"><span class="pd" style="background:${color}"></span>${row.key}</span>`;
    return `<div class="orow"><div class="orow-head">
      ${label}
      <span class="on">${money(row.premium)} · ${row.count} sale${row.count === 1 ? "" : "s"}</span></div>
      <div style="width:${(row.premium / busiest * 100).toFixed(2)}%"><div class="otrack">
        <span class="ogseg" style="width:100%;background:${color}" title="${row.key}: ${money(row.premium)}, ${row.count} sale${row.count === 1 ? "" : "s"}"></span>
      </div></div></div>`;
  }).join("");
  const legend = dim === "producer" ? "" : `<div class="oleg">${rows.map((row, i) =>
    `<span class="oleg-item"><span class="pd" style="background:${colorFor(row, i)}"></span>${row.key}</span>`).join("")}</div>`;

  return `<div class="sect"><h2>Sales breakdown</h2>
   <p class="sd">${money(totalPremium)} across ${entries.length} sale${entries.length === 1 ? "" : "s"} in ${isCurrent ? "the current folio" : `the folio ending ${fmtMDY(viewingEnd)}`}${
     otherCount ? `. "Other" folds in the ${otherCount} smallest ${SALES_BREAKDOWN_DIMS[dim].label.toLowerCase()} groups` : ""}.</p>
   <div class="controls" style="margin-bottom:14px">
     <select id="salesBkDim" aria-label="Breakdown dimension">${dimOpts}</select>
   </div>
   ${barRows}${legend}
  </div>`;
}

/* ---- shell / paint --------------------------------------------------------- */
function $$(s) { return Array.from(document.querySelectorAll(s)); }

// "Today" was removed 2026-09-10: it computed the date from the viewer's
// own device clock (azTodayDate()), which does not reliably line up with
// the last Arizona business day the nightly run actually built -- it read
// as broken ("No report for <date>") whenever a viewer's clock or timezone
// put "today" a day ahead of the last real reporting day. "Day" already
// covers this correctly: its dropdown lists only days DAYS actually has a
// report for, so it can't select a day that doesn't exist yet.
const RANGE_LABELS = { day: "Day",
  week: "This Week", mtd: "Month to Date", ytd: "Year to Date",
  folio: "Folio to Date", custom: "Custom range…" };

function rangeControlHtml() {
  const opts = Object.entries(RANGE_LABELS).map(([k, label]) =>
    `<option value="${k}"${k === rangeMode ? " selected" : ""}>${label}</option>`).join("");
  const today = isoDate(azTodayDate());
  let extra = "";
  if (rangeMode === "day") {
    // "Today" was removed 2026-09-10 because a bare device-clock guess could
    // read as broken ("No report for <date>") before the nightly build ran.
    // Re-added 2026-09-12 now that loadDay() falls back to intraday.py's
    // live checkpoint instead of a dead end for exactly that case -- once
    // today is finalized it shows up in DAYS on its own and this stops
    // adding a duplicate entry.
    const dayOptions = DAYS.includes(today) ? DAYS : [today, ...DAYS];
    extra = `<select id="daypick" aria-label="Reporting day">${dayOptions.map(d =>
      `<option value="${d}"${cur && d === cur.date ? " selected" : ""}>${
        d === today && !DAYS.includes(today) ? "Today (live)" :
        new Date(d + "T12:00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" })}</option>`).join("")}</select>`;
  } else if (rangeMode === "folio") {
    // Frank, 2026-09-15: "I want on the shortcuts for folio to date to
    // reveal a dropdown, like the day shortcut does, and list the current
    // and future folio periods". Past folios added 2026-09-23 ("I want to
    // see the last folio period") -- every folio from the one holding the
    // oldest report on file onward, so nothing is offered that has no data
    // at all. Still defaults to the current folio.
    const curEnd = folioEndFor(today);
    const oldest = DAYS.length ? DAYS[DAYS.length - 1] : today;
    const firstEnd = folioEndFor(oldest) || curEnd;
    const lastEnd = FOLIO_CLOSE_DATES[FOLIO_CLOSE_DATES.indexOf(curEnd) - 1];
    const choices = curEnd ? FOLIO_CLOSE_DATES.filter(end => end >= firstEnd) : [];
    extra = choices.length ? `<select id="foliopick" aria-label="Folio period">${choices.map(end => {
      const start = folioStartFor(end);
      const label = `${start ? fmtShortDate(start) : "start"} – ${fmtShortDate(end)}, ${end.slice(0, 4)}`;
      const tag = end === curEnd ? " (current)" : end === lastEnd ? " (last)" : "";
      return `<option value="${end}"${(folioPick || curEnd) === end ? " selected" : ""}>${label}${tag}</option>`;
    }).join("")}</select>` : "";
  } else if (rangeMode === "custom") {
    // Default to the most recent day that actually has a report, not
    // "today" -- today usually has no report yet (nightly run hasn't
    // happened, or it's a weekend), so defaulting both ends to today made
    // a blind "Apply" click land on an empty range that read as broken.
    const latest = DAYS[0] || today;
    const defaultFrom = DAYS[6] || DAYS[DAYS.length - 1] || latest;
    extra = `
    <input type="date" id="rfrom" value="${customFrom || defaultFrom}" max="${today}">
    <span style="color:var(--text-muted);font-size:12px">to</span>
    <input type="date" id="rto" value="${customTo || latest}" max="${today}">
    <button class="ghost" id="rapply" type="button">Apply</button>`;
  }
  return `<div class="controls"><select id="rangesel" aria-label="Digest range">${opts}</select>${extra}</div>`;
}
function wireRangeControl() {
  const sel = $("#rangesel");
  if (sel) sel.onchange = () => { rangeMode = sel.value; paint(); };
  const fp = $("#foliopick");
  if (fp) fp.onchange = () => { folioPick = fp.value; paint(); };
  const dp = $("#daypick");
  if (dp) dp.onchange = () => loadDay(dp.value);
  const ap = $("#rapply");
  if (ap) ap.onclick = () => {
    customFrom = $("#rfrom").value; customTo = $("#rto").value;
    if (customFrom && customTo) paint();
  };
}

/* Keeps `cur` in sync with rangeMode for BOTH Digest and Coaching, which now
   share one merged document for any range (see mergeDayDocs above). Called
   at the top of paint() for either tab. Returns an error message string if
   the range can't be shown (nothing selected yet, nothing on file), or null
   on success -- `cur`/curRangeLabel/curRangeSub are set as a side effect,
   same shared-state pattern rangeMode/producerFilter/coachSubTab already
   use elsewhere in this file. Leaves `cur` completely alone in "day" mode --
   that one is still owned by loadDay(). */
/* The [from, to] span the shared range control currently means, for any
   range mode but "day": {from, to, label} or {err}. Shared by the Digest
   and Coaching (ensureCurForRange) and Athena's Service Center. */
function rangeBounds() {
  const today = isoDate(azTodayDate());
  let from, to, label;
  if (rangeMode === "folio") {
    const curEnd = folioEndFor(today);
    if (!curEnd) return { err: "No folio calendar covers today yet." };
    const end = folioPick || curEnd;
    from = folioStartFor(end); to = end < today ? end : today;
    label = end === curEnd ? "Folio to Date" : "Folio";
  } else if (rangeMode === "mtd") {
    from = today.slice(0, 7) + "-01"; to = today; label = "Month to Date";
  } else if (rangeMode === "ytd") {
    from = today.slice(0, 4) + "-01-01"; to = today; label = "Year to Date";
  } else if (rangeMode === "week") {
    from = weekStart(today); to = today; label = "This Week";
  } else if (rangeMode === "custom") {
    if (!customFrom || !customTo) return { err: "Pick a start and end date, then Apply." };
    [from, to] = customFrom <= customTo ? [customFrom, customTo] : [customTo, customFrom];
    label = "Custom Range";
  }
  if (from && from > to) return { err: `That folio hasn't started yet -- it begins ${from}.` };
  return { from, to, label };
}

async function ensureCurForRange() {
  if (rangeMode === "day") { curRangeLabel = ""; curRangeSub = ""; return null; }
  const b = rangeBounds();
  if (b.err) return b.err;
  const { from, to, label } = b;
  const docs = await fetchRangeDocs(from || "", to);
  if (!docs.length) return `No reports in ${from || "the start"} → ${to}.`;
  cur = mergeDayDocs(docs); curLive = false;
  cur.label = label;
  curRangeLabel = label; curRangeSub = `${from || "the start"} → ${to}`;
  return null;
}

async function paint() {
  const v = $("#view");
  if (view === "digest") {
    if (rangeMode !== "day") v.innerHTML = rangeControlHtml() + producerControlHtml() + '<div class="empty">Loading…</div>';
    const err = await ensureCurForRange();
    const controls = rangeControlHtml() + producerControlHtml();
    $("#topsub").textContent = cur ? (cur.label || cur.date) + " · " + ((cur.calls || []).length ? (cur.calls.length + " coached calls") : "stats only") + (curLive ? " · live" : "") : (err || "");
    v.innerHTML = controls + (err ? `<div class="empty">${err}</div>`
      : rangeHeaderHtml() + (cur ? digestPanel(cur, producerFilter) : '<div class="empty">Loading…</div>'));
    wireRangeControl(); wireProducerControl();
  } else if (view === "coaching") {
    if (rangeMode !== "day") v.innerHTML = rangeControlHtml() + producerControlHtml() + '<div class="empty">Loading…</div>';
    const err = await ensureCurForRange();
    $("#topsub").textContent = cur ? (cur.label || cur.date) : (err || "");
    // Calendar filter + shortcut on every tab, editable in place (Frank,
    // 2026-09-10) -- same rangeControlHtml()/wireRangeControl() Digest
    // uses, so picking a day here updates the shared `cur` the same way
    // and Digest sees it too if you switch back.
    const controls = rangeControlHtml() + producerControlHtml();
    if (err) {
      v.innerHTML = controls + `<div class="empty">${err}</div>`;
      wireRangeControl(); wireProducerControl();
      return;
    }
    v.innerHTML = controls + rangeHeaderHtml() + (cur ? coachingPanel(cur, producerFilter) : '<div class="empty">Loading…</div>');
    wireRangeControl(); wireProducerControl();
    wireCoachSubTabs(); wireObjectionChart();
    if (cur && !ALL_CALLS_CACHE) {
      fetchAllCalls().then(() => {
        if (view !== "coaching") return;   // navigated away before this landed
        v.innerHTML = controls + rangeHeaderHtml() + coachingPanel(cur, producerFilter);
        wireRangeControl(); wireProducerControl();
        wireCoachSubTabs(); wireObjectionChart();
      });
    }
  } else if (view === "roleplay") {
    $("#topsub").textContent = "practice objection handling and closing";
    v.innerHTML = roleplayPanel();
    wireRoleplayPanel();
    if (rpProducer && !ALL_CALLS_CACHE) {
      fetchAllCalls().then(() => {
        if (view !== "roleplay") return;
        v.innerHTML = roleplayPanel();
        wireRoleplayPanel();
      });
    }
  } else if (view === "training") {
    $("#topsub").textContent = "Apollo training -- flashcards for objections, info-gathering and technique";
    v.innerHTML = '<div class="empty">Loading…</div>';
    const data = await loadTraining();
    v.innerHTML = trainingPanel(data);
    wireTrainingPanel(data);
  } else if (view === "sales") {
    $("#topsub").textContent = "log today's sales, reference any past folio's sheet, or break it down by source/type/producer -- self-reported, not the official Premium Sold figure";
    v.innerHTML = '<div class="empty">Loading…</div>';
    const [data] = await Promise.all([loadSalesLog(salesDay, salesFolioPick), loadLeadSources()]);
    salesLastData = data;
    repaintSales();
  } else if (view === "service") {
    await paintService();
  } else if (view === "commercial") {
    await paintCommercial();
  } else {
    $("#topsub").textContent = "trends across every reporting day";
    v.innerHTML = '<div class="empty">Loading…</div>';
    v.innerHTML = await trendsPanel();
  }
}

/* ---- Athena: the Service Center (Frank, 2026-09-23) -------------------------
   The service team's numbers -- Debbie (CSR), Amanda (Ops Mngr) and Crystal (hybrid).
   Athena is the service side's name, as Apollo is sales coaching's. One
   document per day (service/<day>.json, service_digest.py) holding ROWS --
   every SR completed, every renewal SR's outcome, every missed service call
   -- so any range the shared filter picks is added up here and its medians
   computed over the whole range, never averaged from daily medians. The
   agency says SR (service request), never "ticket". Credit on every figure

      <td class="t">${r.kind === "renewal" ? cesc(r.line || "—") : "Service change"}</td>
      <td class="num">${r.premium ? money(r.premium) : "—"}</td><td class="t">${cesc(r.stage)}</td>
      <td class="num">${r.created ? comDays(r.created, asOf) + "d" : "—"}</td>
      <td class="num"${late ? ' style="color:#b45309;font-weight:600"' : ""}>${r.due ? fmtMDY(r.due) : "—"}${late ? ` &middot; ${comDays(r.due, asOf)}d late` : ""}</td></tr>`;
  }).join("");
  return `<div class="sect"><h2>Open Queue</h2>
    <p class="sd">Every commercial SR open at the end of ${fmtShortDate(asOf)}: the Commercial Renewals pipeline, plus Frank's own Service Pipeline SRs for commercial households.</p>${tiles}
    <div class="scroll"><table class="comtab"><thead><tr><th>Pipeline</th><th class="t">Stage</th><th class="num">Open</th><th class="num">Past due</th><th class="num">Median age</th></tr></thead><tbody>${stageRows}</tbody></table></div>
    <h3 style="font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin:16px 0 6px">Every open SR, soonest due first</h3>
    <div class="scroll" style="max-height:520px;overflow-y:auto"><table class="comtab"><thead><tr><th>Account</th><th class="t">Line</th><th class="num">Premium</th><th class="t">Stage</th><th class="num">Age</th><th class="num">Due</th></tr></thead><tbody>${list}</tbody></table></div></div>`;
}
function comOutcomesHtml(m) {
  const rows = m.completed.filter(r => r.kind === "renewal");
  if (!rows.length) return `<div class="sect"><h2>Renewal Outcomes</h2><p class="sd">No commercial renewal SRs were completed in this period.</p></div>`;
  const kind = Object.fromEntries(m.outcomes.map(([k, , c]) => [k, c]));
  const segs = m.outcomes.map(([k, l]) => { const c = rows.filter(r => r.outcome === k).length;
    return c ? `<span class="ogseg rseg" style="width:${(c / rows.length * 100).toFixed(2)}%;${outcomeFill(k)}" title="${l}: ${c}"></span>` : ""; }).join("");
  const rt = renewalRate(rows, kind);
  const legend = m.outcomes.map(([k, l]) => [k, l, rows.filter(r => r.outcome === k)]).filter(x => x[2].length).map(([k, l, rs]) =>
    `<span class="oleg-item"><span class="pd rdot" style="${outcomeFill(k)}"></span>${l} <b>${rs.length}</b> <span style="color:var(--text-muted)">(${money(rs.reduce((a, r) => a + (r.premium || 0), 0))})</span></span>`).join("");
  const unnamed = Object.entries(m.unnamed || {});
  return `<div class="sect"><h2>Renewal Outcomes</h2>
    <p class="sd">Commercial renewal SRs completed in this period and how each ended, with the same renewal resolutions as the service team (then the rep's note, dotted, then the policy record, hatched): retained = renewed (No action and Unable to Contact included, which renewed as is) or rewrite accepted, over everything with a decided outcome. Not a book-wide retention rate.</p>
    <div class="orow"><div class="orow-head"><span class="who">${pbadge(TEAM_DOT, "Commercial")}</span>
      <span class="on">${rows.length} renewal SR${rows.length === 1 ? "" : "s"}${rt.pct == null ? "" : ` &middot; <b>${rt.pct}%</b> retained (${rt.kept} of ${rt.kept + rt.lost})`}</span></div>
      <div class="otrack">${segs}</div></div>
    <div class="oleg">${legend}</div>
    ${unnamed.length ? `<p class="sd" style="margin:6px 0 0;color:#b45309">Closed on a resolution that is not a renewal resolution: ${unnamed.map(([k, n]) => `${cesc(k)} (${n})`).join(", ")}.</p>` : ""}</div>`;
}
function comCompletedHtml(m) {
  const rs = m.completed;
  if (!rs.length) return `<div class="sect"><h2>Completed</h2><p class="sd">No commercial SRs were completed in this period.</p></div>`;
  const tr = ["renewal", "service"].map(k => [k, rs.filter(r => r.kind === k)]).filter(x => x[1].length).map(([k, xs]) => { const hs = xs.map(r => r.hours);
    return `<tr><td>${COM_KIND[k]}</td><td class="num">${xs.length}</td><td class="num">${fmtDur(svcMedian(hs))}</td><td class="num">${fmtDur(svcPctile(hs, 0.9))}</td></tr>`; }).join("");
  const label = Object.fromEntries(m.outcomes.map(([k, l]) => [k, l]));
  const list = rs.slice().sort((a, b) => a.completed < b.completed ? 1 : -1).map(r =>
    `<tr><td>${fmtMDY(r.completed)}</td><td class="t">${cesc(r.name)}<div style="font-size:11.5px;color:var(--text-muted)">${cesc(r.subject)}</div></td>
      <td class="t">${r.kind === "renewal" ? cesc(label[r.outcome] || r.outcome) : "Service change"}</td><td class="num">${fmtDur(r.hours)}</td><td class="t">${cesc((r.by_name || "—").split(" ")[0])}</td></tr>`).join("");
  return `<div class="sect"><h2>Completed</h2>
    <p class="sd">Commercial SRs completed in this period, from the day each was created to the day it was completed.</p>
    <div class="scroll"><table><thead><tr><th>Pipeline</th><th class="num">Completed</th><th class="num">Median</th><th class="num">90% within</th></tr></thead>
    <tbody>${tr}</tbody></table></div>
    <div class="scroll" style="margin-top:12px"><table class="comtab"><thead><tr><th>Completed</th><th class="t">Account</th><th class="t">Outcome</th><th class="num">Took</th><th class="t">By</th></tr></thead><tbody>${list}</tbody></table></div></div>`;
}
async function paintCommercial() {
  const v = $("#view");
  const controls = rangeControlHtml();
  v.innerHTML = controls + '<div class="empty">Loading…</div>';
  wireRangeControl();
  const all = COMMERCIAL_DAYS || [];
  let wanted, label;
  if (rangeMode === "day") {
    const day = (cur && cur.date) || all[0];
    wanted = day ? [day] : [];
    label = day ? new Date(day + "T12:00:00").toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" }) : "";
  } else {
    const b = rangeBounds();
    if (b.err) { v.innerHTML = controls + `<div class="empty">${b.err}</div>`; wireRangeControl(); return; }
    wanted = all.filter(d => d >= (b.from || "") && d <= b.to);
    label = `${b.label} · ${b.from || "the start"} → ${b.to}`;
  }
  const docs = await fetchCommercialDocs(wanted);
  $("#topsub").textContent = "Cerberus · commercial" + (label ? " · " + label : "");
  if (!docs.length) {
    v.innerHTML = controls + `<div class="empty">No Cerberus report for ${rangeMode === "day" ? "this day" : "this range"} yet.</div>`;
  } else {
    const m = mergeCommercialDocs(docs);
    v.innerHTML = controls + comQueueHtml(m) + comOutcomesHtml(m) + comCompletedHtml(m);
  }
  wireRangeControl();
}

async function loadDay(day) {
  rangeMode = "day";
  $("#view").innerHTML = '<div class="empty">Loading…</div>';
  cur = null; curLive = false;
  try {
    const r = await fetch(`/api/days/${day}`, { cache: "no-store" });
    if (r.ok) cur = await r.json();
  } catch (_) {}
  if (!cur) {
    // No finalized report for this day yet -- almost always because it's
    // still in progress (today, before tonight's build). Falls back to
    // intraday.py's latest checkpoint instead of a dead end: it runs the
    // exact same board_payload.build() as the nightly build, stopped short
    // of the two paid AI reads (call_summary, coaching cards) -- so the
    // WHOLE report (leaderboard, task completion, outcomes, speed to dial,
    // recontact, audit) renders from it unchanged, just with less of the
    // day counted yet. The Coaching tab already has its own "stats only"
    // fallback for exactly this shape (no `calls` array).
    try {
      const ir = await fetch(`/api/intraday/${day}`, { cache: "no-store" });
      if (ir.ok) { cur = await ir.json(); curLive = true; }
    } catch (_) {}
  }
  if (!cur) { $("#view").innerHTML = '<div class="empty">No report for this day yet.</div>'; $("#topsub").textContent = day; return; }
  await paint();
}

async function goView(next) {
  if (next === view) return;
  if (view === "roleplay" && next !== "roleplay") {
    rpStopListening();
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    if (rpHistory.length && !rpGrade) await rpSubmitGrade();   // leaving the tab shouldn't leave a session ungraded
  }
  view = next;
  const c = centerOf(view);
  if (CENTERS[c]) centerPick[c] = view;
  $$(".tab").forEach(x => x.setAttribute("aria-selected", String(x.dataset.v === c)));
  paintCenterBar();
  paint();
}
$$(".tab").forEach(t => t.onclick = () => {
  const c = t.dataset.v;
  goView(CENTERS[c] ? centerPick[c] : c);
});
paintCenterBar();

(async function init() {
  let days = [];
  let fetchError = null;
  try {
    const r = await fetch("/api/days", { cache: "no-store" });
    if ((r.headers.get("content-type") || "").includes("application/json")) {
      const body = await r.json();
      if (r.ok) { days = body.days || []; }
      else { fetchError = body.error || `request failed (${r.status})`; }
    } else {
      fetchError = "not signed in to Cloudflare Access";
    }
  } catch (_) {
    fetchError = "could not reach the board API";
  }
  if (fetchError) {
    $("#topsub").textContent = "";
    $("#view").innerHTML = `<div class="empty">Could not load reports: ${fetchError}.</div>`;
    return;
  }
  if (!days.length) {
    $("#topsub").textContent = "no reporting days yet";
    $("#view").innerHTML = '<div class="empty">No reports yet.</div>';
    return;
  }
  DAYS = days;
  initCommercial();   // unhides the Commercial Center for Frank only
  await loadDay(days[0]);
})();
</script>
