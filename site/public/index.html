<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Floor — Flores Insurance Agency</title>
<style>
/* ---------------------------------------------------------------------------
   Palette. Categorical slots 1-5 in fixed order, validated in both modes:
   light  worst adjacent CVD dE 9.1, normal-vision 19.6
   dark   worst adjacent CVD dE 8.4, normal-vision 19.3
   Light mode puts aqua/yellow/magenta under 3:1 on the surface, so every
   stacked segment carries a visible count label and a legend -- that is the
   required relief, not decoration. Do not drop the labels.
   Colour follows the OUTCOME, never its rank or size, so a quiet day does not
   repaint the chart.
--------------------------------------------------------------------------- */
:root {
  color-scheme: light;
  --surface:        #fcfcfb;
  --surface-raised: #ffffff;
  --border:         #e5e4e0;
  --border-strong:  #d2d1cc;
  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --text-muted:     #78776f;
  --grid:           #ecebe7;
  --s1: #2a78d6;  /* Live Contact       */
  --s2: #eb6834;  /* Voicemail          */
  --s3: #1baf7a;  /* Screener           */
  --s4: #eda100;  /* No Answer          */
  --s5: #e87ba4;  /* No Outcome Logged  */
  --bar:           #2a78d6;
  --bar-track:     #ecebe7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface:        #1a1a19;
    --surface-raised: #222221;
    --border:         #35352f;
    --border-strong:  #45453e;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #8e8d84;
    --grid:           #2b2b27;
    --s1: #3987e5;
    --s2: #d95926;
    --s3: #199e70;
    --s4: #c98500;
    --s5: #d55181;
    --bar:            #3987e5;
    --bar-track:      #2b2b27;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface:        #1a1a19;
  --surface-raised: #222221;
  --border:         #35352f;
  --border-strong:  #45453e;
  --text-primary:   #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted:     #8e8d84;
  --grid:           #2b2b27;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --s4: #c98500;
  --s5: #d55181;
  --bar:            #3987e5;
  --bar-track:      #2b2b27;
}
/* Digest-email palette, verbatim (render_report.DOT / .tier-text-*). These
   are the actual colours the sent email uses -- not chosen here -- so a
   producer or a tier reads the same colour on the board as in their inbox.
   Deliberately NOT theme-varied: matching the digest is the point. */
.tg { color: #0ca30c; font-weight: 600; }
.ty { color: #eda100; font-weight: 600; }
.tr { color: #e60000; font-weight: 600; }
.n1 { color: #9a6f00; font-weight: 700; }
.n2 { color: #6f6f6f; }
.n3 { color: #9a5f2b; }
.mdl { font-size: 14px; line-height: 1; margin-left: 5px; }

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--surface);
  color: var(--text-primary);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ---- top bar + shell ------------------------------------------------------ */
.top {
  background: var(--text-primary); color: var(--surface);
  padding: 14px 22px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
}
.top h1 { font-size: 17px; margin: 0; color: inherit; font-weight: 600; }
.top .sub { font-size: 12px; color: var(--text-muted); }
.thbtn {
  margin-left: auto; align-self: center; display: inline-flex; align-items: center; gap: 6px;
  background: transparent; color: inherit; border: 1px solid var(--border-strong); border-radius: 7px;
  padding: 5px 10px; font: 500 12px/1 inherit; cursor: pointer;
}
.shell { min-height: calc(100vh - 49px); }
.pd { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.main { padding: 20px 24px 60px; min-width: 0; max-width: 1120px; margin: 0 auto; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.tab {
  background: none; border: none; border-bottom: 2px solid transparent; padding: 8px 13px;
  font: inherit; font-weight: 600; font-size: 13px; color: var(--text-muted); cursor: pointer;
}
.tab[aria-selected="true"] { color: var(--text-primary); border-bottom-color: var(--text-primary); }
.tab:hover { color: var(--text-primary); }

.controls { display: flex; gap: 8px; align-items: center; margin-bottom: 18px; }
select, button.ghost {
  font: inherit; font-size: 13px;
  color: var(--text-primary); background: var(--surface-raised);
  border: 1px solid var(--border-strong); border-radius: 6px;
  padding: 6px 10px; cursor: pointer;
}

h2 {
  font-size: 12px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.07em; color: var(--text-muted);
  margin: 36px 0 14px;
}
h2:first-of-type { margin-top: 8px; }
.sd { font-size: 12.5px; color: var(--text-secondary); margin: -10px 0 14px; line-height: 1.55; }

/* Stat tiles. */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 10px; }
.tile {
  background: var(--surface-raised); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 16px;
}
.tile .k { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
.tile .v { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; margin-top: 4px; font-variant-numeric: tabular-nums; }
.tile .n { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 9px 10px; border-bottom: 1px solid var(--grid); font-size: 12.5px; }
th:first-child, td:first-child { text-align: left; }
th {
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.05em; color: var(--text-muted);
  border-bottom: 1px solid var(--border-strong);
}
td.name { font-weight: 500; }
tr.tot td { font-weight: 700; background: var(--surface); }
tbody tr:hover { background: color-mix(in oklab, var(--bar) 7%, transparent); }
.scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
.scroll table { min-width: 640px; }
.who { display: flex; align-items: center; gap: 7px; font-weight: 600; }

.bars { display: grid; gap: 7px; }
.row { display: grid; grid-template-columns: 132px 1fr 76px; gap: 12px; align-items: center; }
.row .lbl { font-size: 13px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track { background: var(--bar-track); border-radius: 4px; height: 20px; position: relative; }
.fill { background: var(--bar); border-radius: 0 4px 4px 0; height: 100%; min-width: 2px; transition: width .18s ease; }
.row .val { font-size: 13px; font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; }

.stack { display: flex; height: 26px; border-radius: 4px; overflow: hidden; gap: 2px; background: var(--bar-track); }
.seg2 { position: relative; display: flex; align-items: center; justify-content: center; min-width: 3px; }
.seg2 span { font-size: 11px; font-weight: 600; color: #fff; text-shadow: 0 0 3px rgba(0,0,0,.45); font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-bottom: 12px; }
.legend .item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
.swatch { width: 11px; height: 11px; border-radius: 3px; flex: none; }

.note { color: var(--text-muted); font-size: 12px; margin-top: 10px; }
.empty { color: var(--text-muted); padding: 28px 0; text-align: center; }
.hero { background: var(--surface-raised); border: 1px solid var(--border-strong); border-radius: 9px; padding: 16px 18px; margin-bottom: 16px; }
.hero .hl { font-weight: 700; font-size: 15px; margin-bottom: 6px; }
.hero p { margin: 0 0 9px; font-size: 12.5px; line-height: 1.6; color: var(--text-secondary); }
.hero p:last-child { margin-bottom: 0; }
.q { font-style: italic; }

/* Trend line. */
.trend { width: 100%; height: 200px; display: block; }
.trend .grid { stroke: var(--grid); stroke-width: 1; }
.trend .axis { fill: var(--text-muted); font-size: 11px; }
.trend .ln { fill: none; stroke: var(--bar); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.trend .dot { fill: var(--bar); stroke: var(--surface); stroke-width: 2; }
.trend .hit { fill: transparent; cursor: crosshair; }
.spark { display: flex; align-items: flex-end; gap: 3px; height: 34px; }
.spark i { display: block; width: 9px; background: var(--bar); border-radius: 1px 1px 0 0; min-height: 2px; }

#tip {
  position: fixed; pointer-events: none; opacity: 0; transition: opacity .1s;
  background: var(--surface-raised); color: var(--text-primary);
  border: 1px solid var(--border-strong); border-radius: 7px;
  padding: 7px 10px; font-size: 12px; line-height: 1.45;
  box-shadow: 0 6px 20px rgba(0,0,0,.16); z-index: 50; max-width: 260px;
}
#tip b { font-weight: 600; }

/* ---- coaching cards -------------------------------------------------------
   Ported from the pre-migration board (a claude.ai Artifact). This is
   authored content -- never generated -- so the markup mirrors the artifact's
   structure closely rather than being redesigned. */
.cpick { display: flex; align-items: center; gap: 9px; margin: 0 0 18px; }
.cpick label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted); }
.ccard { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 9px; padding: 12px; margin-bottom: 13px; }
.blk { background: var(--surface-raised); border: 1px solid var(--border); border-radius: 7px; padding: 13px 15px; margin-bottom: 9px; }
.blk:last-child { margin-bottom: 0; }
.bl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--text-muted); margin-bottom: 9px; }
.chead { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.cname { font-weight: 700; font-size: 15px; }
.cmeta { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
.sum { font-size: 12.5px; line-height: 1.55; margin-top: 9px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 640px) { .two { grid-template-columns: 1fr; } }
.ol { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted); margin-bottom: 3px; }
.said { font-size: 12px; line-height: 1.6; }
.en { color: var(--text-muted); font-size: 10.5px; }
.anal { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; font-size: 12px; line-height: 1.6; margin-top: 12px; }
.fix { background: color-mix(in oklab, var(--bar) 10%, var(--surface)); border-left: 3px solid var(--bar); border-radius: 0 5px 5px 0; padding: 10px 12px; font-size: 12px; line-height: 1.65; margin-top: 9px; }
.fixl { display: block; font-size: 9px; text-transform: uppercase; letter-spacing: 0.07em; opacity: .75; font-weight: 600; margin-bottom: 4px; }
.gl { list-style: none; margin: 0; padding: 0; }
.gl li { font-size: 12px; line-height: 1.55; margin-bottom: 8px; padding-left: 14px; position: relative; }
.gl li b { display: block; }
.gl li:before { content: ""; position: absolute; left: 0; top: 6px; width: 5px; height: 5px; border-radius: 50%; }
.gl.g li:before { background: var(--s1); }
.gl.b li:before { background: var(--s4); }
.colh { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 600; padding-bottom: 6px; margin-bottom: 9px; border-bottom: 2px solid var(--border-strong); }
.colh.g { color: #0ca30c; } .colh.b { color: #e60000; }
details.sc { margin-top: 11px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); }
details.sc > summary { cursor: pointer; list-style: none; padding: 9px 12px; font-size: 10.5px; font-weight: 600; color: var(--text-secondary); display: flex; justify-content: space-between; gap: 10px; align-items: center; }
details.sc > summary::-webkit-details-marker { display: none; }
details.sc .scb { padding: 0 12px 12px; }
.pips { display: flex; gap: 2px; }
.pip { width: 8px; height: 8px; border-radius: 2px; }
.askt { width: 100%; }
.askt td { border-bottom: 1px solid var(--border); padding: 6px 0; font-size: 12px; vertical-align: top; text-align: left; }
.askt tr:last-child td { border-bottom: none; }
.askt .k { width: 132px; font-weight: 600; }
.askt .v { width: 52px; }
.tl { display: grid; grid-template-columns: 52px 14px 1fr; row-gap: 0; }
.tlt { font-size: 10.5px; color: var(--text-muted); padding-top: 7px; }
.tlk { position: relative; display: flex; justify-content: center; }
.tlk .ln { width: 1px; background: var(--border-strong); flex: none; margin-top: 14px; }
.tlk .dt { width: 9px; height: 9px; border-radius: 50%; position: absolute; top: 6px; }
.tlx { padding: 5px 0 11px 4px; font-size: 12px; line-height: 1.5; }
.tlx b { display: block; }
.tlx span { color: var(--text-secondary); }
.cat { display: inline-block; font-size: 9.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; padding: 2px 8px; border-radius: 10px; white-space: nowrap; color: #16150f; }
.cat-q { background: #9fc2ed; } .cat-sold { background: #008300; color: #fff; } .cat-live { background: #eda100; }
.cat-dead { background: #f0e800; }
.cat-fsd { background: var(--surface-raised); color: #0ca30c; border: 1px solid #0ca30c; }
.flag { display: inline-block; font-size: 10px; font-weight: 500; padding: 1px 6px; border-radius: 3px; background: color-mix(in oklab, #eda100 18%, var(--surface)); color: #8a6100; margin: 0 4px 3px 0; }
.chip { display: inline-block; font-size: 9.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; padding: 2px 7px; border-radius: 3px; white-space: nowrap; }
.c-g { background: color-mix(in oklab, #0ca30c 18%, var(--surface)); color: #0a6b0a; border: 1px solid #b7e2b7; }
.c-w { background: color-mix(in oklab, #eda100 18%, var(--surface)); color: #8a6100; border: 1px solid #e0c184; }
.c-r { background: color-mix(in oklab, #e60000 15%, var(--surface)); color: #a80000; border: 1px solid #f0b4b4; }
.c-n { background: var(--surface); color: var(--text-muted); border: 1px solid var(--border-strong); }
</style>
</head>
<body>
<div class="top">
  <h1>Sales Floor</h1>
  <span class="sub" id="topsub">loading…</span>
  <button class="thbtn" id="thbtn" type="button"><span id="thico">◑</span><span id="thlbl">System</span></button>
</div>
<div class="shell">
  <main class="main">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true"  data-v="digest">Digest</button>
      <button class="tab" role="tab" aria-selected="false" data-v="coaching">Coaching</button>
      <button class="tab" role="tab" aria-selected="false" data-v="trends">Trends</button>
    </div>
    <div id="view"><div class="empty">Loading…</div></div>
  </main>
</div>
<div id="tip" role="tooltip"></div>

<script>
/* The digest email's own producer colours (render_report.DOT), so a producer
   is the same colour on the board as in their inbox. Not chosen here. */
const DOT = {"Crystal Mango":"#ff4b4b", "Lorena Gonzalez":"#cd81ff",
             "Mike Olvera":"#5656fe",   "Debbie Aguilera":"#0b0b0b",
             "Coral Barwick":"#00ffcf",  "Sarahi Chin":"#ffb48c",
             "Amanda Torricellas":"#baffff"};
const TEAM_DOT = "#0b0b0b";

/* Folio close dates, 2026 (Frank's "Folio Close Dates" calendar). A folio's
   last day is the highlighted date; the next calendar day starts the next
   folio -- mirrors digest_config.FOLIO_CLOSE_DATES. Extend this array when
   next year's calendar arrives; a day past the last entry has no folio yet. */
const FOLIO_CLOSE_DATES = [
  "2026-01-20", "2026-02-18", "2026-03-18", "2026-04-17",
  "2026-05-19", "2026-06-18", "2026-07-17", "2026-08-19",
  "2026-09-18", "2026-10-19", "2026-11-17", "2026-12-17",
];
function folioEndFor(dateStr) {
  return FOLIO_CLOSE_DATES.find(end => dateStr <= end) || null;
}

const $ = (s, r) => (r || document).querySelector(s);
const el = (t, cls, txt) => { const e = document.createElement(t); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const money = n => "$" + Math.round(n || 0).toLocaleString();
const secs = n => { n = Math.round(n || 0); const m = Math.floor(n / 60); return m ? `${m}m ${String(n % 60).padStart(2, "0")}s` : `${n}s`; };
const hhmm = secs;

let DAYS = [];       // date strings from /api/days, newest first
let cur = null;      // the currently loaded day's full document
let view = "digest";
// One producer filter shared by the Digest and Coaching tabs. "" = whole
// agency. This is the roster CLAUDE.md treats as producers (not Debbie or
// Amanda, who show up in DOT/coaching data but are not tracked as such).
const PRODUCER_ROSTER = ["Crystal Mango", "Lorena Gonzalez", "Mike Olvera", "Coral Barwick", "Sarahi Chin"];
let producerFilter = "";
// Digest-tab range selector. "day" shows a picked day's full digest; every
// other value renders an aggregate via digestRange().
let rangeMode = "day";  // day | today | yesterday | week | mtd | ytd | folio | custom
let customFrom = "", customTo = "";

/* ---- tooltip -------------------------------------------------------------- */
const tip = $("#tip");
function hoverable(node, html) {
  node.addEventListener("mousemove", e => {
    tip.innerHTML = html;
    tip.style.opacity = 1;
    const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
    let x = e.clientX + pad, y = e.clientY + pad;
    if (x + w > innerWidth - 8) x = e.clientX - w - pad;
    if (y + h > innerHeight - 8) y = e.clientY - h - pad;
    tip.style.left = x + "px"; tip.style.top = y + "px";
  });
  node.addEventListener("mouseleave", () => { tip.style.opacity = 0; });
}

/* ---- theme: system -> light -> dark, remembered per browser --------------- */
(function () {
  const K = "board-theme", R = document.documentElement, b = $("#thbtn"),
        ico = $("#thico"), lbl = $("#thlbl");
  const M = ["system", "light", "dark"],
        T = { system: ["◑", "System"], light: ["☀", "Light"], dark: ["☾", "Dark"] };
  const read = () => { try { const v = localStorage.getItem(K); return M.includes(v) ? v : "system"; } catch (_) { return "system"; } };
  const apply = (m, save) => {
    if (m === "system") { delete R.dataset.theme; R.style.colorScheme = ""; }
    else { R.dataset.theme = m; R.style.colorScheme = m; }
    ico.textContent = T[m][0]; lbl.textContent = T[m][1];
    if (save) try { localStorage.setItem(K, m); } catch (_) {}
  };
  let cur = read(); apply(cur, false);
  b.addEventListener("click", () => { cur = M[(M.indexOf(cur) + 1) % M.length]; apply(cur, true); });
})();

/* ---- Digest tab ------------------------------------------------------------
   Ranked like the leaderboard, medals on the top three. Each stat is coloured
   by the day document's own `tiers` (computed server-side from
   digest_config, so the boundary rules live in one place), and Policies
   falls back to the day's premium-sold streak when today's figure is $0, so
   the two never disagree. */
function digestDay(d, who) {
  const byName = Object.fromEntries((d.producers || []).map(p => [p.name, p]));
  const focus = who ? byName[who] : null;
  // Whole-agency tiles read from d.totals; a single producer's tiles read
  // from their own row instead, since "the team's numbers" is not what
  // filtering to one person means.
  const t = focus || d.totals || {};
  const rate = focus ? (focus.rate ?? 0) : (t.dials ? (100 * t.live / t.dials).toFixed(1) : "0");
  const tiles = [
    ["Dials", t.dials ?? 0, "outbound, after exclusions"],
    ["Live contacts", t.live ?? 0, rate + "% contact rate"],
    ["Households quoted", t.hh ?? 0, ""],
    ["Premium quoted", money(t.pq), ""],
    ["Policies", t.pol ?? 0, ""],
    ["Premium sold", money(t.ps), ""],
  ];
  if (t.util != null) tiles.push(["Utilization", t.util + "%", "weighted"]);
  const tilesHtml = tiles.map(([k, v, n]) =>
    `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div>${n ? `<div class="n">${n}</div>` : ""}</div>`).join("");

  const TI = { green: "tg", yellow: "ty", red: "tr" };
  const tc = (name, key) => TI[((d.tiers || {})[name] || {})[key]] || "";
  const MEDAL = ["\u{1F3C6}", "\u{1F948}", "\u{1F949}"];
  const NCL = ["n1", "n2", "n3"];
  const streak = d.policy_streak || {};
  const polTitle = n => {
    const g = streak[n];
    return g === 0 ? "sold today" : g == null ? "no sale on record"
         : g + " business day" + (g === 1 ? "" : "s") + " without a sale";
  };
  const ranked = focus ? [focus] : ((d.leaderboard && d.leaderboard.order) || (d.producers || []).map(p => p.name))
                   .map(n => byName[n]).filter(Boolean);
  const hasRoleplay = ranked.some(p => (p.coach || {}).roleplay != null);
  const rows = ranked.map((p, i) => `<tr>
    <td><span class="who"><span class="pd" style="background:${DOT[p.name] || "#8a877f"}"></span><span${
       !focus && i < 3 ? ` class="${NCL[i]}"` : ""}>${p.name}</span>${
       !focus && i < 3 ? `<span class="mdl" role="img" aria-label="${["1st", "2nd", "3rd"][i]}">${MEDAL[i]}</span>` : ""}</span></td>
    ${hasRoleplay ? `<td class="num">${(p.coach || {}).roleplay ?? "—"}</td>` : ""}
    <td class="num ${tc(p.name, "dials")}">${p.dials ?? 0}</td>
    <td class="num ${tc(p.name, "talk")}">${hhmm(p.talk)}</td>

/* ---- Range aggregates (This Week / MTD / YTD / Folio / Custom) ------------
   One generic aggregator + renderer feeds every non-single-day preset.
   `docs` is either a list of full day documents (from /api/days/:day) or a
   list of already-aggregated rollup documents (month/folio) -- both shapes
   carry `totals` and `producers`, so the same merge works for either,
   reconstructing each producer's weighted talk time from `talk * live`
   (a rollup's `talk` is already an average, not raw seconds, same trick
   publish_board.publish_month/_folio use server-side). */
function aggregateDocs(docs) {
  const NUM = ["dials", "live", "hh", "pq", "ps", "pol"];
  const totals = Object.fromEntries(NUM.map(k => [k, 0]));
  const per = {};
  const days = new Set();
  for (const doc of docs) {
    const t = doc.totals || {};
    for (const k of NUM) totals[k] += t[k] || 0;
    if (doc.date) days.add(doc.date);
    for (const d of doc.days || []) days.add(d);
    for (const p of doc.producers || []) {
      const row = per[p.name] || (per[p.name] = { name: p.name, days: 0, talk_secs: 0, ...Object.fromEntries(NUM.map(k => [k, 0])) });
      for (const k of NUM) row[k] += p[k] || 0;
      row.days += p.days || 1;
      row.talk_secs += (p.talk || 0) * (p.live || 0);
    }
  }
  for (const row of Object.values(per)) {
    row.rate = row.dials ? Math.round(1000 * row.live / row.dials) / 10 : 0;
    row.talk = row.live ? Math.round(row.talk_secs / row.live) : 0;
    delete row.talk_secs;
  }
  totals.rate = totals.dials ? Math.round(1000 * totals.live / totals.dials) / 10 : 0;
  return { totals, producers: Object.values(per).sort((a, b) => b.ps - a.ps),
           business_days: days.size, days: [...days].sort() };
}
function digestRange(agg, label, sub, who) {
  const byName = Object.fromEntries((agg.producers || []).map(p => [p.name, p]));
  const focus = who ? byName[who] : null;
  const T = focus || agg.totals || {};
  const tiles = [
    ["Dials", (T.dials ?? 0).toLocaleString(), ""],
    ["Live Contacts", (T.live ?? 0).toLocaleString(), `${T.rate ?? 0}% contact rate`],
    ["Households Quoted", T.hh ?? 0, ""],
    ["Premium Quoted", money(T.pq), ""],
    ["Premium Sold", money(T.ps), `${T.pol ?? 0} policies`],
    ["Business Days", (focus ? focus.days : agg.business_days) ?? 0, ""],
  ].map(([k, v, n]) => `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div>${n ? `<div class="n">${n}</div>` : ""}</div>`).join("");

  const P = focus ? [] : (agg.producers || []);
  const rows = P.map(r => `<tr><td class="name">${r.name}</td><td class="num">${r.days ?? 0}</td>
    <td class="num">${r.dials ?? 0}</td><td class="num">${r.live ?? 0}</td><td class="num">${r.rate ?? 0}%</td>
    <td class="num">${secs(r.talk)}</td><td class="num">${r.hh ?? 0}</td>
    <td class="num">${money(r.pq)}</td><td class="num">${money(r.ps)}</td></tr>`).join("");

  return `<div class="sect"><h2>${label}${focus ? ` · ${who}` : ""}</h2>${sub ? `<p class="sd">${sub}</p>` : ""}<div class="tiles">${tiles}</div></div>
  ${P.length ? `<div class="sect"><h2>Producers</h2>
    <div class="scroll"><table><thead><tr><th>Producer</th><th class="num">Days</th><th class="num">Dials</th>
    <th class="num">Live</th><th class="num">Rate</th><th class="num">Avg Talk</th><th class="num">HH</th>
    <th class="num">Quoted</th><th class="num">Sold</th></tr></thead><tbody>${rows}</tbody></table></div></div>` : ""}`;
}

/* ---- date helpers: Arizona is always UTC-7, never DST --------------------- */
function azTodayDate() {
  const now = new Date();
  return new Date(now.getTime() + (now.getTimezoneOffset() * 60000) - 7 * 3600000);
}
function isoDate(d) { return d.toISOString().slice(0, 10); }
function addDays(iso, n) { const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return isoDate(d); }
function weekStart(iso) { const d = new Date(iso + "T12:00:00Z"); return addDays(iso, -d.getUTCDay()); }

/* Fetch every day in [from, to] that actually has a report (checked against
   DAYS, the /api/days list), then aggregate. Used for This Week and Custom
   range -- there is no precomputed rollup for an arbitrary span. */
async function fetchRangeDocs(from, to) {
  const wanted = DAYS.filter(d => d >= from && d <= to);
  const docs = [];
  for (const d of wanted) {
    try {
      const r = await fetch(`/api/days/${d}`, { cache: "no-store" });
      if (r.ok) docs.push(await r.json());
    } catch (_) {}
  }
  return docs;
}

  const m = { "Addressed, overcome": ["c-g", "Overcome"], "Addressed, not overcome": ["c-r", "Not overcome"],

const DIMS = ["Opening & identification", "Discovery", "Current premium captured", "Renewal / X-date captured",
  "Product knowledge", "Presenting numbers", "Bundle / cross-sell raised", "Next step specificity", "CRM after the call"];
const RT = { s: ["c-g", "Strong"], w: ["c-w", "Weak"], m: ["c-r", "Missing"] };
function scorecard(sc) {
  if (!sc || !Object.keys(sc).length) return "";
  let n = { s: 0, w: 0, m: 0, x: 0 }, rows = "";
  DIMS.forEach(d => {
    const e = sc[d]; if (!e || e[0] === "n") { n.x++; return; }

    rows += `<tr><td style="width:172px;font-weight:600">${d}</td>
      <td style="width:78px"><span class="chip ${r[0]}">${r[1]}</span></td>
      <td style="color:var(--text-secondary)">${e[1] || ""}</td></tr>`;
  });
  const head = [n.s && n.s + " strong", n.w && n.w + " weak", n.m && n.m + " missing", n.x && n.x + " not scored"].filter(Boolean).join(" · ");
  const dotc = { s: "#0ca30c", w: "#eda100", m: "#e60000", x: "var(--border-strong)" };
  const pips = ["s", "w", "m", "x"].flatMap(k => Array(n[k]).fill(`<span class="pip" style="background:${dotc[k]}"></span>`)).join("");
  return `<details class="sc"><summary><span>Scorecard — ${head}</span><span class="pips">${pips}</span></summary>

function coachingPanel(d, who) {

  const order = ["Lorena Gonzalez", "Crystal Mango", "Mike Olvera", "Coral Barwick", "Sarahi Chin"];
  if (!(d.calls && d.calls.length)) return `<div class="empty">
    <div style="font-weight:600;font-size:15px;margin-bottom:6px">No coaching cards for this day</div>
    <p style="max-width:46ch;margin:0 auto;font-size:12.5px;line-height:1.6">${d.label || d.date} was uploaded with its stats
    only. The cards are written from the call recordings and are not generated, so a day gets them when someone
    writes them — an empty tab here means nobody has yet, not that the calls were clean.</p></div>`;
  const sel = who && order.includes(who) ? who : "";
  let out = "";
  let shown = 0;
  order.forEach(p => {

  if (!shown) {
    out = `<div class="empty">${sel ? `No coaching cards for ${sel} on this day.` : "No coaching cards for this day."}</div>`;

  return out + (d.notcoached ? `<div class="note" style="border:1px dashed var(--border-strong);border-radius:8px;padding:14px 16px">
    <b>Not coached, and why.</b> ${d.notcoached}</div>` : "");

/* ---- Trends tab ------------------------------------------------------------
   Built from the month rollups' own `trend` arrays (already computed nightly
   by publish_board.publish_month) rather than fetching every day's full
   document -- that keeps this tab to one small read per month instead of
   megabytes of R2 reads on every page load. The rollup doesn't carry the
   per-day "time set" figure the original artifact's Trends table had, so
   that column isn't reproducible here. */
let TREND_CACHE = null;
async function loadTrend() {
  if (TREND_CACHE) return TREND_CACHE;
  const months = [...new Set(DAYS.map(d => d.slice(0, 7)))].sort();
  const rows = [];
  for (const m of months) {
    try {
      const r = await fetch(`/api/months/${m}`, { cache: "no-store" });
      if (!r.ok) continue;
      const doc = await r.json();
      for (const t of (doc.trend || [])) rows.push(t);
    } catch (_) {}
  }
  rows.sort((a, b) => a.date < b.date ? -1 : 1);
  TREND_CACHE = rows;
  return rows;
}
function lineChart(points, fmt, tipFn) {
  const W = 720, H = 200, L = 44, R = 12, T = 14, B = 26;
  const xs = i => L + (points.length < 2 ? (W - L - R) / 2 : i * (W - L - R) / (points.length - 1));
  const vals = points.map(p => p.v);
  const hi = Math.max(...vals, 0), lo = Math.min(...vals, 0);
  const span = (hi - lo) || 1;
  const ys = v => T + (H - T - B) * (1 - (v - lo) / span);
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("class", "trend"); svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("preserveAspectRatio", "none");
  for (const frac of [0, 0.5, 1]) {
    const v = lo + span * frac, y = ys(v);
    const g = document.createElementNS(ns, "line");
    g.setAttribute("class", "grid"); g.setAttribute("x1", L); g.setAttribute("x2", W - R); g.setAttribute("y1", y); g.setAttribute("y2", y);
    svg.append(g);
    const t = document.createElementNS(ns, "text");
    t.setAttribute("class", "axis"); t.setAttribute("x", 4); t.setAttribute("y", y + 4);
    t.textContent = fmt(Math.round(v * 10) / 10);
    svg.append(t);
  }
  const path = document.createElementNS(ns, "path");
  path.setAttribute("class", "ln");
  path.setAttribute("d", points.map((p, i) => `${i ? "L" : "M"}${xs(i)},${ys(p.v)}`).join(" "));
  svg.append(path);
  points.forEach((p, i) => {
    const c = document.createElementNS(ns, "circle");
    c.setAttribute("class", "dot"); c.setAttribute("cx", xs(i)); c.setAttribute("cy", ys(p.v)); c.setAttribute("r", 4);
    svg.append(c);
    const lab = document.createElementNS(ns, "text");
    lab.setAttribute("class", "axis"); lab.setAttribute("x", xs(i)); lab.setAttribute("y", H - 8); lab.setAttribute("text-anchor", "middle");
    lab.textContent = p.label;
    svg.append(lab);
    const hit = document.createElementNS(ns, "rect");
    hit.setAttribute("class", "hit");
    hit.setAttribute("x", xs(i) - (W - L - R) / (2 * Math.max(1, points.length - 1)));
    hit.setAttribute("y", 0);
    hit.setAttribute("width", (W - L - R) / Math.max(1, points.length - 1));
    hit.setAttribute("height", H);
    hoverable(hit, tipFn(p));
    svg.append(hit);
  });
  return svg.outerHTML;
}
async function trendsPanel() {
  const ds = await loadTrend();
  if (ds.length < 2) return `<div class="empty">
    <div style="font-weight:600;font-size:15px;margin-bottom:6px">Not enough days on file yet</div>
    <p style="max-width:44ch;margin:0 auto;font-size:12.5px;line-height:1.6">Trends need at least two reporting
    days. A line through one point would be a decoration, not a finding.</p></div>`;
  const mx = Math.max(...ds.map(x => x.rate || 0), 1), mxs = Math.max(...ds.map(x => x.ps || 0), 1);
  const spark = (vals, max) => `<div class="spark">${vals.map(v =>
    `<i style="height:${Math.max(2, Math.round(v / max * 34))}px" title="${v}"></i>`).join("")}</div>`;
  const rows = ds.map(x => `<tr>
    <td>${new Date(x.date + "T12:00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" })}</td>
    <td class="num">${x.dials ?? 0}</td><td class="num">${x.live ?? 0}</td>
    <td class="num">${(x.rate ?? 0).toFixed ? x.rate.toFixed(1) : x.rate}%</td>
    <td class="num">${money(x.pq)}</td><td class="num">${money(x.ps)}</td></tr>`).join("");
  return `<div class="sect"><h2>Across ${ds.length} reporting days</h2>
   <p class="sd">Oldest first. Too few days to call anything a trend — this is the record, not a forecast.</p>
   <div class="tiles">
     <div class="tile"><div class="k">Contact rate</div>${spark(ds.map(x => x.rate || 0), mx)}
       <div class="n">${(ds[0].rate ?? 0)}% → ${(ds[ds.length - 1].rate ?? 0)}%</div></div>
     <div class="tile"><div class="k">Premium sold</div>${spark(ds.map(x => x.ps || 0), mxs)}
       <div class="n">${money(ds[0].ps)} → ${money(ds[ds.length - 1].ps)}</div></div>
   </div>
   <div class="scroll"><table><thead><tr><th>Day</th><th class="num">Dials</th><th class="num">Live</th>
    <th class="num">Rate</th><th class="num">Quoted</th><th class="num">Sold</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

/* ---- shell / paint --------------------------------------------------------- */
function $$(s) { return Array.from(document.querySelectorAll(s)); }

const RANGE_LABELS = { day: "Day", today: "Today", yesterday: "Yesterday",
  week: "This Week", mtd: "Month to Date", ytd: "Year to Date",
  folio: "Folio to Date", custom: "Custom range…" };

function rangeControlHtml() {
  const opts = Object.entries(RANGE_LABELS).map(([k, label]) =>
    `<option value="${k}"${k === rangeMode ? " selected" : ""}>${label}</option>`).join("");
  const today = isoDate(azTodayDate());
  let extra = "";
  if (rangeMode === "day") {
    extra = `<select id="daypick" aria-label="Reporting day">${DAYS.map(d =>
      `<option value="${d}"${cur && d === cur.date ? " selected" : ""}>${
        new Date(d + "T12:00:00").toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" })}</option>`).join("")}</select>`;
  } else if (rangeMode === "custom") {
    extra = `
    <input type="date" id="rfrom" value="${customFrom || today}" max="${today}">
    <span style="color:var(--text-muted);font-size:12px">to</span>
    <input type="date" id="rto" value="${customTo || today}" max="${today}">
    <button class="ghost" id="rapply" type="button">Apply</button>`;
  }
  return `<div class="controls"><select id="rangesel" aria-label="Digest range">${opts}</select>${extra}</div>`;
}
function wireRangeControl() {
  const sel = $("#rangesel");
  if (sel) sel.onchange = () => { rangeMode = sel.value; paint(); };
  const dp = $("#daypick");
  if (dp) dp.onchange = () => loadDay(dp.value);
  const ap = $("#rapply");
  if (ap) ap.onclick = () => {
    customFrom = $("#rfrom").value; customTo = $("#rto").value;
    if (customFrom && customTo) paint();
  };
}

/* Shared producer filter: whole agency or one person, kept in sync between
   the Digest and Coaching tabs (Trends doesn't use it -- no per-producer
   trend data exists yet). */
function producerControlHtml() {
  const opts = [`<option value=""${producerFilter ? "" : " selected"}>Whole Agency</option>`]
    .concat(PRODUCER_ROSTER.map(p => `<option value="${p}"${p === producerFilter ? " selected" : ""}>${p}</option>`));
  return `<div class="controls"><select id="prodsel" aria-label="Filter to producer">${opts.join("")}</select></div>`;
}
function wireProducerControl() {
  const sel = $("#prodsel");
  if (sel) sel.onchange = () => { producerFilter = sel.value; paint(); };
}

/* Resolve a preset into either a single ISO date (rendered via the normal
   rich single-day digest) or a [from, to] range (rendered via digestRange). */
async function renderDigestRange() {
  const v = $("#view");
  const today = isoDate(azTodayDate());
  const controls = rangeControlHtml() + producerControlHtml();

  if (rangeMode === "day") {
    v.innerHTML = controls + (cur ? digestPanel(cur, producerFilter) : '<div class="empty">Loading…</div>');
    wireRangeControl(); wireProducerControl();
    return;
  }
  if (rangeMode === "today" || rangeMode === "yesterday") {
    const day = rangeMode === "today" ? today : addDays(today, -1);
    v.innerHTML = controls + '<div class="empty">Loading…</div>';
    let doc = null;
    try {
      const r = await fetch(`/api/days/${day}`, { cache: "no-store" });
      doc = r.ok ? await r.json() : null;
    } catch (_) {}
    v.innerHTML = controls + (doc ? digestPanel(doc, producerFilter) : `<div class="empty">No report for ${day}.</div>`);
    wireRangeControl(); wireProducerControl();
    return;
  }

  v.innerHTML = controls + '<div class="empty">Loading…</div>';
  let html;
  if (rangeMode === "folio") {
    const end = folioEndFor(today);
    if (!end) {
      html = '<div class="empty">No folio calendar covers today yet.</div>';
    } else {
      try {
        const r = await fetch(`/api/folios/${end}`, { cache: "no-store" });
        const doc = r.ok ? await r.json() : null;
        html = doc ? digestRange(doc, "Folio to Date", doc.folio_start ? `${doc.folio_start} → ${doc.folio_end}` : `through ${doc.folio_end}`, producerFilter)
                   : `<div class="empty">No folio rollup yet for the folio ending ${end}. It is written by the nightly run.</div>`;
      } catch (_) { html = '<div class="empty">Could not load the folio rollup.</div>'; }
    }
  } else if (rangeMode === "mtd") {
    const month = today.slice(0, 7);
    try {
      const r = await fetch(`/api/months/${month}`, { cache: "no-store" });
      const doc = r.ok ? await r.json() : null;
      html = doc ? digestRange(doc, "Month to Date", doc.label, producerFilter)
                 : '<div class="empty">No month-to-date rollup yet. It is written by the nightly run.</div>';
    } catch (_) { html = '<div class="empty">Could not load the month rollup.</div>'; }
  } else if (rangeMode === "ytd") {
    const year = today.slice(0, 4);
    const curMonth = Number(today.slice(5, 7));
    const docs = [];
    for (let m = 1; m <= curMonth; m++) {
      try {
        const r = await fetch(`/api/months/${year}-${String(m).padStart(2, "0")}`, { cache: "no-store" });
        if (r.ok) docs.push(await r.json());
      } catch (_) {}
    }
    html = docs.length ? digestRange(aggregateDocs(docs), "Year to Date", `${year}-01-01 → ${today}`, producerFilter)
                       : '<div class="empty">No months on file yet this year.</div>';
  } else if (rangeMode === "week") {
    const from = weekStart(today);
    const docs = await fetchRangeDocs(from, today);
    html = digestRange(aggregateDocs(docs), "This Week", `${from} → ${today}`, producerFilter);
  } else if (rangeMode === "custom") {
    if (!customFrom || !customTo) {
      html = '<div class="empty">Pick a start and end date, then Apply.</div>';
    } else {
      const [from, to] = customFrom <= customTo ? [customFrom, customTo] : [customTo, customFrom];
      const docs = await fetchRangeDocs(from, to);
      html = docs.length ? digestRange(aggregateDocs(docs), "Custom Range", `${from} → ${to}`, producerFilter)
                        : `<div class="empty">No reports in ${from} → ${to}.</div>`;
    }
  }
  v.innerHTML = controls + html;
  wireRangeControl(); wireProducerControl();
}

async function paint() {
  const v = $("#view");
  if (view === "digest") {
    $("#topsub").textContent = cur ? (cur.label || cur.date) + " · " + ((cur.calls || []).length ? (cur.calls.length + " coached calls") : "stats only") : "";
    await renderDigestRange();
  } else if (view === "coaching") {
    $("#topsub").textContent = cur ? (cur.label || cur.date) : "";
    const controls = producerControlHtml();
    v.innerHTML = controls + (cur ? coachingPanel(cur, producerFilter) : '<div class="empty">Loading…</div>');
    wireProducerControl();
  } else {
    $("#topsub").textContent = "trends across every reporting day";
    v.innerHTML = '<div class="empty">Loading…</div>';
    v.innerHTML = await trendsPanel();
  }
}

async function loadDay(day) {
  rangeMode = "day";
  $("#view").innerHTML = '<div class="empty">Loading…</div>';
  try {
    const r = await fetch(`/api/days/${day}`, { cache: "no-store" });
    cur = r.ok ? await r.json() : null;
  } catch (_) { cur = null; }
  if (!cur) { $("#view").innerHTML = '<div class="empty">No report for this day.</div>'; $("#topsub").textContent = day; return; }
  await paint();
}

$$(".tab").forEach(t => t.onclick = () => {
  $$(".tab").forEach(x => x.setAttribute("aria-selected", String(x === t)));
  view = t.dataset.v; paint();
});

(async function init() {
  let days = [];
  let fetchError = null;
  try {
    const r = await fetch("/api/days", { cache: "no-store" });
    if ((r.headers.get("content-type") || "").includes("application/json")) {
      const body = await r.json();
      if (r.ok) { days = body.days || []; }
      else { fetchError = body.error || `request failed (${r.status})`; }
    } else {
      fetchError = "not signed in to Cloudflare Access";
    }
  } catch (_) {
    fetchError = "could not reach the board API";
  }
  if (fetchError) {
    $("#topsub").textContent = "";
    $("#view").innerHTML = `<div class="empty">Could not load reports: ${fetchError}.</div>`;
    return;
  }
  if (!days.length) {
    $("#topsub").textContent = "no reporting days yet";
    $("#view").innerHTML = '<div class="empty">No reports yet.</div>';
    return;
  }
  DAYS = days;
  await loadDay(days[0]);
})();
</script>
