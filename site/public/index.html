<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Floor — Flores Insurance Agency</title>
<style>
/* ---------------------------------------------------------------------------
   Palette. Categorical slots 1-5 in fixed order, validated in both modes:
   light  worst adjacent CVD dE 9.1, normal-vision 19.6
   dark   worst adjacent CVD dE 8.4, normal-vision 19.3
   Light mode puts aqua/yellow/magenta under 3:1 on the surface, so every
   stacked segment carries a visible count label and a legend -- that is the
   required relief, not decoration. Do not drop the labels.
   Colour follows the OUTCOME, never its rank or size, so a quiet day does not
   repaint the chart.
--------------------------------------------------------------------------- */
:root {
  color-scheme: light;
  --surface:        #fcfcfb;
  --surface-raised: #ffffff;
  --border:         #e5e4e0;
  --border-strong:  #d2d1cc;
  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --text-muted:     #78776f;
  --grid:           #ecebe7;
  --s1: #2a78d6;  /* Live Contact       */
  --s2: #eb6834;  /* Voicemail          */
  --s3: #1baf7a;  /* Screener           */
  --s4: #eda100;  /* No Answer          */
  --s5: #e87ba4;  /* No Outcome Logged  */
  --s6: #008300;  /* categorical slot 6 -- sales breakdown charts */
  --s7: #4a3aa7;  /* categorical slot 7 -- sales breakdown charts */
  --s8: #e34948;  /* categorical slot 8 -- sales breakdown charts */
  --bar:           #2a78d6;
  --bar-track:     #ecebe7;
  /* Chip/medal tokens, carried over from the pre-migration artifact's own
     light/dark palette (it had these; the first port here flattened them
     to single hardcoded values, which is why dark mode looked off --
     dark-on-dark chip text, unreadable bronze/gold medal names). */
  --good:   #0a6b0a; --goodbg: #e2f4e2; --goodbd: #b7e2b7;
  --warn:   #8a6100; --warnbg: #fdf0d9; --warnbd: #e0c184;
  --bad:    #a80000; --badbg:  #fce3e3; --badbd:  #f0b4b4;
  --gold:   #9a6f00; --silver: #6f6f6f; --bronze: #9a5f2b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface:        #1a1a19;
    --surface-raised: #222221;
    --border:         #35352f;
    --border-strong:  #45453e;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #8e8d84;
    --grid:           #2b2b27;
    --s1: #3987e5;
    --s2: #d95926;
    --s3: #199e70;
    --s4: #c98500;
    --s5: #d55181;
    --s6: #008300;
    --s7: #9085e9;
    --s8: #e66767;
    --bar:            #3987e5;
    --bar-track:      #2b2b27;
    --good:   #7fd07f; --goodbg: #1c3320; --goodbd: #2f5a34;
    --warn:   #e0b165; --warnbg: #33290f; --warnbd: #5c4a1c;
    --bad:    #f0908e; --badbg:  #3a1a1a; --badbd:  #632c2c;
    --gold:   #e3bf55; --silver: #c4c4c4; --bronze: #d79a63;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface:        #1a1a19;
  --surface-raised: #222221;
  --border:         #35352f;
  --border-strong:  #45453e;
  --text-primary:   #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted:     #8e8d84;
  --grid:           #2b2b27;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --s4: #c98500;
  --s5: #d55181;
  --s6: #008300;
  --s7: #9085e9;
  --s8: #e66767;
  --bar:            #3987e5;
  --bar-track:      #2b2b27;
  --good:   #7fd07f; --goodbg: #1c3320; --goodbd: #2f5a34;
  --warn:   #e0b165; --warnbg: #33290f; --warnbd: #5c4a1c;
  --bad:    #f0908e; --badbg:  #3a1a1a; --badbd:  #632c2c;
  --gold:   #e3bf55; --silver: #c4c4c4; --bronze: #d79a63;
}
/* Digest-email tier colours, verbatim (render_report.DOT / .tier-text-*),
   in LIGHT mode -- these are the actual colours the sent email uses, so a
   tier reads the same colour on the board as in their inbox there.
   Frank, 2026-09-09: in dark mode the email's saturated red/orange/green
   sitting directly on near-black text (no chip background to soften it,
   unlike .c-g/.c-w/.c-r) read as "blurry" -- full-saturation colour on a
   very dark ground causes exactly the halation the rest of this file's
   dark palette was built to avoid (see --good/--warn/--bad above, and
   .colh.g/.colh.b which already use them for the same bare-text-no-chip
   case). Dark mode gets those same tuned tokens instead of the email's
   literal hex; light mode is untouched and still matches the email exactly. */
.tg { color: #0ca30c; font-weight: 600; }
.ty { color: #eda100; font-weight: 600; }
.tr { color: #e60000; font-weight: 600; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .tg { color: var(--good); }
  :root:not([data-theme="light"]) .ty { color: var(--warn); }
  :root:not([data-theme="light"]) .tr { color: var(--bad); }
}
:root[data-theme="dark"] .tg { color: var(--good); }
:root[data-theme="dark"] .ty { color: var(--warn); }
:root[data-theme="dark"] .tr { color: var(--bad); }
.mdl { font-size: 14px; line-height: 1; margin-right: 5px; }
.ptrack { flex: 1; height: 10px; border-radius: 5px; background: var(--surface); border: 1px solid var(--border-strong); overflow: hidden; }
.pfill { height: 100%; border-radius: 5px; }

/* Podium (Frank, 2026-09-12). Two/1/3 on risers of fixed, decreasing height
   (rank order, not score-proportional -- a real podium doesn't resize per
   day), 4th/5th flanking lower with no riser at all. */
.podium2 { display: flex; align-items: flex-end; justify-content: center; gap: 12px; margin: 6px 0 24px; flex-wrap: wrap; }
.pod-block { display: flex; flex-direction: column; align-items: center; width: 108px; }
.pod-side { display: flex; flex-direction: column; align-items: center; width: 80px; opacity: .85; margin-bottom: 4px; }
.pod-avatar {
  width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 17px; margin-bottom: 6px; background-size: cover; background-position: center;
  box-shadow: 0 0 0 2px var(--border-strong); flex: none;
}
.pod-av-1 { width: 62px; height: 62px; font-size: 21px; }
.pod-av-side { width: 38px; height: 38px; font-size: 13px; }
.pod-name { font-size: 12px; font-weight: 600; text-align: center; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 3px; }
.pod-pts { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
.pod-step {
  width: 100%; border-radius: 6px 6px 0 0; display: flex; align-items: flex-start; justify-content: center;
  padding-top: 6px; font-weight: 700; font-size: 19px; color: #fff;
}
.pod-1 .pod-step { height: 88px; background: linear-gradient(180deg, #f4c542, #d9a326); }
.pod-2 .pod-step { height: 64px; background: linear-gradient(180deg, #c9ccd1, #a7abb2); }
.pod-3 .pod-step { height: 44px; background: linear-gradient(180deg, #d69a63, #b87a44); }
.pod-confetti { position: relative; width: 62px; height: 0; }
.confetti-piece {
  position: absolute; top: 0; left: 50%; width: 6px; height: 10px; opacity: 0;
  animation-name: confetti-fall; animation-timing-function: ease-in; animation-iteration-count: infinite;
}
@keyframes confetti-fall {
  0%   { transform: translate(0, -8px) rotate(0deg); opacity: 0; }
  12%  { opacity: 1; }
  100% { transform: translate(var(--dx, 20px), 58px) rotate(360deg); opacity: 0; }
}
@media (max-width: 520px) {
  .podium2 { gap: 6px; }
  .pod-block { width: 84px; }
  .pod-side { width: 62px; }
}
.sbar { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
.sbl { width: 100px; font-size: 11.5px; color: var(--text-secondary); flex-shrink: 0; }
.sbv { width: 34px; text-align: right; font-size: 12.5px; font-weight: 600; flex-shrink: 0; }
.orow { margin-bottom: 12px; }
.orow-head { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; margin-bottom: 4px; }
.on { color: var(--text-muted); }
.otrack { display: flex; height: 14px; border-radius: 4px; overflow: hidden; background: var(--bar-track); }
.ogseg { height: 100%; }
/* Renewal Outcome Breakdown only: a 2px surface gap between segments, and the
   diagonal hatch that marks a policy-record reading (see OUTCOME_COLORS). */
:root { --hatch: repeating-linear-gradient(135deg, transparent 0 3px, var(--surface) 3px 5px);
  --dots: radial-gradient(circle, var(--surface) 0 1px, transparent 1.4px); }
.rseg { box-sizing: border-box; }
.rseg + .rseg { border-left: 2px solid var(--surface); }
.rdot { width: 11px; height: 11px; }
.rtiles { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
.oleg { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: 11.5px; color: var(--text-secondary); }
.oleg-item { display: flex; align-items: center; gap: 5px; }
/* Objection chart -- Live Contact Detail's own top-of-tab bar chart (Frank,
   2026-09-17), same bar-row shape as .orow/.otrack above but each row is a
   clickable filter, not just a display. */
.objrow { margin-bottom: 12px; cursor: pointer; border-radius: 6px; padding: 6px 8px; margin-left: -8px; margin-right: -8px; transition: background .1s; }
.objrow:hover { background: var(--surface-raised); }
.objrow.sel { background: color-mix(in oklab, var(--bar) 12%, var(--surface-raised)); }
.objrow-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 12.5px; margin-bottom: 4px; gap: 10px; }
.objcat { font-weight: 600; }
.objn { color: var(--text-muted); font-size: 11.5px; white-space: nowrap; }
.objtrack { height: 14px; border-radius: 4px; overflow: hidden; background: var(--bar-track); }
.objwon { height: 100%; background: var(--good); }
.linkbtn { background: none; border: none; padding: 0; color: var(--bar); font-size: inherit; font-weight: 600; cursor: pointer; text-decoration: underline; }

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--surface);
  color: var(--text-primary);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ---- top bar + shell ------------------------------------------------------ */
.top {
  background: var(--text-primary); color: var(--surface);
  padding: 14px 22px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
}
.top h1 { font-size: 17px; margin: 0; color: inherit; font-weight: 600; }
.top .sub { font-size: 12px; color: var(--text-muted); }
.thbtn {
  margin-left: auto; align-self: center; display: inline-flex; align-items: center; gap: 6px;
  background: transparent; color: inherit; border: 1px solid var(--border-strong); border-radius: 7px;
  padding: 5px 10px; font: 500 12px/1 inherit; cursor: pointer;
}
.shell { min-height: calc(100vh - 49px); display: flex; }
.pd { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.pbadge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 5px; font-size: 12px; font-weight: 700; line-height: 1.5; white-space: nowrap; }
.main { padding: 20px 24px 60px; min-width: 0; flex: 1; max-width: 1120px; margin: 0 auto; }

/* Left-side category menu (Frank, 2026-09-17: "turn our current tabs into
   a left side menu" -- the single horizontal tab row had no overflow
   handling at all and was going to keep growing as more tabs got added).
   Same .tab buttons/data-v attributes/click-wiring as before, just laid
   out as a vertical sticky rail instead of a horizontal strip -- nothing
   about how a tab switches `view` changed, only where it sits. Any
   view's own sub-navigation (Coaching's Live Contact Detail/Wins and
   Losses .subtabs) still renders inside #view, unaffected -- that's the
   "tabs within those categories" layer, already a separate component. */
.tabs {
  display: flex; flex-direction: column; gap: 2px; flex: none; width: 168px;
  padding: 20px 10px; border-right: 1px solid var(--border);
  position: sticky; top: 49px; align-self: flex-start; max-height: calc(100vh - 49px);
  overflow-y: auto;
}
.tab {
  background: none; border: none; border-left: 3px solid transparent; border-radius: 0 7px 7px 0;
  padding: 9px 12px; font: inherit; font-weight: 600; font-size: 13px; color: var(--text-muted);
  cursor: pointer; text-align: left; width: 100%;
}
.tab[hidden] { display: none; }
.comtab th.t, .comtab td.t { text-align: left; }
.tab[aria-selected="true"] { color: var(--text-primary); border-left-color: var(--text-primary); background: var(--surface-raised); }
.tab:hover { color: var(--text-primary); }
@media (max-width: 760px) {
  .shell { flex-direction: column; }
  .tabs {
    flex-direction: row; width: 100%; max-width: 100%; min-width: 0; flex: none;
    position: static; max-height: none; overflow-y: visible;
    overflow-x: auto; border-right: none; border-bottom: 1px solid var(--border); padding: 8px 12px;
  }
  .tab { border-left: none; border-bottom: 2px solid transparent; border-radius: 0; white-space: nowrap; flex: none; width: auto; }
  .tab[aria-selected="true"] { border-left-color: transparent; border-bottom-color: var(--text-primary); background: none; }
  .main { max-width: none; min-width: 0; width: 100%; }
}
.subtabs { display: flex; gap: 6px; margin-bottom: 18px; }
.subtab {
  background: var(--surface); border: 1px solid var(--border-strong); border-radius: 20px;
  padding: 6px 14px; font: inherit; font-weight: 600; font-size: 12px; color: var(--text-secondary); cursor: pointer;
}
.subtab.sel { background: var(--text-primary); color: var(--surface); border-color: var(--text-primary); }
/* Section tabs inside a left-bar Center (Sales Center, Learning Center). An
   underline strip, so it reads as a level above each page's own pill-style
   .subtabs rather than as another row of the same thing. */
.ctabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin: -4px 0 18px; overflow-x: auto; }
.ctab { background: none; border: none; border-bottom: 2px solid transparent; padding: 8px 14px 9px; margin-bottom: -1px;
  font: inherit; font-size: 13.5px; font-weight: 600; color: var(--text-muted); cursor: pointer; white-space: nowrap; }
.ctab.sel { color: var(--text-primary); border-bottom-color: var(--text-primary); }
.ctab:hover:not(.sel) { color: var(--text-primary); }
.subtab:hover:not(.sel) { border-color: var(--text-muted); color: var(--text-primary); }

.controls { display: flex; gap: 8px; align-items: center; margin-bottom: 18px; }
select, button.ghost {
  font: inherit; font-size: 13px;
  color: var(--text-primary); background: var(--surface-raised);
  border: 1px solid var(--border-strong); border-radius: 6px;
  padding: 6px 10px; cursor: pointer;
}
.icon-btn {
  background: none; border: none; padding: 5px; margin: 0; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; border-radius: 6px;
}
.icon-btn:hover { background: var(--surface-raised); }
.del-btn { color: var(--bad); }

/* Section titles, made deliberately harder to mistake for one another or
   for body text (Frank, 2026-09-12: "I cant really distinguish the
   category titled, like leaderboard, utilization, etc."). Was 12px/muted --
   same weight as .sd's own descriptive text right under it, so a title and
   its caption barely read as different things. Bigger, full-contrast, and a
   rule under each one now functions as the section boundary the eye was
   missing.

   `h2:first-of-type` (removed) does NOT mean "the first h2 on the page" --
   it means "the first h2 among ITS OWN siblings", and every section here is
   its own isolated <div class="sect"> holding exactly one h2. That makes
   EVERY section's h2 "first of its type" within its own parent, so the
   8px override that was meant for page-top only was actually collapsing
   every section's top margin to 8px -- confirmed as the reason Frank still
   saw titles "blend in" with the section above even after this rule
   existed (a legend row directly above "SPEED TO DIAL" with almost no gap).
   A uniform 36px top margin for every section reads better than chasing a
   slightly smaller gap above the very first one. */
h2 {
  font-size: 15px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.05em; color: var(--text-primary);
  margin: 36px 0 14px; padding-bottom: 8px;
  border-bottom: 2px solid var(--border-strong);
}
.sd { font-size: 12.5px; color: var(--text-secondary); margin: -10px 0 14px; line-height: 1.55; }

/* Two-column card layout below the Digest tab's leaderboard, matching the
   email's own side-by-side arrangement (Frank, 2026-09-12). minmax(0, 1fr),
   not a bare 1fr: a grid track's automatic minimum size is its content's
   min-content width unless overridden, and .scroll table's own min-width:
   640px was winning that fight, forcing the column with a table in it to
   642px against the other column's 410px -- not the width difference
   that caused Frank's "still uneven" report to look like a bad content
   grouping when it was really just unequal columns. .scroll's own
   overflow-x:auto still handles a table wider than its now-truly-equal
   column, same as it already does outside this grid. Collapses to one
   column under the same width other narrow layouts in this file use. */
.digestgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 720px) { .digestgrid { grid-template-columns: 1fr; } }

/* Stat tiles. */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 10px; }
/* Digest's top row specifically (Frank, 2026-09-23: "I want all 6 cards in
   1 row, and they dont need to be the same size if thats needed to make
   them fit") -- flex instead of the shared .tiles grid, so each tile keeps
   its own relative width (a short "Closing Ratio" card stays narrower than
   "HH/Prem. Quoted") rather than a grid forcing all 6 to one equal column
   width. flex-grow:1 on every tile absorbs any leftover row width into the
   CARDS themselves (widening each by an equal share) instead of stretching
   the GAPS between them (Frank, 2026-09-23: "i dont like the space between
   the top cards" -- justify-content:space-between's wide gaps, tried first,
   read worse than a tight fixed 10px gap with wider cards). Below 900px
   there isn't room for 6 natural-width cards without crushing the
   two-percentage Closing Ratio card's own internal layout, so it wraps
   instead of overflowing the page (same breakpoint family .digestgrid
   already uses at 720px, just wider because this row has more columns to
   lose room from). overflow-x is a last-resort safety net, not the primary
   mechanism -- wrapping should always trigger first. */
.tiles-6 { display: flex; gap: 10px; flex-wrap: wrap; }
.tiles-6 .tile { flex: 1 1 0; min-width: 0; }
@media (max-width: 899px) { .tiles-6 .tile { flex-basis: 140px; } }
@media (min-width: 900px) { .tiles-6 { flex-wrap: nowrap; overflow-x: auto; } }
.tile {
  background: var(--surface-raised); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 16px;
}
.tile .k { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
.tile .v { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; margin-top: 4px; font-variant-numeric: tabular-nums; }
.tile .n { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

/* Live indicator (intraday.py, Frank, 2026-09-12) -- a slim line, not a
   duplicate stat box: the report below it already IS the live data (same
   board_payload.build() shape whether the source is a finalized day or
   intraday.py's latest checkpoint), so this only has to say so. */
.livebanner { font-size: 12.5px; color: var(--text-secondary); border: 1px solid var(--good); border-radius: 8px; padding: 8px 12px; margin-bottom: 16px; }
.liveflags { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
.liveflag { font-size: 12.5px; color: var(--warn); background: var(--surface-raised); border: 1px solid var(--warn); border-radius: 8px; padding: 7px 10px; }

/* Training tab flashcards (Frank, 2026-09-11) -- flip card driven purely by
   a CSS 3D transform on .flipped, no JS animation. Front/back are both laid
   out and stacked via backface-visibility so there's no flash of the wrong
   face mid-flip. */
.btn {
  font: inherit; font-size: 13px; font-weight: 600;
  color: var(--text-primary); background: var(--surface-raised);
  border: 1px solid var(--border-strong); border-radius: 6px;
  padding: 7px 14px; cursor: pointer;
}
.btn:hover { border-color: var(--text-muted); }
.flashcard {
  perspective: 1400px; cursor: pointer; margin: 10px 0 18px;
  min-height: 220px;
}
.flashcard:focus-visible .fcface { outline: 2px solid var(--text-primary); outline-offset: 2px; }
.fcinner {
  position: relative; width: 100%; height: 100%; min-height: inherit;
  transform-style: preserve-3d; transition: transform 0.5s ease;
}
.flashcard.flipped .fcinner { transform: rotateY(180deg); }
.fcface {
  position: absolute; inset: 0; backface-visibility: hidden;
  border: 1px solid var(--border-strong); border-radius: 12px;
  background: var(--surface-raised); padding: 22px 26px;
  display: flex; align-items: center; justify-content: center;
  overflow-y: auto;
}
/* align-items:center (inherited from .fcface) clips a tall back face at the
   top when it overflows the fixed-height box -- centering a scrollable flex
   item hides the portion above the fold instead of leaving it reachable by
   scrolling. Top-align the back face instead so overflow only ever runs
   downward, where overflow-y:auto can actually reach it. */
.fcback { transform: rotateY(180deg); align-items: flex-start; justify-content: flex-start; }
.fctext { font-size: 17px; font-weight: 600; text-align: center; line-height: 1.4; }
.fctext-back { font-size: 13.5px; font-weight: 400; text-align: left; line-height: 1.55; width: 100%; }
.fctext-back .gl li:before { background: var(--text-muted); }
.fccontrols { display: flex; gap: 8px; flex-wrap: wrap; }

/* Training tab: Quiz and Match study modes (Frank, 2026-09-11). */
.quizq { font-size: 16px; font-weight: 600; margin: 6px 0 16px; line-height: 1.4; }
.quizopts { display: flex; flex-direction: column; gap: 8px; }
.quizopt {
  text-align: left; font: inherit; font-size: 13px; line-height: 1.4;
  color: var(--text-primary); background: var(--surface-raised);
  border: 1px solid var(--border-strong); border-radius: 8px;
  padding: 10px 14px; cursor: pointer;
}
.quizopt:hover:not(:disabled) { border-color: var(--text-muted); }
.quizopt:disabled { cursor: default; }
.quizopt.correct { background: var(--goodbg); color: var(--good); border-color: var(--goodbd); }

<script>
/* The digest email's own producer colours (render_report.DOT), so a producer
   is the same colour on the board as in their inbox. Not chosen here. */
const DOT = {"Crystal Mango":"#ff4b4b", "Lorena Gonzalez":"#cd81ff",
             "Mike Olvera":"#5656fe",   "Debbie Aguilera":"#0b0b0b",
             "Coral Barwick":"#00ffcf",  "Sarahi Chin":"#ffb48c",
             "Amanda Torricellas":"#baffff",
             // Coral + Sarahi's combined Sales-section identity (see
             // SALES_TEAM_GROUPS) -- never looked up outside that map's own
             // group name, since no individual is ever actually named this.
             "The Insurance Icons":"#ffd700"};
const TEAM_DOT = "#0b0b0b";

/* Producer identity badge -- a colour-filled pill with the name inside,
   replacing the old dot-plus-plain-text everywhere a row or card needs to
   say whose number this is (Frank, 2026-09-12). Text colour picks whichever
   of black/white has the higher WCAG contrast against that producer's own
   colour: DOT spans from near-black (Debbie) to pale mint (Coral), so no
   single text colour reads on all of it. */
function badgeTextColor(hex) {
  const c = hex.replace("#", "");
  const r = parseInt(c.slice(0, 2), 16) / 255, g = parseInt(c.slice(2, 4), 16) / 255, b = parseInt(c.slice(4, 6), 16) / 255;
  const lin = v => v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  const lum = 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
  const contrast = (l1, l2) => (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
  return contrast(lum, 1) >= contrast(lum, 0) ? "#fff" : "#111";
}
function pbadge(color, label) {
  return `<span class="pbadge" style="background:${color};color:${badgeTextColor(color)}">${label}</span>`;
}

// Producer name -> photo URL. Empty until real headshots exist somewhere
// this can point to -- every avatar falls back to a colour-badge initial
// (podiumAvatar below) until then. Deliberately NOT a repo-committed image
// path: this repo is public on GitHub, so a real headshot belongs in the
// private flores-board R2 bucket (served through a Worker route the same
// access-gated way days/<day>.json already is), never under site/public/.
const PRODUCER_PHOTOS = {};

function podiumAvatar(name, sizeClass) {
  const photo = PRODUCER_PHOTOS[name];
  if (photo) return `<div class="pod-avatar ${sizeClass}" style="background-image:url('${photo}')"></div>`;
  const color = DOT[name] || "#8a877f";
  const initial = (name.split(" ")[0][0] || "?").toUpperCase();
  return `<div class="pod-avatar ${sizeClass}" style="background:${color};color:${badgeTextColor(color)}">${initial}</div>`;
}

// A handful of small falling pieces, randomised each render so it never
// looks mechanical -- CSS keyframes do the actual falling (see .confetti-piece).
function confettiHtml() {
  const colors = ["#ff4b4b", "#5656fe", "#00c37a", "#ffb84d", "#cd81ff"];
  let pieces = "";
  for (let i = 0; i < 14; i++) {
    const dx = Math.round((Math.random() - 0.5) * 70);
    const delay = (Math.random() * 1.6).toFixed(2);
    const dur = (1.1 + Math.random() * 0.7).toFixed(2);
    const left = Math.round(10 + Math.random() * 80);
    pieces += `<span class="confetti-piece" style="left:${left}%;background:${colors[i % colors.length]};` +
      `animation-delay:${delay}s;animation-duration:${dur}s;--dx:${dx}px"></span>`;
  }
  return `<div class="pod-confetti">${pieces}</div>`;
}

/* Podium -- 1st/2nd/3rd on risers (tallest to shortest, not point-proportional:
   a real podium has fixed step heights), 4th and 5th flanking it lower and
   smaller, no riser. Replaces the old horizontal bar-per-producer list
   (Frank, 2026-09-12: "turn into a 1/2/3 podium with #4 off to the left and
   #5 off to right, both a bit lower"). Confetti (CSS-only, no library) falls
   over 1st only. Avatars fall back to a colour-initial circle until
   PRODUCER_PHOTOS has a real photo for that name. */
function podiumHtml(order, points) {
  const block = (name, rank) => name == null ? "" : `<div class="pod-block pod-${rank}">
    ${rank === 1 ? confettiHtml() : ""}
    ${podiumAvatar(name, "pod-av-" + rank)}
    <div class="pod-name">${name}</div>
    <div class="pod-pts">${points[name] ?? 0} pts</div>
    <div class="pod-step">${rank}</div>
  </div>`;
  const side = (name, label) => name == null ? "" : `<div class="pod-side">
    ${podiumAvatar(name, "pod-av-side")}
    <div class="pod-name">${name}</div>
    <div class="pod-pts">${label}</div>
  </div>`;

}

/* ---- theme: system -> light -> dark, remembered per browser --------------- */
(function () {
  const K = "board-theme", R = document.documentElement, b = $("#thbtn"),
        ico = $("#thico"), lbl = $("#thlbl");
  const M = ["system", "light", "dark"],
        T = { system: ["◑", "System"], light: ["☀", "Light"], dark: ["☾", "Dark"] };
  const read = () => { try { const v = localStorage.getItem(K); return M.includes(v) ? v : "system"; } catch (_) { return "system"; } };
  const apply = (m, save) => {
    if (m === "system") { delete R.dataset.theme; R.style.colorScheme = ""; }
    else { R.dataset.theme = m; R.style.colorScheme = m; }
    ico.textContent = T[m][0]; lbl.textContent = T[m][1];
    if (save) try { localStorage.setItem(K, m); } catch (_) {}
  };
  let cur = read(); apply(cur, false);
  b.addEventListener("click", () => { cur = M[(M.indexOf(cur) + 1) % M.length]; apply(cur, true); });
})();

/* ---- Digest tab ------------------------------------------------------------
   Ranked like the leaderboard, medals on the top three. Each stat is coloured
   by the day document's own `tiers` (computed server-side from
   digest_config, so the boundary rules live in one place) -- the whole-agency
   tiles use tiers.team, which board_payload._team_tiers() already scales
   the volume metrics (dials, hh) x5 for and leaves the rate/ratio metrics
   (contact rate, premium-per-hh, premium-per-policy, utilization) unscaled,
   same as the leaderboard table's own Team row (Frank, 2026-09-12: "if
   theres not tiering rule for the team, just multiply the per producer
   tiering stats by 5 for the volume ones, rate stats stay the same" -- this
   was already true server-side, just never wired up to these tiles). Team
   Policies has no colour: its only rule is the per-producer sale streak,
   which has no team-wide equivalent (see publish_board.apply_policy_streak's
   own comment). */
function digestDay(d, who) {
  const byName = Object.fromEntries((d.producers || []).map(p => [p.name, p]));
  const focus = who ? byName[who] : null;
  // Whole-agency tiles read from d.totals; a single producer's tiles read
  // from their own row instead, since "the team's numbers" is not what
  // filtering to one person means.
  const t = focus || d.totals || {};
  const rate = focus ? (focus.rate ?? 0) : (t.dials ? (100 * t.live / t.dials).toFixed(1) : "0");
  const TI = { green: "tg", yellow: "ty", red: "tr" };
  const tc = key => TI[((d.tiers || {})[who || "team"] || {})[key]] || "";
  // Households Quoted and Premium Quoted share one tile (and likewise
  // Policies/Premium Sold), but as two figures side by side on the SAME big
  // number line, not one promoted to the big number with the other demoted
  // to a subtitle -- Frank, 2026-09-12: "I still want them in the same box,
  // just side by side, so abbreviate it and a slash." (First split into
  // four separate tiles per an earlier ask that they be "equally
  // important" -- this keeps that equal weight, one line, one box.)
  // Mirrors the emailed digest's Call Volume funnel card (render_report.
  // build_funnel): the big number stays new-business-only distinct numbers
  // (what's tiered/compared), with total dial ATTEMPTS on those same
  // numbers as a "N dials" note -- unported to the board until now, shown
  // for every producer/team. The raw-incl.-service clause is Crystal Mango
  // ONLY (Frank, 2026-09-17: "I only wanted to show crystals service
  // calls, not everyone else") -- she's the one producer who also does
  // service work, and this is deliberately her own callout, not a general
  // mechanism that would surface a stray excluded call for anyone else.
  const dialsNote = [
    t.total_dials ? `${t.total_dials} dial${t.total_dials === 1 ? "" : "s"}` : "",
    (focus && focus.name === "Crystal Mango" && t.raw_dials && t.total_dials
     && t.raw_dials > t.total_dials) ? `${t.raw_dials} incl. service` : "",
  ].filter(Boolean).join(" · ");
  // 5 small tiles in one line, matching the original layout (Frank,
  // 2026-09-23), PLUS Closing Ratio as a 6th tile in the SAME row (Frank,
  // 2026-09-23: "I want all 6 cards in 1 row, and they dont need to be the
  // same size if thats needed to make them fit").
  const tiles = [
    ["Dials", t.dials ?? 0, dialsNote, tc("dials")],
    ["Live contacts", t.live ?? 0, rate + "% contact rate", tc("rate")],
    ["HH/Prem. Quoted", `<span class="${tc("hh")}">${t.hh ?? 0} HH</span><br><span class="${tc("pq")}">${money(t.pq)}</span>`],
    // Policies colours on the sale streak (see apply_policy_streak), same
    // tier data the Team Leaderboard table's own Pol column already uses --
    // this tile just wasn't wrapping the number in it (unlike HH/Prem.
    // Quoted right above, which colours both halves).
    ["Pol/Prem. Sold", `<span class="${tc("pol")}">${t.pol ?? 0} Pol</span><br><span class="${tc("ps")}">${money(t.ps)}</span>`],
  ];
  if (t.util != null) tiles.push(["Utilization", t.util + "%", "weighted", tc("util")]);
  const tilesHtml = tiles.map(([k, v, n, cls]) =>
    `<div class="tile"><div class="k">${k}</div><div class="v${cls ? " " + cls : ""}">${v}</div>${n ? `<div class="n">${n}</div>` : ""}</div>`).join("");

  // Closing Ratio (Frank, 2026-09-22: "add a closing rate table between the
  // sold and utilization cards"; 2026-09-23: "can we do a closing ratio for
  // households and premium?"; 2026-09-23: "i want it as a tile"; 2026-09-23:
  // "I dont need the formula under them, we know how it works" -- no more
  // "N of M HH" breakdown line, just the two percentages, each with its own
  // small label directly under it (not abbreviated "HH"/"Prem" beside the
  // number anymore). Each half is an outcome over the attempt count that
  // produced it (same funnel-step shape as CLAUDE.md's contact rate):
  // policies sold over households quoted, and premium sold over premium
  // quoted. Both purely derived from fields already on `t`, same as `rate`
  // above -- no backend change.
  const hh = t.hh ?? 0, pol = t.pol ?? 0, pq = t.pq ?? 0, ps = t.ps ?? 0;
  const hhClosingRatio = hh ? (100 * pol / hh) : null;
  const premClosingRatio = pq ? (100 * ps / pq) : null;
  // Tier-coloured (Frank, 2026-09-23, off industry cross-sell close-rate
  // research: green >=25%, yellow 15-24.99%, red <15% -- see
  // digest_config.THRESHOLDS["closing_ratio_pct"]) -- both halves share the
  // one scheme, since Frank gave one for "close ratio", not two.
  const pct = v => v == null ? "—" : v.toFixed(1) + "%";
  const closingRatioTileHtml = `<div class="tile">
   <div class="k">Closing Ratio</div>
   <div class="v"><span class="${tc("closing_hh")}">${pct(hhClosingRatio)}</span> <span class="n" style="font-weight:400">households</span><br><span class="${tc("closing_pq")}">${pct(premClosingRatio)}</span> <span class="n" style="font-weight:400">premium</span></div>
  </div>`;

  return `<div class="tiles tiles-6">${tilesHtml}${closingRatioTileHtml}</div>
  ${teamLeaderboardHtml(d, who)}`;
}

/* Household Completion -- was a single "Cross-Sell/Bundle" tile in the main
   row (Frank, 2026-09-23: "know if they completed an existing household ...
   or if they are selling a new bundle/household"), then a table of its own
   between Closing Ratio and Team Leaderboard, now moved into digestPanel()'s
   .digestgrid alongside Speed to Dial/Utilization (Frank, 2026-09-24: "it
   should be down below with the other small cards, and should be smaller
   itself") -- one row per producer, a team total row below (Frank,
   2026-09-23: "down below for now, with individual numbers, then a team
   total").

   Two DIFFERENT confidence levels sharing this table, so the caption spells
   each one out rather than trusting the reader to know:
     - Cross-Sell reads AgencyZoom's own lead source on the sale ("Home no
       Auto", "Cross Sell", etc.) -- no join needed, covers every sale.
     - New Bundle needs a policy -> household match that only resolves for
       part of a day's sales (no customerId/leadId on a policy record --
       see digest_config.bundle_classification for the full method and why
       widening the match window makes it WORSE, not better). It is a LOWER
       BOUND, marked with "+" for exactly that reason, with its own coverage
       (Matched to Household) alongside so it's never read as a complete
       count. Neither column is tier-coloured yet -- no Frank-approved
       threshold exists for either. */
// Small per-producer cards, same shape as utilizationHtml's (name, one big
// tiered number, small notes below) instead of a wide table -- moved out of
// digestDay() into digestPanel()'s .digestgrid, alongside Speed to Dial and
// Utilization (Frank, 2026-09-24: "it should be down below with the other
// small cards, and should be smaller itself").
function householdCompletionHtml(d, who) {
  const byName = Object.fromEntries((d.producers || []).map(p => [p.name, p]));
  const focus = who ? byName[who] : null;
  const TI = { green: "tg", yellow: "ty", red: "tr" };
  const tc = (name) => TI[((d.tiers || {})[name] || {})["policies_per_hh"]] || "";
  // Resolved policies over resolved HOUSEHOLDS (never over `pol`, which
  // includes the ~50% of sales the join can't place at a household at all
  // -- see digest_config.bundle_classification). Tier-coloured (Frank,
  // 2026-09-23, off industry policies-per-household benchmarks: green
  // >=1.5, yellow 1.1-1.49, red <1.1 -- digest_config.THRESHOLDS
  // ["policies_per_household"]) and the headline number on this card
  // (Frank, 2026-09-24) -- cross-sell/new-bundle/coverage are supporting
  // notes underneath, same role dialsNote plays on the Dials tile.
  const perHh = p => (p.bundle_resolved_households
    ? (p.bundle_resolved / p.bundle_resolved_households) : null);
  // `tierKey` is the (d.tiers || {}) lookup key -- the producer's own name,
  // or the lowercase "team" every other panel keys the team row under
  // (teamLeaderboardHtml's own tt()/tc("team", ...) do the same) -- kept
  // separate from `label`, the capitalized "Team" actually shown, so this
  // doesn't repeat the bug where using the display label as the lookup key
  // silently found no tier data and rendered uncoloured.
  const card = (label, tierKey, p, cls) => `<div class="tile"${cls ? ` style="border-color:var(--border-strong)"` : ""}>
    <div class="k">${label}</div>
    <div class="v ${tc(tierKey)}">${perHh(p) == null ? "—" : perHh(p).toFixed(2)}</div>
    <div class="n">policies/HH &middot; ${p.cross_sell ?? 0} cross-sell &middot; ${p.new_bundle ?? 0}+ new bundle</div>
    <div class="n">${p.bundle_resolved ?? 0} of ${p.pol ?? 0} sold matched to a household</div>
   </div>`;

  const list = (focus ? [focus] : (d.producers || [])).filter(p => (p.pol || 0) > 0);
  const cards = list.map(p => card(p.name, p.name, p)).join("");
  const T = d.totals || {};
  const teamCard = focus || !(T.pol) ? "" : card("Team", "team", T, true);
  if (!cards && !teamCard) return "";

  return `<div class="sect"><h2>Household Completion</h2>
   <p class="sd">Cross-sell to an existing household (AgencyZoom's own lead source, every sale) vs. a brand-new bundled household (est. lower bound -- see the "matched" note).</p>
   <div class="tiles">${cards}${teamCard}</div></div>`;
}

    <td class="num ${tt("talk")}">${hhmm(T.talk)}</td>
    <td class="num ${tt("rate")}">${teamRate}% <span style="opacity:.72">(${T.live ?? 0})</span></td>
    <td class="num ${tt("hh")}">${T.hh ?? 0}</td>
    <td class="num ${tt("pq")}">${money(T.pq)}</td>
    <td class="num ${tt("pol")}">${T.pol ?? 0}</td>
    <td class="num ${tt("ps")}">${money(T.ps)}</td>
    ${T.util != null ? `<td class="num ${tt("util")}">${T.util}%</td>` : ""}</tr>`;

  return `<div class="sect"><h2>Team Leaderboard</h2>
   ${podium}
   <div class="scroll"><table><thead><tr><th>Producer</th>${hasRoleplay ? "<th class=\"num\">Role Play</th>" : ""}
   <th class="num">Call Volume</th><th class="num">Avg Talk Time</th><th class="num">Contact Rate</th>
   <th class="num">Households Quoted</th><th class="num">Premium Quoted</th>
   <th class="num">Policies</th><th class="num">Premium Sold</th>
   ${ranked.some(p => p.util != null) ? "<th class=\"num\">Utilization</th>" : ""}</tr></thead>
   <tbody>${rows}${tot}</tbody></table></div></div>`;
}

/* Wins and Losses -- was "What the day says" + "Objections by category" on

   now (Frank, 2026-09-23: "leave it only in the objections tab") -- the

function winsLossesHtml(d, who) {

  const s = d.scan;

   <p class="sd">Two patterns that only show up across calls, not within one.</p>
   <div class="hero">
    <div class="hl">The opening asks permission</div>
    <p><b>${s.asked_open} of ${s.of}</b> coached calls opened by asking for the opportunity —

   </div>
   <div class="hero">
    <div class="hl">Prices on the table against asks made</div>

/* The next four sections mirror the customized email digest's own panels
   (Frank, 2026-09-10) -- Task Completion Rate, Call Outcome Breakdown,
   Utilization and Efficiency, and Coaching & Call Quality. All four read
   data board_payload.py already computed (d.totals.tasks/producers[].tasks,
   d.outcomes, producers[].util*, producers[].coach) but that had no
   frontend renderer at all until now -- board_payload.outcome_breakdown's
   own docstring already flagged the Outcomes figures as silently unused. */

function taskCompletionHtml(d, who) {
  const byName = Object.fromEntries((d.producers || []).map(p => [p.name, p]));
  const focus = who ? byName[who] : null;
  const TI = { green: "tg", yellow: "ty", red: "tr" };
  const tc = (name) => TI[((d.tiers || {})[name] || {})["tasks"]] || "";
  const list = (focus ? [focus] : (d.producers || [])).filter(p => p.tasks && p.tasks.total != null);
  if (!list.length) return "";
  const rows = list.map(p => { const t = p.tasks; const pct = t.pct ?? 0;
    return `<tr><td><span class="who">${pbadge(DOT[p.name] || "#8a877f", p.name)}</span></td>
      <td class="num">${t.total ?? 0}</td><td class="num">${t.completed ?? 0}</td>
      <td class="num ${tc(p.name)}">${(+pct).toFixed(1)}%</td></tr>`; }).join("");
  const T = (d.totals || {}).tasks || {};
  const tot = focus || T.total == null ? "" : `<tr class="tot"><td><span class="who">${pbadge(TEAM_DOT, "Team")}</span></td>
    <td class="num">${T.total ?? 0}</td><td class="num">${T.completed ?? 0}</td>
    <td class="num ${TI[((d.tiers || {})["team"] || {})["tasks"]] || ""}">${(+(T.pct ?? 0)).toFixed(1)}%</td></tr>`;

   <th class="num">Done</th><th class="num">Rate</th></tr></thead>
   <tbody>${rows}${tot}</tbody></table></div></div>`;
}

const OUTCOME_SEGMENTS = [["Live Contact", "--s1"], ["Voicemail", "--s2"], ["Screener", "--s3"],
  ["No Answer", "--s4"], ["No Outcome Logged", "--s5"]];
function outcomeBreakdownHtml(d, who) {
  const outcomes = d.outcomes || {};
  const byName = Object.fromEntries((d.producers || []).map(p => [p.name, p]));
  const names = (who ? [who] : Object.keys(outcomes)).filter(n => byName[n]);
  const withVol = names.map(n => ({ name: n, o: outcomes[n] || {}, vol: (byName[n] || {}).dials || 0 }))
    .filter(x => Object.values(x.o).some(v => v));
  if (!withVol.length) return "";
  withVol.sort((a, b) => b.vol - a.vol);
  const busiest = Math.max(...withVol.map(x => x.vol), 1);
  const rows = withVol.map(({ name, o, vol }) => {
    const total = vol || 1;
    const segs = OUTCOME_SEGMENTS.map(([label, cvar]) => {
      const n = o[label] || 0;
      if (!n) return "";
      return `<span class="ogseg" style="width:${(n / total * 100).toFixed(2)}%;background:var(${cvar})" title="${label}: ${n}"></span>`;
    }).join("");
    return `<div class="orow"><div class="orow-head">
      <span class="who">${pbadge(DOT[name] || "#8a877f", name)}</span>
      <span class="on">${vol} new-business dial${vol === 1 ? "" : "s"}</span></div>
      <div style="width:${(vol / busiest * 100).toFixed(2)}%"><div class="otrack">${segs}</div></div></div>`;
  }).join("");
  const legend = OUTCOME_SEGMENTS.map(([label, cvar]) =>
    `<span class="oleg-item"><span class="pd" style="background:var(${cvar})"></span>${label}</span>`).join("");
  return `<div class="sect"><h2>Call Outcome Breakdown</h2>
   ${rows}<div class="oleg">${legend}</div></div>`;
}

// Idle = tracked minus productive, straight from the two "HH:MM" strings
// board_payload already carries -- the same figure util_panel.py's email
// card shows ("<b>{total-prod}</b> idle"), just not computed on the board
// (Frank, 2026-09-12: "the utilization cards dont have idle time anymore").
function idleFromHHMM(total, prod) {
  if (!total || !prod) return null;
  const mins = s => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
  const diff = mins(total) - mins(prod);
  if (!Number.isFinite(diff) || diff < 0) return null;
  return `${Math.floor(diff / 60)}h ${String(diff % 60).padStart(2, "0")}m`;
}
function utilizationHtml(d, who) {
  const byName = Object.fromEntries((d.producers || []).map(p => [p.name, p]));
  const focus = who ? byName[who] : null;
  const TI = { green: "tg", yellow: "ty", red: "tr" };
  const tc = (name) => TI[((d.tiers || {})[name] || {})["util"]] || "";
  const list = (focus ? [focus] : (d.producers || [])).filter(p => p.util != null);
  if (!list.length) return "";
  const cards = list.map(p => { const idle = idleFromHHMM(p.util_total, p.util_prod);
    return `<div class="tile">
    <div class="k">${p.name}</div><div class="v ${tc(p.name)}">${p.util}%</div>
    <div class="n">${p.util_prod || "—"} productive / ${p.util_total || "—"} tracked</div>
    ${idle ? `<div class="n">${idle} idle</div>` : ""}</div>`; }).join("");
  const T = d.totals || {};
  const teamCard = focus || T.util == null ? "" : `<div class="tile" style="border-color:var(--border-strong)">
    <div class="k">Team</div><div class="v ${TI[((d.tiers || {})["team"] || {})["util"]] || ""}">${T.util}%</div>
    <div class="n">weighted</div></div>`;
  return `<div class="sect"><h2>Utilization and Efficiency</h2>
   <div class="tiles">${cards}${teamCard}</div></div>`;
}

// Must mirror digest_config.COACH_BAR_RANGES -- team-relative extremes over
// the trailing window, not a share of the 0-800 scale (CLAUDE.md's Coach AI
// section). Not exposed in the JSON payload since it's a fixed, manually-
// curated constant, not per-day data.
const COACH_BAR_RANGES = { "Avg Call Score": [38, 251], "Avg Sentiment": [11, 43], "Role Play": [58, 87] };
function coachQualityHtml(d, who) {
  const byName = Object.fromEntries((d.producers || []).map(p => [p.name, p]));
  const focus = who ? byName[who] : null;
  const list = (focus ? [focus] : (d.producers || []))
    .filter(p => p.coach && (p.coach.calls || p.coach.score || p.coach.roleplay));
  if (!list.length) return "";
  const bar = (color, label, val) => {
    const [lo, hi] = COACH_BAR_RANGES[label];
    const pct = hi > lo ? Math.max(0, Math.min(100, (val - lo) / (hi - lo) * 100)) : 0;
    return `<div class="sbar"><div class="sbl">${label}</div>
      <div class="ptrack"><div class="pfill" style="width:${pct.toFixed(2)}%;background:${color}"></div></div>
      <div class="sbv">${val ?? "—"}</div></div>`;
  };
  const cards = list.map(p => { const c = p.coach; const color = DOT[p.name] || "#8a877f";
    return `<div class="tile" style="text-align:left">
    <div class="who" style="margin-bottom:8px">${pbadge(color, p.name.split(" ")[0])}</div>
    ${bar(color, "Avg Call Score", c.score || 0)}
    ${bar(color, "Avg Sentiment", c.sentiment || 0)}
    ${bar(color, "Role Play", c.roleplay || 0)}
    </div>`; }).join("");
  return `<div class="sect"><h2>Coaching &amp; Call Quality</h2>
   <p class="sd">Coach AI (TRAQ). Avg Call Score and Avg Sentiment are excluded from the leaderboard — TRAQ
   scores a voicemail as a call (~3 against a live call's ~292), so both track who answered more than how
   the call went.</p>
   <div class="tiles" style="grid-template-columns:repeat(auto-fill,minmax(210px,1fr))">${cards}</div></div>`;
}

function speedPanel(d, who) {
  const s = d.speed_to_dial;
  if (!s) return `<div class="sect"><h2>Speed to Dial</h2>
    <p class="sd">No internet leads were assigned today, so there is nothing to time.</p></div>`;
  const entries = who ? Object.entries(s.per || {}).filter(([n]) => n === who) : Object.entries(s.per || {});
  const cards = entries.map(([n, v]) => `
    <div class="tile"><div class="k">${pbadge(DOT[n] || "#8a877f", n.split(" ")[0])}</div>
      <div class="v">${hhmm(v.median)}</div>
      <div class="n">median · ${v.n} lead${v.n > 1 ? "s" : ""}</div>
      <div class="n" style="margin-top:5px">quickest ${hhmm(v.quickest)} · longest ${hhmm(v.longest)}</div></div>`).join("")
   + (!who && s.team ? `<div class="tile" style="border-color:var(--border-strong);background:var(--surface)">
      <div class="k">Team</div><div class="v">${hhmm(s.team.median)}</div>
      <div class="n">median of all ${s.team.n} leads</div>
      <div class="n" style="margin-top:5px">quickest ${hhmm(s.team.quickest)} · longest ${hhmm(s.team.longest)}</div></div>` : "");
  if (who && !cards) return `<div class="sect"><h2>Speed to Dial</h2>

  return `<div class="sect"><h2>Speed to Dial</h2>
    <p class="sd">${s.note || ""} Producers with no internet leads are not shown.</p>
    <div class="tiles">${cards}</div></div>`;
}

function recontactPanel(d, who) {
  const all = ((d.recontact || {}).at_risk || []).filter(r => !who || r.producer === who);
  const rows = all.slice(0, 14).map(r => `<tr>

    <td><span class="who">${pbadge(DOT[r.producer] || "#8a877f", (r.producer || "").split(" ")[0])}</span></td>

  if (!n) return "";
  return `<div class="sect"><h2>Recontact Struggle</h2>
   <p class="sd">${n} lead${n === 1 ? "" : "s"} sitting in a stage longer than the work put into them justifies.

   <div class="scroll"><table><thead><tr><th>Lead</th><th>Producer</th><th>Stage</th><th class="num">Days in stage</th>
   <th class="num">Dials</th><th>Flag</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;

// Mirrors task_audit.py's own docstring/build() -- these five labels replace
// an older, stale set that no longer matched what buckets a-e actually mean
// (found while adding the drill-down below, Frank, 2026-09-15: "why do i not
// have a dropdown to show me the exact tasks it is reading"). panels.py's
// task_audit_tables() is the email's own correct rendering of this same
// data; the column sets and cell logic below are ported from it so the board
// and the email never disagree on what a bucket contains.
const TASK_AUDIT_LABELS = {
  a: "Completed on the strength of a call that is not in the call log",
  b: "Closed noticeably after the due date",
  c: "Due date was changed",
  d: "Cancelled rather than completed",
  e: "Still open at the end of the day",
};
const AZ_URL = { lead: "https://app.agencyzoom.com/lead?id=", customer: "https://app.agencyzoom.com/customer?id=" };
function fmtPhone(e164) {
  const digits = String(e164 || "").replace(/\D/g, "").slice(-10);
  return digits.length === 10 ? `(${digits.slice(0, 3)}) ${digits.slice(3, 6)}-${digits.slice(6)}` : (e164 || "—");
}
function auditRecordCell(r) {
  const name = r.record || "—";
  const kindNote = r.link_kind ? `<div class="n">${r.link_kind}</div>` : "";
  if (!r.link_kind || !r.link_id) return `${name}${kindNote}`;
  return `<a href="${AZ_URL[r.link_kind]}${encodeURIComponent(r.link_id)}" target="_blank" rel="noopener">${name}</a>${kindNote}`;
}
function auditColumns(bucket, list) {
  if (bucket === "a") return {
    head: ["Rep", "Lead", "Task", "Comment", "Number on file"],
    body: list.map(r => `<tr><td>${r.producer || ""}</td><td>${auditRecordCell(r)}</td><td>${r.title || ""}</td>
      <td>${r.comment || "—"}</td><td>${fmtPhone(r.number)}</td></tr>`).join(""),
  };
  if (bucket === "b") return {
    head: ["Rep", "Lead", "Task", "Due", "Completed", "Days late"],
    body: list.map(r => `<tr><td>${r.producer || ""}</td><td>${auditRecordCell(r)}</td><td>${r.title || ""}</td>
      <td class="num">${r.due || ""}</td><td class="num">${r.completed || ""}</td><td class="num">${r.days_late ?? ""}</td></tr>`).join(""),
  };
  if (bucket === "c") return {
    head: ["Rep", "Lead", "Task", "Created", "Last modified", "Due"],
    body: list.map(r => `<tr><td>${r.producer || ""}</td><td>${auditRecordCell(r)}</td><td>${r.title || ""}</td>
      <td>${(r.created || "").slice(0, 10)}</td><td>${(r.modified || "").slice(0, 10)}</td><td>${r.due || ""}</td></tr>`).join(""),
  };
  if (bucket === "d") {
    const activity = r => (r.activity && r.activity.length) ? r.activity.join(", ")
      : r.call_on_record === "yes" ? "call" : r.call_on_record === "no number" ? "no number on file" : "none";
    const why = r => r.loss_reason || ((r.inbound || [])[0] && `Lead replied: "${r.inbound[0]}"`)
      || (r.move_comment && `Producer: "${r.move_comment}"`) || (r.comment || "—");
    const verdict = r => r.verdict === "excused" ? "excused — smart-cycled that day" : "counts";
    return {
      head: ["Rep", "Lead", "Task", "Activity that day", "Why / instruction", "Counts?"],
      body: list.map(r => `<tr><td>${r.producer || ""}</td><td>${auditRecordCell(r)}</td><td>${r.title || ""}</td>
        <td>${activity(r)}</td><td>${why(r)}</td><td>${verdict(r)}</td></tr>`).join(""),
    };
  }
  // e -- still open at day's end
  return {
    head: ["Rep", "Lead", "Task", "Due", "Comment"],
    body: list.map(r => `<tr><td>${r.producer || ""}</td><td>${auditRecordCell(r)}</td><td>${r.title || ""}</td>
      <td>${r.due || ""}</td><td>${r.comment || "—"}</td></tr>`).join(""),
  };
}
function auditPanel(d, who) {
  const ta = d.task_audit || {};
  const buckets = ta.buckets || {};
  const sections = Object.keys(TASK_AUDIT_LABELS).map(k => {
    const cached = (ta.rows || {})[k] || [];
    const list = who ? cached.filter(r => r.producer === who) : cached;
    // Team-wide, the true count can exceed what got cached (board_payload.py
    // caps each bucket's stored rows at 25) -- show the real total in the
    // summary line even when the table beneath it can only list 25.
    const total = who ? list.length : (buckets[k] ?? list.length);
    if (!total) return "";
    const truncated = !who && buckets[k] != null && buckets[k] > cached.length;
    const { head, body } = auditColumns(k, list);
    return `<details class="sc"><summary><span>(${k}) ${TASK_AUDIT_LABELS[k]} — ${total} found</span></summary>
      <div class="scb">${truncated ? `<p class="sd">Showing the ${cached.length} cached for this day; ${total} total.</p>` : ""}
      <div class="scroll"><table><thead><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr></thead>
      <tbody>${body}</tbody></table></div></div></details>`;
  }).join("");
  if (!sections) return "";
  return `<div class="sect"><h2>Task Completion Audit</h2>${sections}</div>`;
}

// True when `cur` was not a finalized days/<day>.json but a fallback from
// intraday.py's latest checkpoint (see loadDay) -- the WHOLE report renders
// from that same document (board_payload.build()'s shape is identical
// either way), so this only has to gate a small "still updating" indicator,
// not a second, separate set of numbers (Frank, 2026-09-12: the old "So far
// today" box duplicated the totals row and, worse, froze forever at
// whatever intraday.py last wrote before a day finalized -- once the
// pull_sources() staleness bug hit a checkpoint, that box showed the same
// stale reading on every later visit to that day, since nothing ever
// rewrites intraday/<day>.json after finalization).
let curLive = false;

/** One slim line above the report when it's still today's in-progress
 * snapshot, not the finalized build -- last-checkpoint time plus any
 * tripped sanity_gate.py flags. Team-level only (Frank's board, not a
 * per-producer breakdown), so it's gated the same way winsLossesHtml() is:
 * skip entirely on a producer filter. */
function liveBannerHtml(d, who) {
  if (who || !curLive) return "";
  const asOf = d.as_of ?
    new Date(d.as_of).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "";
  const flags = d.flags || [];
  // d.pace (0-1, board_payload.build()'s live-only fraction of the business
  // day elapsed) is what Dials/Households Quoted are coloured against right
  // now instead of the full-day goal -- shown here so the colour makes sense.
  const paceNote = d.pace != null ? `, ${Math.round(d.pace * 100)}% through the business day` : "";
  return `<div class="livebanner">
    <div>Live${asOf ? ` — last checkpoint ${asOf}` : ""}${paceNote}, still updating through the day. Tonight's build finalizes it.</div>
    ${flags.length ? `<div class="liveflags">${flags.map(f => `<div class="liveflag">${f}</div>`).join("")}</div>` : ""}
  </div>`;
}

function digestPanel(d, who) {
  // Two-column card layout below the leaderboard, matching the email's own
  // template/report_template.html two-col-table (Frank, 2026-09-12: "the
  // digest was side by side after the leaderboard... it threw the order off
  // and i dont like the one by one"). Grouping by kind (an earlier pass at
  // this split) still read as visibly uneven -- turned out to be TWO
  // separate problems, not one:
  //
  // (1) The .digestgrid columns were never actually equal width. A bare
  // `1fr 1fr` lets a track's automatic minimum size default to its
  // content's min-content width, and .scroll table's own `min-width:640px`
  // was winning that fight -- measured 642px vs 410px for what should have
  // been two 526px columns. Fixed in .digestgrid itself with
  // `minmax(0, 1fr)`; .scroll's own overflow-x:auto still covers a table
  // wider than its now-genuinely-equal column, same as it already does
  // everywhere else in this file.
  //
  // (2) Once the columns were actually 526px each, which panels go where
  // still matters: Coaching & Call Quality's cards are the tallest thing in
  // this grid by a wide margin. Measured with Playwright against realistic
  // 5-producer data at a true 526px column width: Task Completion Rate
  // 339px, Call Outcome Breakdown 333px, Speed to Dial 193px, Utilization
  // 360px, Coaching & Call Quality 508px. {Task Completion, Outcome
  // Breakdown, Speed to Dial} vs {Utilization, Coaching & Call Quality}
  // comes out to 884px vs 868px -- the closest 2-way split of the five, and
  // the rendered page now confirms it: 908px vs 884px, 24px apart. Task
  // Completion and Outcome Breakdown swapped order within this same left
  // column (Frank, 2026-09-15: "i want the task completion box under the
  // live contact detail box") -- both panels stay in this column either
  // way, so the column's total height (and the balance above) is
  // unaffected by which one renders first.
  //
  // Recontact Struggle is OUT for now, not deleted -- Frank, 2026-09-12:
  // "remove ... until i come up with something better" -- recontactPanel()
  // itself is untouched, just not called here. Task Completion Audit stays
  // full-width, last -- it's the OTHER, ops-only email's content, not part
  // of the Sales Digest proper. The live banner, if any, sits above all of
  // it -- it's about right now, not last night.
  // Household Completion (Frank, 2026-09-24) sits in this column too, right
  // after Utilization -- same small-tile-row shape, so it reads as one more
  // card in that family rather than a new kind of section.
  return `${liveBannerHtml(d, who)}
  ${digestDay(d, who)}
  <div class="digestgrid">
    <div>${outcomeBreakdownHtml(d, who)}${taskCompletionHtml(d, who)}${speedPanel(d, who)}</div>
    <div>${utilizationHtml(d, who)}${householdCompletionHtml(d, who)}${coachQualityHtml(d, who)}</div>
  </div>
  ${auditPanel(d, who)}`;
}

/* ---- Range aggregates (This Week / MTD / YTD / Folio / Custom) ------------
   Digest and Coaching both render the SAME merged document a range resolves
   to (see mergeDayDocs above and ensureCurForRange below, near paint()) --
   there is no separate, thinner aggregate renderer to keep in sync with the
   real one, and no tab-specific "not supported" gate any more (Frank,

/* ---- date helpers: Arizona is always UTC-7, never DST --------------------- */
function azTodayDate() {
  // Deliberately ignores the viewer's own device timezone. The old formula
  // (now.getTime() + now.getTimezoneOffset()*60000 - 7*3600000) only came out
  // right when the viewer's device was set to UTC+0 -- getTime() is already
  // an absolute instant, so adding the device's own offset just mis-shifts
  // it by that amount for everyone else. For a device actually set to
  // Arizona (offset +420, no DST) the two terms cancel exactly, so it
  // returned the raw instant unshifted -- correct only until the true UTC
  // calendar day rolls over while Arizona's hasn't (any time from 5pm to
  // midnight AZ), at which point it silently returned TOMORROW's date.
  // Arizona is always UTC-7, never DST -- shift the absolute instant
  // directly and nothing about the viewer's own clock matters.
  return new Date(Date.now() - 7 * 3600000);
}
function isoDate(d) { return d.toISOString().slice(0, 10); }
function addDays(iso, n) { const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return isoDate(d); }
function fmtShortDate(iso) {

}
// M-D-YY, no leading zeros (Frank, 2026-09-15: "i want my date format to
// just be M-D-YY") -- the Sales Sheet's own displayed Date Sold/Effective
// Date cells; the <input type="date"> pickers that write these values
// still store/show plain ISO internally, since that's the browser's own
// format for that control, not something this page renders.
function fmtMDY(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || "");
  return m ? `${+m[2]}-${+m[3]}-${m[1].slice(2)}` : (iso || "");
}
function weekStart(iso) { const d = new Date(iso + "T12:00:00Z"); return addDays(iso, -d.getUTCDay()); }

// Monday-anchored, distinct from weekStart()'s Sunday-anchored week used for
// This Week/Custom range. Role Play's weak-spot window refreshes every
// Monday to the 4 weeks that just closed (Mon-Sun x4), not a rolling 28
// days from today -- so it stays fixed all week rather than shrinking daily.
function mostRecentMonday(iso) {
  const d = new Date(iso + "T12:00:00Z");
  const sinceMonday = (d.getUTCDay() + 6) % 7;   // Mon=0 ... Sun=6
  return addDays(iso, -sinceMonday);
}

  const monday = mostRecentMonday(isoDate(azTodayDate()));
  return { start: addDays(monday, -28), end: addDays(monday, -1) };
}

/* Fetch every day in [from, to] that actually has a report (checked against
   DAYS, the /api/days list), then aggregate. Used for This Week and Custom
   range -- there is no precomputed rollup for an arbitrary span. */
async function fetchRangeDocs(from, to) {
  const wanted = DAYS.filter(d => d >= from && d <= to);
  const docs = [];
  for (const d of wanted) {
    try {
      const r = await fetch(`/api/days/${d}`, { cache: "no-store" });
      if (r.ok) docs.push(await r.json());
    } catch (_) {}
  }
  return docs;
}

function hhmmToSecs(s) {
  if (!s) return 0;
  const [h, m] = String(s).split(":").map(Number);
  return (h || 0) * 3600 + (m || 0) * 60;
}
function secsToHHMM(s) {

/* Merges N full single-day documents (the exact shape /api/days/:day
   returns) into one document of the SAME shape, so every existing
   per-day renderer (digestPanel, coachingPanel, and everything they call)
   works unmodified on a date range too (Frank, 2026-09-15: "i want the
   whole digest filtered to those days, and coaching cards to those
   days") -- no separate, thinner aggregate renderer that could drift
   from what a single day actually shows.

   Tiers ARE recomputed for the range (Frank, 2026-09-15: "rates and
   percentages should stay the same, and the quantity stats should be
   tiered by multiplying the daily goal by the number of BUSINESS days
   being filtered") -- see rangeProducerTiers/rangeTeamTiers just below,
   a straight JS mirror of digest_config.THRESHOLDS/tier() and
   board_payload._producer_tiers/_team_tiers. Still OMITTED: leaderboard.
   order/points and policy_streak coloring, which aren't goal thresholds
   at all -- one's a ranked-points system, the other a day-to-day sale
   streak -- and have no meaning stretched across a range. Every renderer
   that reads them already degrades gracefully without them:
   teamLeaderboardHtml falls back to producers[] order with no podium/
   medals, and polTitle() falls back to "no sale on record" -- confirmed
   by reading each one, not assumed.

   Talk time, utilization and Coach AI score/sentiment are all reweighted
   from the underlying totals (seconds, call counts), not averaged day to
   day, for the same reason CLAUDE.md's month/folio rollups already do
   this server-side: a 3-call day and a 60-call day are not equally
   informative. Speed to Dial's median is recombined EXACTLY, not
   averaged -- each day's speed_to_dial.per[name] already carries the raw
   per-lead response seconds (`.secs`), not just its own median, so this
   pools every lead's own number across the whole range and recomputes one
   real median from it, the same as the single-day figure would if every
   lead in the range had been dialled on one day. An older cached day built
   before `.secs` existed falls back to standing that day's own median in
   as a single sample rather than dropping it. */
function median(arr) {
  if (!arr.length) return 0;
  const s = [...arr].sort((a, b) => a - b);
  const mid = Math.floor(s.length / 2);
  return s.length % 2 ? s[mid] : Math.round((s[mid - 1] + s[mid]) / 2);
}

// Mirrors digest_config.THRESHOLDS/tier()/TEAM_SCALE -- update this in
// lockstep if that file's copy ever changes, same obligation
// COACH_BAR_RANGES above already carries. speed_to_dial_min is omitted:
// nothing renders a tier off Speed to Dial today. Policies/Premium Sold on a
// single DAY colour on the sale streak instead (apply_policy_streak,
// day-relative -- a streak has no meaning over a range), but a range uses
// policy_count/premium_sold_per_policy same as the team always does
// (Frank, 2026-09-15: "when filtered to a range of days, it should follow
// the per policy tiering").
const THRESHOLDS = {
  call_volume: { green: 50, yellow: 40 },
  avg_talk_min: { green: 7, yellow: 3 },
  contact_rate_pct: { green: 13, yellow: 10 },
  households_quoted: { green: 5, yellow: 2 },
  premium_quoted_per_hh: { green: 900, yellow: 501 },
  premium_sold_per_policy: { green: 900, yellow: 501 },
  policy_count: { green: 4, yellow: 1 },
  task_completion_pct: { green: 100, yellow: 90 },
  utilization_pct: { green: 85, yellow: 80 },
  roleplay_score: { green: 80, yellow: 0 },
};
const TEAM_SCALE = 5; // digest_config.TEAM_SCALE == len(PRODUCERS)
function tierColor(metric, value) {
  const t = THRESHOLDS[metric];
  if (value == null) return "red";
  if (metric === "task_completion_pct") return value >= 100 ? "green" : value >= t.yellow ? "yellow" : "red";
  return value >= t.green ? "green" : value >= t.yellow ? "yellow" : "red";
}
// `businessDays` scales the goal for the two straight-COUNT metrics (call

// it's the same goal whether the range is one day or thirty.
function rangeProducerTiers(p, businessDays) {
  const hh = p.hh || 0;
  const pol = p.pol || 0;
  const pqPer = hh ? (p.pq || 0) / hh : 0;
  const polTier = tierColor("policy_count", pol);
  const out = {
    dials: tierColor("call_volume", (p.dials || 0) / businessDays),
    talk: tierColor("avg_talk_min", (p.talk || 0) / 60),
    rate: tierColor("contact_rate_pct", p.rate || 0),
    hh: tierColor("households_quoted", hh / businessDays),
    pq: tierColor("premium_quoted_per_hh", pqPer),
    pol: polTier,
    ps: p.ps ? tierColor("premium_sold_per_policy", p.ps / pol) : polTier,
  };
  if (p.util != null) out.util = tierColor("utilization_pct", p.util);
  out.roleplay = tierColor("roleplay_score", (p.coach || {}).roleplay || null);
  const tp = (p.tasks || {}).pct;

  return out;
}
function rangeTeamTiers(totals, businessDays) {
  const scale = TEAM_SCALE * businessDays;

  const pol = totals.pol || 0;
  const pqPer = hh ? (totals.pq || 0) / hh : 0;
  const polTier = tierColor("policy_count", pol);
  const out = {
    dials: tierColor("call_volume", (totals.dials || 0) / scale),
    talk: tierColor("avg_talk_min", (totals.talk || 0) / 60),
    rate: tierColor("contact_rate_pct", totals.rate || 0),
    hh: tierColor("households_quoted", hh / scale),
    pq: tierColor("premium_quoted_per_hh", pqPer),
    pol: polTier,
    ps: totals.ps ? tierColor("premium_sold_per_policy", totals.ps / pol) : polTier,
  };
  if (totals.util != null) out.util = tierColor("utilization_pct", totals.util);
  out.roleplay = tierColor("roleplay_score", totals.roleplay || null);

function mergeDayDocs(docs) {
  const NUM = ["dials", "live", "hh", "pq", "ps", "pol"];
  const totals = Object.fromEntries(NUM.map(k => [k, 0]));
  const taskTotals = { total: 0, completed: 0 };
  let teamUtilTotalSecs = 0, teamUtilProdSecs = 0;
  const per = {};
  const outcomes = {};
  const taskBuckets = {};
  const taskRows = {};
  const objcats = {};
  const scan = { of: 0, asked_open: 0, assumed_open: 0, priced: 0, closed: 0, premium: 0, xdate: 0, bundle: 0, timeset: 0 };
  let hasScan = false;
  const speedPer = {};   // name -> pooled raw per-lead response seconds across every day
  let speedNote = "";
  const calls = [];
  const notcoached = [];
  const days = [];

  for (const doc of docs) {
    if (!doc) continue;
    days.push(doc.date);
    const t = doc.totals || {};
    for (const k of NUM) totals[k] += t[k] || 0;
    if (t.tasks) { taskTotals.total += t.tasks.total || 0; taskTotals.completed += t.tasks.completed || 0; }

    for (const p of doc.producers || []) {
      const row = per[p.name] || (per[p.name] = {
        name: p.name, days: 0, talk_secs: 0, util_total_secs: 0, util_prod_secs: 0,
        coach_calls: 0, coach_score_wsum: 0, coach_sentiment_wsum: 0, coach_roleplay_sum: 0, coach_roleplay_n: 0,
        tasks: { total: 0, completed: 0 }, ...Object.fromEntries(NUM.map(k => [k, 0])),
      });
      for (const k of NUM) row[k] += p[k] || 0;
      row.days += 1;
      row.talk_secs += (p.talk || 0) * (p.live || 0);
      // util_prod can be set on a day whose util_total is null (real data:
      // Insightful didn't cleanly report total tracked time that day, e.g.
      // 2026-09-01/02 for Mike Olvera) -- summing prod seconds from every
      // day while only summing total seconds from days that HAVE one
      // inflates the ratio past 100%. Only fold in a day where both halves
      // of the same fraction are actually known.
      if (p.util != null && p.util_total) {
        const tSecs = hhmmToSecs(p.util_total), pSecs = hhmmToSecs(p.util_prod);
        row.util_total_secs += tSecs; row.util_prod_secs += pSecs;
        teamUtilTotalSecs += tSecs; teamUtilProdSecs += pSecs;
      }
      if (p.tasks) { row.tasks.total += p.tasks.total || 0; row.tasks.completed += p.tasks.completed || 0; }
      if (p.coach) {
        const c = p.coach;
        row.coach_calls += c.calls || 0;
        row.coach_score_wsum += (c.score || 0) * (c.calls || 0);
        row.coach_sentiment_wsum += (c.sentiment || 0) * (c.calls || 0);
        if (c.roleplay) { row.coach_roleplay_sum += c.roleplay; row.coach_roleplay_n++; }
      }
    }

    for (const [name, segs] of Object.entries(doc.outcomes || {})) {
      const row = outcomes[name] || (outcomes[name] = {});
      for (const [seg, n] of Object.entries(segs || {})) row[seg] = (row[seg] || 0) + n;
    }

    const ta = doc.task_audit || {};
    for (const [k, n] of Object.entries(ta.buckets || {})) taskBuckets[k] = (taskBuckets[k] || 0) + n;
    for (const [k, rows] of Object.entries(ta.rows || {})) taskRows[k] = (taskRows[k] || []).concat(rows || []);

    for (const [cat, n, w] of doc.objcats || []) {
      const row = objcats[cat] || (objcats[cat] = [cat, 0, 0]);
      row[1] += n || 0; row[2] += w || 0;
    }

    if (doc.scan) {
      hasScan = true;
      for (const k of Object.keys(scan)) scan[k] += doc.scan[k] || 0;
    }

    const s = doc.speed_to_dial;
    if (s) {
      speedNote = s.note || speedNote;
      for (const [name, v] of Object.entries(s.per || {})) {
        const row = speedPer[name] || (speedPer[name] = []);
        if (v.secs && v.secs.length) row.push(...v.secs);
        else if (v.n) row.push(v.median);
      }
    }

    for (const c of doc.calls || []) calls.push(c);
    if (doc.notcoached) notcoached.push(`${doc.date}: ${doc.notcoached}`);
  }

  for (const row of Object.values(per)) {
    row.rate = row.dials ? Math.round(1000 * row.live / row.dials) / 10 : 0;
    row.talk = row.live ? Math.round(row.talk_secs / row.live) : 0;
    delete row.talk_secs;
    if (row.util_total_secs) {
      row.util = Math.round(1000 * row.util_prod_secs / row.util_total_secs) / 10;
      row.util_total = secsToHHMM(row.util_total_secs);
      row.util_prod = secsToHHMM(row.util_prod_secs);
    }
    delete row.util_total_secs; delete row.util_prod_secs;
    if (row.tasks.total) row.tasks.pct = Math.round(1000 * row.tasks.completed / row.tasks.total) / 10;
    if (row.coach_calls) {
      row.coach = {
        calls: row.coach_calls,
        score: Math.round(row.coach_score_wsum / row.coach_calls),
        sentiment: Math.round(row.coach_sentiment_wsum / row.coach_calls),
        roleplay: row.coach_roleplay_n ? Math.round(row.coach_roleplay_sum / row.coach_roleplay_n) : null,
      };
    }
    delete row.coach_calls; delete row.coach_score_wsum; delete row.coach_sentiment_wsum;
    delete row.coach_roleplay_sum; delete row.coach_roleplay_n;
  }

  totals.rate = totals.dials ? Math.round(1000 * totals.live / totals.dials) / 10 : 0;
  if (taskTotals.total) taskTotals.pct = Math.round(1000 * taskTotals.completed / taskTotals.total) / 10;
  if (teamUtilTotalSecs) totals.util = Math.round(1000 * teamUtilProdSecs / teamUtilTotalSecs) / 10;

  const speedToDial = Object.keys(speedPer).length ? {
    note: speedNote,
    per: Object.fromEntries(Object.entries(speedPer).map(([name, secsArr]) => [name, {
      median: median(secsArr), n: secsArr.length, quickest: Math.min(...secsArr), longest: Math.max(...secsArr),
    }])),
    team: (() => {
      const all = Object.values(speedPer).flat();
      return all.length ? { median: median(all), n: all.length, quickest: Math.min(...all), longest: Math.max(...all) } : null;
    })(),
  } : null;

  calls.sort((a, b) => (b.day || "").localeCompare(a.day || ""));

  const finalProducers = Object.values(per).sort((a, b) => b.ps - a.ps);
  // Team Avg Talk Time/Role Play, same reweighting board_payload.py's own
  // _team_tiers() does -- talk weighted by live contacts, role play averaged
  // across producers who actually recorded one (Frank, 2026-09-15: "why no
  // avg talk time or avg role play for the team").
  const teamLive = finalProducers.reduce((s, p) => s + (p.live || 0), 0);
  const teamTalkSecs = finalProducers.reduce((s, p) => s + (p.talk || 0) * (p.live || 0), 0);
  const recordedRp = finalProducers.map(p => (p.coach || {}).roleplay).filter(Boolean);
  const finalTotals = {
    ...totals,
    talk: teamLive ? Math.floor(teamTalkSecs / teamLive) : 0,
    roleplay: recordedRp.length ? recordedRp.reduce((a, b) => a + b, 0) / recordedRp.length : null,
    tasks: taskTotals.total ? taskTotals : null,
  };
  const businessDays = days.filter(Boolean).length;
  const tiers = businessDays ? Object.fromEntries(finalProducers.map(p => [p.name, rangeProducerTiers(p, businessDays)])) : {};
  if (businessDays) tiers.team = rangeTeamTiers(finalTotals, businessDays);

  return {
    date: null, days: days.filter(Boolean),
    totals: finalTotals,
    producers: finalProducers,
    outcomes, task_audit: { buckets: taskBuckets, rows: taskRows },
    objcats: Object.values(objcats), scan: hasScan ? scan : null,
    speed_to_dial: speedToDial, calls, tiers,
    notcoached: notcoached.join("; ") || null,
  };
}

function folioStartFor(end) {
  const i = FOLIO_CLOSE_DATES.indexOf(end);

/* Cross-day objection index -- every objection any coached call raised

  // Collapsed by default -- the whole header (the box with the left accent
  // strip) is a <summary>, so clicking anywhere on it expands the rest of
  // the card natively; clicking again collapses it (Frank, 2026-09-10).
  // "call back"/"call in" sits right after the name, and the talk-time
  // split (not just the total) shows in the meta line, matching the old
  // email digest's own Call Detail convention before the move to the board
  // (Frank, 2026-09-15: "it should specify under the clients name if its 2

       ${callRowHtml}</div>

     <div class="sum">${c.summary || ""}</div>

       c.exit && c.exit[0] ? `<span class="flag red" title="${c.exit[1] || ""}">Producer ended the call</span>` : ""}${
       (c.flags || []).map(f => `<span class="flag">${f}</span>`).join("")}</div>` : ""}
   </summary>
   ${c.askq ? `<div class="blk"><div class="bl">The Assumption</div><table class="askt">
     <tr><td class="k">Assumed the quote</td><td class="v">${bdg(c.askq[0])}</td><td>${c.askq[1] || ""}</td></tr>
     <tr><td class="k">Assumed the sale</td><td class="v">${bdg((c.asks || [])[0])}</td><td>${(c.asks || [])[1] || ""}</td></tr>${
     // Inverted on purpose: "yes" here is the red flag (Frank, 2026-09-23).
     c.exit ? `<tr><td class="k">Ended the call themselves</td><td class="v">${c.exit[0]
       ? `<span class="chip c-r">yes</span>` : `<span class="chip c-g">no</span>`}</td><td>${c.exit[1] || ""}</td></tr>` : ""}</table>
     ${c.askfix ? `<div class="fix"><span class="fixl">What assumptive sounds like</span>${c.askfix}</div>` : ""}
   </div>` : ""}
   ${objBlk}
   <div class="blk"><div class="bl">Strengths and gaps</div><div class="two">
     <div><div class="colh g">What worked</div><ul class="gl g">${(c.good || []).map(([t, dd]) => `<li><b>${t}</b>${dd}</li>`).join("") || `<li style="color:var(--text-muted)">—</li>`}</ul></div>
     <div><div class="colh b">What cost the sale</div><ul class="gl b">${(c.bad || []).map(([t, dd]) => `<li><b>${t}</b>${dd}</li>`).join("") || `<li style="color:var(--text-muted);padding-left:0">Nothing to flag on this call.</li>`}</ul></div>
   </div>${scorecard(c.score)}${scorecard(c.techniques, TECH_DIMS, "Sales techniques")}</div>

// Listen to the actual call and/or read what it transcribed to, right on the
// card that coached it (Frank, 2026-09-14) -- both were already sitting in
// R2 (call_summary.py never deletes a day's recordings), just never served
// anywhere before this. A day built before recording_ids existed shows
// nothing here rather than a broken player.
// Breaks the flat transcript into readable turns instead of one wall of
// text (Frank, 2026-09-15: "the transcript should also be broken down by
// speaker, not one super long paragraph, thats unreadable"). Whisper marks
// a speaker change with ">>" when it hears one (see transcribe.py's own
// DIALOGUE regex) -- that only says a turn changed, never WHO is now
// talking, so this alternates a background tint per turn rather than
// guessing "Producer"/"Customer" and risking a confidently wrong label.
// "[Call N of M ...]" tags from a combined card (coaching_cards.
// _group_transcript) are pulled out as their own small headers first, so
// splitting on ">>" never eats one.
function transcriptHtml(text) {
  if (!text) return "";
  const callBlocks = text.split(/\n\n(?=\[Call \d+ of \d+)/);
  return callBlocks.map(block => {
    const m = block.match(/^(\[Call \d+ of \d+[^\]]*\])\n([\s\S]*)$/);
    const tag = m ? `<div class="ttag">${m[1]}</div>` : "";
    const body = m ? m[2] : block;
    const turns = body.split(/\s*>>\s*/).map(t => t.trim()).filter(Boolean);
    return tag + turns.map((t, i) => `<p class="tturn t${i % 2}">${t}</p>`).join("");
  }).join("");
}
function recordingBlk(c) {
  if (!c.transcript && !(c.recording_ids && c.recording_ids.length)) return "";
  const players = (c.recording_ids || []).map((id, i) => `
    <audio controls preload="none" style="width:100%;margin-top:${i ? "8" : "0"}px" src="/api/recordings/${c.day}/${id}"></audio>`).join("");
  const tx = c.transcript ? `<details class="sc" style="margin-top:${players ? "10" : "0"}px">
    <summary><span>Transcript</span></summary>
    <div class="scb" style="font-size:12px;padding:10px 2px">${transcriptHtml(c.transcript)}</div>
  </details>` : "";
  return `<div class="blk"><div class="bl">Recording &amp; transcript</div>${players}${tx}</div>`;
}
