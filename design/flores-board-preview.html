<title>Flores Board Preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one shell (menu + sticky search bar + 1600px column) for every view. Digest = sand dashboard cards; The Flores Post = the same palette and faces set as a broadsheet with ink rules. */
:root{
  --sand:#f3e9dc; --card:#fffaf3; --card2:#f8efe4; --chip:#e8dac9; --ink:#2a2320; --muted:#6e5f53; --soft:#a8998c;
  --clay:#b5532f; --clay-d:#8a2b12; --sag:#3e6b4f; --line:#efe3d4; --rule:#d9c8b4;
  --live:#1fbf5c; --live-t:#177a3d; --good:#2f6b43; --bad:#a80000; --warn:#b57800;
  --display:'DM Serif Display',Georgia,serif; --body:Manrope,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--sand);color:var(--ink);font-family:var(--body);font-variant-numeric:tabular-nums}
a{color:inherit}
:focus-visible{outline:3px solid var(--clay);outline-offset:2px}
.shell{display:flex;min-height:100vh}
.side{width:230px;flex:none;background:var(--ink);color:var(--sand);padding:22px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;align-self:flex-start;height:100vh;overflow:auto}
.brand{font-family:var(--display);font-size:26px;line-height:1;padding:0 8px}.brand span{color:#e59a6f}
.grp{display:flex;flex-direction:column;gap:2px}
.grp h4{margin:0 0 6px;padding:0 10px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);font-weight:600}
.grp a,.grp button{display:block;text-align:left;width:100%;border:0;background:none;font:inherit;padding:9px 10px;border-radius:10px;text-decoration:none;color:#e9ddd0;font-size:14px;cursor:pointer}
.grp .top{background:#3a302b;color:#fff;font-weight:700}
.grp .sub{padding-left:24px;color:#c9b8a8;font-size:13px}
.grp .sub[aria-current="page"]{background:var(--clay);color:#fff;font-weight:700}
.wrap{flex:1;min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(243,233,220,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule)}
.barin{max-width:1600px;margin:0 auto;padding:12px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.search{position:relative;flex:0 1 440px;margin-left:auto}
.search label{display:flex;align-items:center;gap:10px;height:42px;border:1px solid var(--rule);border-radius:12px;padding:0 12px;background:var(--card);color:var(--muted)}
.search input{border:0;outline:0;flex:1;min-width:0;font:500 14px var(--body);background:transparent;color:var(--ink)}
.search kbd{font:600 11px var(--body);border:1px solid var(--rule);border-radius:6px;padding:2px 6px;color:var(--muted)}
.results{position:absolute;left:0;right:0;top:48px;background:var(--card);border:1px solid var(--rule);border-radius:14px;box-shadow:0 12px 30px rgba(42,35,32,.15);padding:8px;max-height:420px;overflow:auto}
.results h5{margin:8px 8px 4px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.results button{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;border:0;background:none;font:500 14px var(--body);padding:9px 10px;border-radius:9px;cursor:pointer;color:var(--ink)}
.results button:hover,.results button.sel{background:var(--card2)}
.results button span{color:var(--muted);font-size:13px}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select.pick{font:600 14px var(--body);padding:9px 10px;border-radius:10px;border:1px solid var(--rule);background:var(--card);color:var(--ink)}
.seg{display:flex;gap:3px;background:var(--chip);padding:4px;border-radius:12px;flex-wrap:wrap}
.seg button{border:0;padding:7px 12px;border-radius:9px;background:transparent;font:500 14px var(--body);color:#5e5046;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:700}
.main{width:100%;max-width:1600px;margin:0 auto;padding:24px 24px 60px;display:flex;flex-direction:column;gap:20px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;font-size:13px;background:var(--chip)}
.pill.lv{background:#e6f5ea;color:var(--live-t);font-weight:700}
.pill.fin{background:var(--ink);color:var(--sand);font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:var(--live)}
h1.greet{margin:10px 0 0;font:400 clamp(30px,3.4vw,44px)/1.05 var(--display);text-wrap:balance}
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.tile{background:var(--card);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.tile .k{font-size:13px;font-weight:700;color:var(--muted)}
.tile .v{font:400 38px/1.05 var(--display)}.tile .v.s{font-size:28px}
.tile .n{font-size:12px;color:var(--muted)}
.tile.sold{background:var(--sag);color:#f3efe4}.tile.sold .k,.tile.sold .n{color:#d9e6dc}
@keyframes glow{0%,100%{box-shadow:0 0 0 2px rgba(31,191,92,.35),0 0 12px rgba(31,191,92,.2)}50%{box-shadow:0 0 0 2px rgba(31,191,92,.75),0 0 24px rgba(31,191,92,.45)}}
.islive .glow{animation:glow 2.4s ease-in-out infinite}
.islive .gt{color:var(--live-t);text-shadow:0 0 10px rgba(31,191,92,.4)}
.islive .tile.sold .gt{color:#fff}
@media (prefers-reduced-motion:reduce){.islive .glow{animation:none;box-shadow:0 0 0 2px rgba(31,191,92,.6)}}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.rail{display:flex;flex-direction:column;gap:18px;position:sticky;top:84px}
.card{background:var(--card);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{margin:0;font:400 24px/1.1 var(--display)}
.card h2 em{font-size:16px;color:var(--soft)}
.sd{margin:0;font-size:13px;color:var(--muted)}
.card.dark{background:var(--card);color:var(--ink)}
.hrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.feed a{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);text-decoration:none;font-size:14px}
.feed .t{font-size:12px;color:var(--muted);width:60px;flex:none}
.feed .c{width:9px;height:9px;border-radius:50%;flex:none}
.feed .kd{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.todo{display:flex;flex-direction:column;gap:8px}
.todo a{display:flex;gap:12px;padding:11px 12px;border-radius:12px;background:var(--card2);text-decoration:none}
.todo a.hot{background:#fbe7dc}
.todo .sq{width:10px;height:10px;border-radius:3px;margin-top:5px;flex:none}
.todo b{display:block;font-size:14px}.todo span.s{font-size:13px;color:var(--muted)}
.scroll{overflow-x:auto}
table.lb{width:100%;border-collapse:collapse;font-size:14px;min-width:980px}
table.lb th{font-size:12px;color:var(--muted);text-align:right;font-weight:700;padding:8px 6px;white-space:nowrap}
table.lb td{text-align:right;padding:11px 6px;border-top:1px solid var(--line);white-space:nowrap}
table.lb th:first-child,table.lb td:first-child{text-align:left}
table.lb td.num{cursor:pointer}
table.lb tr.tot td{border-top:2px solid var(--ink);font-weight:800}
.av{width:30px;height:30px;border-radius:50%;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-right:10px;vertical-align:middle}
.medal{font-size:12px;color:var(--clay);margin-left:6px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.bars{display:grid;grid-template-columns:70px 1fr 90px;gap:10px;align-items:center;font-size:14px}
.stackbar{display:flex;height:16px;border-radius:5px;overflow:hidden;gap:2px}
.track{height:12px;border-radius:6px;background:var(--line)}.track>div{height:12px;border-radius:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:#5e5046}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mini>div{border-radius:14px;padding:12px;background:var(--card2)}
.mini .k{font-size:13px;font-weight:700}.mini .v{font-size:24px;font-weight:800}.mini .n{font-size:12px;color:var(--muted)}
.coach{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.coach>div{border-radius:14px;padding:12px;background:var(--card2);display:flex;flex-direction:column;gap:7px}
.cb{display:grid;grid-template-columns:72px 1fr 30px;gap:8px;align-items:center;font-size:12px}
.cb .tr{height:8px;border-radius:4px;background:var(--chip)}.cb .tr>div{height:8px;border-radius:4px}
table.au{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
table.au th{text-align:left;font-size:12px;color:var(--muted);padding:6px}
table.au td{padding:9px 6px;border-top:1px solid var(--line)}
.chip{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--chip);color:#5e5046}
.pipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;font-size:14px}
.pipe>div{padding:12px;border-radius:12px;background:var(--card2)}
.donut{width:70px;height:70px;border-radius:50%;background:conic-gradient(var(--clay) 0 33%,var(--chip) 33% 100%);display:flex;align-items:center;justify-content:center;flex:none}
.donut span{width:50px;height:50px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}

/* ---- The Flores Post: same tokens, broadsheet treatment ---- */
.paper{background:var(--card);border-radius:4px;box-shadow:0 1px 0 var(--rule),0 18px 40px rgba(42,35,32,.08);padding:32px 40px 40px;display:flex;flex-direction:column;gap:26px}
.lab{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mast{border-bottom:3px double var(--ink);padding-bottom:12px;display:flex;flex-direction:column;gap:10px}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.mast h1{margin:0;text-align:center;font:400 clamp(48px,6.5vw,104px)/1 var(--display);letter-spacing:-.01em}
.mast .rule{border-top:1px solid var(--ink);padding-top:8px}
.namepick{display:inline-flex;gap:8px;align-items:center}
.namepick select{font:600 12px var(--body);padding:4px 6px;background:var(--card);color:var(--ink);border:1px solid var(--rule);border-radius:6px}
.g12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:36px;row-gap:24px}
.lead{grid-column:span 5;display:flex;flex-direction:column;gap:12px;border-right:1px solid var(--rule);padding-right:36px}
.lead .eb{color:var(--clay)}
.lead h2{margin:0;font:400 clamp(30px,2.8vw,46px)/1.05 var(--display);text-wrap:balance}
.lead p{margin:0;font-size:17px;line-height:1.6;color:#4a3f38;max-width:62ch}
.ptiles{grid-column:span 7;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--ink)}
.ptiles a{display:block;padding:14px 14px 14px 0;border-bottom:1px solid var(--rule);text-decoration:none}
.ptiles .v{font:400 34px/1.1 var(--display)}.ptiles .n{font-size:14px;color:var(--muted)}
.shead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--ink);padding-bottom:8px}
.shead h3{margin:0;font:400 28px var(--display)}.shead h3 em{font-size:18px;color:var(--muted)}
table.st{width:100%;border-collapse:collapse;font-size:15px;min-width:1000px}
table.st th{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right;padding:6px 4px;white-space:nowrap}
table.st td{text-align:right;padding:11px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
table.st th:first-child,table.st td:first-child{text-align:left}
table.st td.nm{font:400 20px var(--display)}.rk{font-size:13px;font-weight:800;color:var(--clay);margin-right:10px;font-family:var(--body)}
table.st tr.tot td{border-top:2px solid var(--ink);font-weight:800}
.wire{grid-column:span 7;display:flex;flex-direction:column;border-right:1px solid var(--rule);padding-right:36px;min-width:0}
.wire a{display:grid;grid-template-columns:76px 88px 1fr;gap:12px;padding:9px 0;border-bottom:1px dotted var(--rule);text-decoration:none;font-size:15px}
.wire .t{font-size:13px;color:var(--muted)}
.wire .k{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--clay);padding-top:3px}
.carry{grid-column:span 5;display:flex;flex-direction:column;min-width:0}
.carry a{display:flex;gap:12px;padding:10px 0;border-bottom:1px dotted var(--rule);text-decoration:none}
.carry .big{font:400 30px/1 var(--display);color:var(--clay);width:44px;flex:none}
.carry .s{font-size:14px;color:var(--muted)}
.depts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:32px;row-gap:28px;border-top:3px double var(--ink);padding-top:18px}
.depts>section{display:flex;flex-direction:column;gap:6px;min-width:0}
.depts>section+section{border-left:1px solid var(--rule);padding-left:32px}
.depts h3{margin:0 0 4px;font:400 22px var(--display)}
.depts h3.next{margin-top:16px;padding-top:14px;border-top:1px solid var(--rule)}
.ln{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:1px dotted var(--rule);padding:5px 0;font-size:14px}
.ln small{font-size:12px;color:var(--muted)}.ln strong{font:400 19px var(--display)}
.pbar{display:grid;grid-template-columns:58px 1fr 26px;gap:8px;align-items:center;font-size:14px}
.pbar .sb{display:flex;height:12px;gap:1px}
.cr{display:grid;grid-template-columns:64px repeat(3,minmax(0,1fr));gap:6px;border-bottom:1px dotted var(--rule);padding:6px 0;font-size:14px}
.cr .h{font:400 17px var(--display)}.cr small{display:block;font-size:11px;color:var(--muted)}
table.pa{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}
table.pa th{text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 0}
table.pa td{padding:8px 0;border-bottom:1px dotted var(--rule)}
.foot{border-top:3px double var(--ink);padding-top:10px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.press{align-items:flex-start;padding:40px}
.press h2{font-size:34px}
.btn{border:0;border-radius:12px;padding:12px 18px;background:var(--clay);color:#fff;font:700 15px var(--body);cursor:pointer}

@media (max-width:1400px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1200px){.cols{grid-template-columns:1fr}.rail{position:static}.depts{grid-template-columns:repeat(2,minmax(0,1fr))}.depts>section:nth-child(3){border-left:0;padding-left:0}}
@media (max-width:900px){.side{display:none}.two{grid-template-columns:1fr}.pipe{grid-template-columns:repeat(2,minmax(0,1fr))}.lead,.ptiles,.wire,.carry,.aud,.mis{grid-column:1/-1!important;border-right:0!important;border-left:0!important;padding-right:0!important;padding-left:0!important}.paper{padding:24px 20px}.search{flex:1 1 100%;margin-left:0}}
@media (max-width:600px){.tiles,.mini{grid-template-columns:repeat(2,minmax(0,1fr))}.coach,.depts{grid-template-columns:1fr}.depts>section+section{border-left:0;padding-left:0}.ptiles{grid-template-columns:repeat(2,minmax(0,1fr))}.main,.barin{padding-inline:16px}.wire a{grid-template-columns:64px 1fr}.wire .k{display:none}}
</style>
<style>
.tl{display:flex;flex-direction:column;gap:0}
.tlr{display:grid;grid-template-columns:92px minmax(0,1fr) 92px minmax(0,1.3fr);gap:14px;align-items:center;padding:7px 0;border-bottom:1px dotted var(--rule);font-size:14px}
.tlr .d{font-weight:700}.tlr .d small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.tlr .b{height:14px;background:var(--line);border-radius:3px}.tlr .b>div{height:14px;border-radius:3px;background:var(--clay)}
.tlr .m{text-align:right;font:400 18px var(--display)}
.tlr.ahead{color:var(--soft)}.tlr.ahead .b{background:repeating-linear-gradient(135deg,var(--line) 0 6px,transparent 6px 12px)}
.tlr.today .b>div{background:var(--live)}
.wk{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px}
.wk>div{border-top:2px solid var(--ink);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.wk h4{margin:0;font:400 22px var(--display)}.wk p{margin:0;font-size:15px;line-height:1.55;color:#4a3f38}
.xlink{border:1px solid var(--ink);background:transparent;border-radius:999px;padding:6px 12px;font:700 12px var(--body);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;color:var(--ink)}
.xlink:hover{background:var(--ink);color:var(--card)}
@media (max-width:900px){.wk{grid-template-columns:repeat(2,minmax(0,1fr))}.tlr{grid-template-columns:70px 1fr 70px}.tlr .e{grid-column:1/-1}}
@media (max-width:600px){.wk{grid-template-columns:1fr}}
</style>
<style>
.front{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:40px}
.story{display:flex;flex-direction:column;gap:12px;min-width:0}
.story .kick{color:var(--clay)}
.story h2.hl{margin:0;font:400 clamp(34px,3.6vw,58px)/1.02 var(--display);text-wrap:balance}
.story .deck{margin:0;font:italic 400 clamp(19px,1.5vw,23px)/1.35 var(--display);color:#4a3f38;max-width:70ch}
.byline{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:6px 0}
.body{columns:3 240px;column-gap:32px;column-rule:1px solid var(--line);font-size:16px;line-height:1.62;color:#3b322c}
.body p{margin:0 0 12px;break-inside:avoid-column}
.body p:first-child::first-letter{float:left;font:400 58px/.85 var(--display);margin:6px 8px 0 0;color:var(--clay)}
.pull{margin:4px 0;padding:14px 0;border-top:3px solid var(--ink);border-bottom:1px solid var(--ink);font:italic 400 24px/1.3 var(--display)}
.pull cite{display:block;margin-top:8px;font:700 12px var(--body);letter-spacing:.1em;text-transform:uppercase;font-style:normal;color:var(--muted)}
.btn-box{border:1px solid var(--ink);padding:16px;display:flex;flex-direction:column;gap:2px;align-self:start}
.btn-box h4{margin:0 0 8px;font:400 22px var(--display);border-bottom:3px double var(--ink);padding-bottom:6px}
.btn-box .r{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 0;border-bottom:1px dotted var(--rule)}
.btn-box .r span{font-size:13px;color:var(--muted)}.btn-box .r b{font:400 22px var(--display)}
.btn-box .r:last-child{border-bottom:0}
.btn-box.islive b{color:var(--live-t);text-shadow:0 0 10px rgba(31,191,92,.4)}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:3px double var(--ink);padding-top:18px}
.row3>article{padding:0 28px;display:flex;flex-direction:column;gap:8px;min-width:0}
.row3>article:first-child{padding-left:0}.row3>article:last-child{padding-right:0}
.row3>article+article{border-left:1px solid var(--rule)}
.row3 h3{margin:0;font:400 26px/1.1 var(--display);text-wrap:balance}
.row3 p{margin:0;font-size:15px;line-height:1.6;color:#3b322c}
table.box{width:100%;border-collapse:collapse;font-size:15px}
table.box th{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;padding:4px 0;border-bottom:1px solid var(--ink)}
table.box th:nth-child(-n+2),table.box td:nth-child(-n+2){text-align:left}
table.box td{padding:7px 0;border-bottom:1px dotted var(--rule);text-align:right}
table.box td:nth-child(2){font:400 17px var(--display)}
.briefs a{display:block;padding:7px 0;border-bottom:1px dotted var(--rule);text-decoration:none;font-size:14px;line-height:1.45}
.briefs a b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--clay);margin-right:6px}
@media (max-width:1000px){.front{grid-template-columns:1fr}.row3{grid-template-columns:1fr}.row3>article{padding:14px 0!important;border-left:0!important;border-top:1px solid var(--rule)}}

<style>

function editions(F){
  const all=[...F.days.map(d=>({dow:d[0],date:d[1],done:true})),...F.ahead.map(d=>({dow:d[0],date:d[1],done:false}))];
  const out=[]; let wk=0, prevEnd=-1;
  all.forEach((d,i)=>{
    const left=all.length-1-i;
    if(left===0){ out.push({id:'close',label:'Closing edition',date:d.date,ahead:F.open,def:!F.open}); return; }
    if(d.dow!=='Fri') return;
    wk++;
    const e={id:'w'+wk,week:wk,label:`Week ${wk}`,date:d.date,from:all[prevEnd+1].date,upto:i,left,final:left<=2,ahead:!d.done};
    if(e.ahead&&e.final&&F.preview){e.ahead=false;e.preview=true}
    out.push(e); prevEnd=i;
  });
  if(F.open) out.unshift({id:'live',label:'Live now',date:'updating',def:true});
  return out;
}

    let acc=0; const grad=D.map((d,i)=>{const a=acc/tot*100;acc+=d[1];return `${cols[i]} ${a}% ${acc/tot*100}%`}).join(',');

    main=`<section class="card"><div class="hrow"><h2>Sales breakdown <em>Sep 19 – Oct 19</em></h2>${seg}</div>
      ${dim==='top_sources'?`<div style="display:flex;flex-direction:column;gap:10px">${D.map(([k,v])=>`<div class="bars" style="grid-template-columns:230px minmax(0,1fr) auto"><span>${k}</span><div class="track" style="height:16px"><div style="height:16px;width:${v/D[0][1]*100}%;background:var(--clay)"></div></div><b>${money(v)}</b></div>`).join('')}</div><p class="sd">Lead sources grouped the way lead_sources.py groups them. BOB and Rewrite are not sales.</p>`

  }
  return `<div style="display:flex;flex-direction:column;gap:20px">

  </div></div></div>`;
}
